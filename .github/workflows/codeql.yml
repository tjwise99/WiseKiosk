name: CodeQL

# First-party source scanning (docs/CI.md § First-party source scanning): CodeQL's default
# code-scanning suite over the product's own Go, Svelte/TypeScript, Python and Actions source, on
# every pull request, every push to main, and weekly so a dormant branch is still covered.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id, and the matrix exception `checks.yml` documents applies here
  # too: the displayed name carries the matrix's `language` value, read back into CI.md and the PR
  # description once observed (docs/CI.md § Gate wiring).
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      security-events: write # analyze uploads the SARIF results to code scanning
      actions: read # init reads workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `queries:` input: the action's default is the code-scanning suite (docs/CI.md), so a
      # later widening to a named suite is a visible diff rather than a silent one.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
