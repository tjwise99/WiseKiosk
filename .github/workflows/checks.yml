name: checks

# Repo-wide invariant gates that need no application code. They encode what must
# always be true of the repo and hold through any rewrite. No secrets are used —
# CI never holds a credential.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Markdown links resolve inside the repo
        run: node scripts/check-links.mjs

      - name: No CRLF line endings in tracked text files
        run: |
          if git grep -lIP '\r$' -- .; then
            echo "::error::CRLF line endings found in the files above; the repo is LF-only (.gitattributes)."
            exit 1
          fi
          echo "No CRLF line endings."

  requirements:
    # Validates the Doorstop requirements tree: every TST reference resolves, no
    # suspect/unreviewed/orphan items. Runs the exact gate `just check-reqs`
    # runs — `.venv/bin/doorstop --error-all` — so CI and local cannot diverge.
    # No secrets: pure tree validation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Doorstop into a local venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Requirements tree validates (refs resolve, no suspect/unreviewed/orphan)
        run: .venv/bin/doorstop --error-all

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history — a secret is a secret even if a later commit removed it
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
