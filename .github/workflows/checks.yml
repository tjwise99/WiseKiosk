name: checks

# Repo-wide invariant gates that need no application code. They encode what must
# always be true of the repo and hold through any rewrite. No secrets are used —
# CI never holds a credential.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Markdown links resolve inside the repo
        run: node scripts/check-links.mjs

      - name: No CRLF line endings in tracked text files
        run: |
          if git grep -lIP '\r$' -- .; then
            echo "::error::CRLF line endings found in the files above; the repo is LF-only (.gitattributes)."
            exit 1
          fi
          echo "No CRLF line endings."

  requirements:
    # Validates the Doorstop requirements tree: every TST reference resolves, no
    # suspect/unreviewed/orphan items. Runs the exact gate `just check-reqs`
    # runs — `docs/requirements/.venv/bin/doorstop --error-all` — so CI and local
    # cannot diverge. The tool is siloed under docs/requirements/ with the feature
    # it serves. No secrets: pure tree validation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Doorstop into a local venv (siloed under docs/requirements/)
        run: |
          python -m venv docs/requirements/.venv
          docs/requirements/.venv/bin/pip install -r docs/requirements/requirements-dev.txt

      - name: Requirements tree validates (refs resolve, no suspect/unreviewed/orphan)
        run: docs/requirements/.venv/bin/doorstop --error-all

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a secret is a secret even if a later commit removed it
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
