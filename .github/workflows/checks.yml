name: checks

# Repo-wide invariant gates that need no application code. They encode what must
# always be true of the repo and hold through any rewrite. No secrets are used —
# CI never holds a credential.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Markdown links resolve inside the repo
        run: node scripts/check-links.mjs

      - name: No CRLF line endings in tracked text files
        run: |
          if git grep -lIP '\r$' -- .; then
            echo "::error::CRLF line endings found in the files above; the repo is LF-only (.gitattributes)."
            exit 1
          fi
          echo "No CRLF line endings."

  requirements:
    # Validates the Doorstop requirements tree: every TST reference resolves, no
    # suspect/unreviewed/orphan items. Runs the exact gate `just check-reqs`
    # runs — `docs/requirements/.venv/bin/doorstop --error-all` — so CI and local
    # cannot diverge. The tool is siloed under docs/requirements/ with the feature
    # it serves. No secrets: pure tree validation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Doorstop into a local venv (siloed under docs/requirements/)
        run: |
          python -m venv docs/requirements/.venv
          docs/requirements/.venv/bin/pip install -r docs/requirements/requirements-dev.txt

      - name: Requirements tree validates (refs resolve, no suspect/unreviewed/orphan)
        run: docs/requirements/.venv/bin/doorstop --error-all

  architecture:
    # Validates the LikeC4 architecture model and regenerates every generated
    # output — the artifacts under docs/architecture/ and the diagrams spliced
    # into docs/ARCHITECTURE.md — then fails on any drift (`git diff
    # --exit-code`): the staleness gate that mirrors the repo's "CI fails on
    # stale generated code" rule for the architecture layer. The gate step is
    # byte-identical to `just check-arch` (whose regenerate half is the
    # `arch-export` recipe) — CI and local cannot diverge; the install step
    # equals `just arch-install`. The tool is siloed under docs/architecture/
    # with the feature it serves. Browser-free: bundled WASM graphviz, no
    # chromium. No secrets: pure model validation + codegen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install LikeC4 into the silo (docs/architecture/), locked
        run: npm --prefix docs/architecture ci

      - name: Architecture model validates and generated artifacts are not stale
        run: |
          docs/architecture/node_modules/.bin/likec4 validate docs/architecture/model
          docs/architecture/node_modules/.bin/likec4 codegen mermaid docs/architecture/model -o docs/architecture/generated
          node scripts/splice-arch-diagrams.mjs
          git diff --exit-code docs/architecture/ docs/ARCHITECTURE.md

  process:
    # Process gates (ADR 0006): the branch is named type_number-snake_name and
    # links an open issue labeled with its type; the PR title — the commit that
    # reaches main under squash-merge — is a Conventional Commit. Byte-identical
    # to the local recipes: `just check-branch`, and the same validator the
    # .githooks/commit-msg hook runs (here with --pr-title, dropping the
    # fixup!/squash!/merge allowances that never reach main). head_ref and the
    # PR title are attacker-controlled, so they enter run steps only via env
    # mapping, never inline. GITHUB_TOKEN is the GitHub-provided read-only
    # token (API rate limits), not a custom credential.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Branch named type_number-snake_name and linked to an open, type-labeled issue
        env:
          HEAD_REF: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-branch.mjs "$HEAD_REF"

      - name: PR title is a Conventional Commit (the squash-merge commit on main)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          node scripts/check-commit-msg.mjs --pr-title "$RUNNER_TEMP/pr-title"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — a secret is a secret even if a later commit removed it
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
