name: checks

# Repo-wide invariant gates that need no application code. They encode what must
# always be true of the repo and hold through any rewrite. CI holds no custom
# credential — the only token is the GitHub-provided read-only GITHUB_TOKEN.
on:
  push:
    branches: [main]
  pull_request:
    # edited: the process gate validates the PR title, so title fixes must re-run it
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# A superseded pull-request head cancels its own run. A push run gets a group of its own, keyed on
# the sha: in a shared group a newly queued run replaces the pending one even with cancel-in-progress
# false, and a replaced push run is a push whose commits the secret scan never walks. `queue: max`
# would keep a shared group safe, but the pinned actionlint's schema rejects the key.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every job's `name:` equals its id: required status checks key on the displayed name.
  # Every check with a local form runs as its `just` recipe — the recipe body is the one
  # spelling of what runs here and locally (docs/CI.md § Gate wiring) — and every setup-just
  # step pins `just-version:`, so the executor CI depends on is a decided version, not a float.
  docs-and-hygiene:
    name: docs-and-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install pre-commit into a local venv (siloed under scripts/)
        run: |
          python3 -m venv scripts/.venv
          scripts/.venv/bin/pip install -r scripts/requirements-dev.txt

      - name: No untracked, non-ignored file is present
        run: just check-untracked

      # lychee runs offline from the digest-pinned official image over the tracked Markdown set
      # (ADR 0016 rev 5); docker is not assumed on a contributor machine, so the step is a named
      # CI-only exception (docs/CI.md § Gate wiring) rather than a `just verify` check.
      # The file list is materialised and tested non-empty before lychee runs: a failed or empty
      # listing has judged nothing and must not read as a clean scan.
      - name: Every relative Markdown link resolves (lychee, offline)
        run: |
          git ls-files '*.md' > "$RUNNER_TEMP/tracked-md"
          test -s "$RUNNER_TEMP/tracked-md"
          docker run --rm -i -v "$PWD:/repo:ro" -w /repo lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d --offline --no-progress --files-from - < "$RUNNER_TEMP/tracked-md"

      - name: Every pre-commit-stage hook passes over every tracked file
        run: just check-hooks

      - name: The decisions directory and its index table agree
        run: just check-adr-index

      - name: Every ADR citation pins that ADR's current rev
        run: just check-adr-revs

      - name: Every tracked document outside a dot-directory is claimed by the documentation index
        run: just check-docs-index

      - name: No manifest at the repository root, no recipe is a shell script, and every Dependabot entry resolves to its manifest
        run: just check-repo-silo

      - name: Workflow supply-chain and privilege audit (zizmor, pedantic persona, offline audit set)
        uses: docker://ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 # 1.29.0
        with:
          args: --persona=pedantic .github/workflows

      - name: Workflow schema and expression lint (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: Every tracked file is a declared authored or derived kind
        run: just check-languages

  requirements:
    name: requirements
    # Validates the Doorstop requirements tree: every TST reference resolves, no
    # suspect/unreviewed/orphan items, no item claims a verification method its
    # children do not support, and no item's statement cites another item by
    # identifier. Runs `just check-reqs` and `just check-citations`, the recipes
    # the local gate runs, which read the tree through the same venv; which
    # commands those are is the recipes' own bodies. The tool is siloed under
    # docs/requirements/ with the feature it serves. No secrets: pure tree
    # validation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install Doorstop into a local venv (siloed under docs/requirements/)
        run: |
          python -m venv docs/requirements/.venv
          docs/requirements/.venv/bin/pip install -r docs/requirements/requirements-dev.txt

      - name: Every requirements-tree check passes, and the proposed-item backlog prints (reports; not a gate)
        run: just check-reqs

      - name: Every citation resolves and carries its item header
        run: just check-citations

  docs-site:
    name: docs-site
    # Builds the docs site with -W: a broken cross-reference or orphaned page
    # fails the gate. Deploy is a separate workflow (pages.yml) so this job
    # stays read-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the docs-site toolchain into a local venv (siloed under docs/site/)
        run: |
          python -m venv docs/site/.venv
          docs/site/.venv/bin/pip install -r docs/site/requirements-dev.txt

      - name: Regenerate needs pages from Doorstop and build the docs site (warnings-as-errors)
        run: just check-site

  architecture:
    name: architecture
    # Validates the LikeC4 architecture model and regenerates every generated
    # output — the artifacts under docs/architecture/ and the diagrams spliced
    # into docs/ARCHITECTURE.md — then fails on any drift (`git diff
    # --exit-code`): the staleness gate that mirrors the repo's "CI fails on
    # stale generated code" rule for the architecture layer. Then the model and
    # the Doorstop tree are resolved against each other in both directions.
    # Doorstop is read through the requirements silo's venv and LikeC4 through
    # the architecture silo's node_modules, each with the feature it serves.
    # Browser-free:
    # bundled WASM graphviz, no chromium. No secrets: pure model validation +
    # codegen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install LikeC4 into the silo (docs/architecture/), locked
        run: npm --prefix docs/architecture ci

      - name: Install Doorstop into a local venv (siloed under docs/requirements/)
        run: |
          python -m venv docs/requirements/.venv
          docs/requirements/.venv/bin/pip install -r docs/requirements/requirements-dev.txt

      - name: Architecture model validates and generated artifacts are neither stale, orphaned, nor uncommitted
        run: just check-arch

      - name: Every tagged identifier resolves to an accepted item, and every accepted, active item is tagged
        run: just check-arch-trace

  boundary:
    name: boundary
    # Regenerates the Go and TypeScript boundary types from the one schema and
    # fails on any drift: the staleness gate for the boundary layer, the same
    # shape the architecture job runs for the architecture layer. Then the gate
    # itself is seeded — each side's committed types moved away from the schema
    # in a temp copy of the tree — so a gate that has stopped deciding anything
    # fails here rather than reporting agreement. Each generator is pinned in
    # the silo it belongs to: oapi-codegen through backend/go.mod's tool
    # directive, openapi-typescript through frontend/package-lock.json. No
    # secrets: pure codegen and comparison.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install the Go module's dependencies into the silo (backend/), locked
        run: go -C backend mod download

      - name: Install openapi-typescript into the silo (frontend/), locked
        run: npm --prefix frontend ci

      - name: The committed boundary types are what the schema generates, and the generated Go compiles
        run: just check-boundary

      - name: The drift gate above fails on seeded drift, one language at a time, and passes once regenerated
        run: just check-boundary-selftest

  process:
    name: process
    # Process gates (ADR 0006 rev 4): the branch is named type_number-snake_name and
    # links an open issue labeled with its type; the PR title — the commit that
    # reaches main under squash-merge — is a Conventional Commit. The branch check
    # is `just check-branch`, handed the PR's head ref, reading its pattern from
    # scripts/branch-shape.regex; the title runs through the hook layer's pinned
    # commitlint (ADR 0016 rev 5) against the pull-request-title configuration,
    # which drops the fixup!/squash!/merge allowances that never reach main.
    # The branch check also gates the recorded PR↔ticket
    # linkage: the PR's Development field (closingIssuesReferences) must link
    # the branch's issue on every base, so the ticket closes when the PR merges
    # into the default branch.
    # head_ref and the PR title are attacker-controlled, so they
    # enter run steps only via env mapping, never inline. GITHUB_TOKEN is the
    # GitHub-provided read-only token (API rate limits, GraphQL read), not a
    # custom credential.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Branch named type_number-snake_name, its issue open, type-labeled, milestoned and parented to match the PR base
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just check-branch "$HEAD_REF"

      - name: Install pre-commit into a local venv (siloed under scripts/)
        run: |
          python3 -m venv scripts/.venv
          scripts/.venv/bin/pip install -r scripts/requirements-dev.txt

      - name: PR title is a Conventional Commit (the squash-merge commit on main)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title"
          COMMITLINT_TITLE_FILE="$RUNNER_TEMP/pr-title" scripts/.venv/bin/pre-commit run commitlint-pr-title --hook-stage manual

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the scan walks a commit range, which a shallow clone does not carry
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
