name: publish

# Builds the container image and publishes it to GHCR. Separate from checks.yml so the read-only
# verification pipeline never needs elevated permissions: `packages: write` is held by this
# workflow's one job, and it elevates the GitHub-provided GITHUB_TOKEN rather than adding a stored
# credential. It never runs from a pull request — publishing is a write, and a head this repository
# has not merged must not reach it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Every job's `name:` equals its id: required status checks key on the displayed name.
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io under the GitHub-provided token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built under emulation; this runner is amd64.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Eight of the nine OCI keys are this action's defaults and `.revision` is the commit it runs
      # on; `.documentation` is not defaulted and is supplied as a literal, on both surfaces
      # (ADR 0015 rev 2). The annotation levels are declared here rather than restated elsewhere,
      # because the annotation check reads them from this workflow (docs/CI.md § Publishing and
      # provenance). `latest` is the tag the committed deployment recipe references
      # (docs/DEPLOYMENT.md § Bring-up).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/tjwise99/wisekiosk
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.documentation=https://tjwise99.github.io/WiseKiosk/
          annotations: |
            org.opencontainers.image.documentation=https://tjwise99.github.io/WiseKiosk/

      # provenance and sbom stay off: what this publishes is a plain annotated image, and the
      # attestation set is #67's.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
