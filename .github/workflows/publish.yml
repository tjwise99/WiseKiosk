name: publish

# Builds the container image and publishes it to GHCR, and uploads the deployment recipe and
# example configuration to the release that triggered the run. Separate from checks.yml so the
# read-only verification pipeline never needs elevated permissions: `contents: write` and
# `packages: write` are held by this workflow's one job, and it elevates the GitHub-provided
# GITHUB_TOKEN rather than adding a stored credential. Runs on `release: published`, keyed on the
# tag whose shape the first step asserts.

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Every job's `name:` equals its id: required status checks key on the displayed name.
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets and edit release notes
      packages: write # push to ghcr.io under the GitHub-provided token
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Release tag is vMAJOR.MINOR.PATCH
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built under emulation; this runner is amd64.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Eight of the nine OCI keys are this action's defaults and `.revision` is the commit it runs
      # on; `.documentation` is not defaulted and is supplied as a literal, on both surfaces
      # (ADR 0015 rev 2). The annotation levels are declared here rather than restated elsewhere,
      # because the annotation check reads them from this workflow (docs/CI.md § Publishing and
      # provenance). `latest` moves to this release's image only when the release is not a
      # pre-release (docs/DEPLOYMENT.md § Bring-up).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          images: ghcr.io/tjwise99/wisekiosk
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}
          labels: |
            org.opencontainers.image.documentation=https://tjwise99.github.io/WiseKiosk/
          annotations: |
            org.opencontainers.image.documentation=https://tjwise99.github.io/WiseKiosk/

      # provenance and sbom stay off: what this publishes is a plain annotated image, and the
      # attestation set is #67's.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false

      # `--clobber` makes a re-run of this job replace rather than fail on an asset it already
      # uploaded.
      - name: Upload the deployment recipe and example configuration to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" deploy/compose.yaml deploy/config.example.json --clobber

      # Drops any existing line naming this image's digest before appending the current one, so a
      # re-run of this job leaves exactly one such line rather than two.
      - name: Append the published digest to the release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          DIGEST_LINE: "Image: ghcr.io/tjwise99/wisekiosk@sha256:${{ steps.build.outputs.digest }}"
        run: |
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/notes.md"
          sed -i '\#^Image: ghcr\.io/tjwise99/wisekiosk@sha256:#d' "$RUNNER_TEMP/notes.md"
          printf '%s\n' "$DIGEST_LINE" >> "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
