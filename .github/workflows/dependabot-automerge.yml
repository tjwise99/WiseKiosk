name: dependabot-automerge

# Separate from checks.yml so the read-only verification pipeline never holds
# write scope: only this workflow carries `contents: write` + `pull-requests:
# write`, and only to enable auto-merge on a Dependabot PR. The merge itself is
# GitHub's, gated on every required check in checks.yml passing — this workflow
# never merges, it only arms auto-merge, and only for patch and minor bumps.
# Major bumps arm nothing and wait for a human (owner decision, 2026-08-20).

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

# A re-pushed Dependabot head supersedes its own arming run; the merge itself is
# GitHub's and unaffected.
concurrency:
  group: dependabot-automerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automerge:
    name: automerge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # queue the auto-merge (the merge push is GitHub's, once checks pass)
      pull-requests: write # set the PR's auto-merge state
    steps:
      - name: Read the Dependabot update type
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Arm squash auto-merge for patch and minor bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
