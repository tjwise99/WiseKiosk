version: 2
updates:
  # GitHub Actions — the only ecosystem with a manifest today. Grouped so a
  # week's bumps land as one PR, not a flood.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dev tooling (Doorstop) — siloed under docs/requirements/ with the
  # feature it serves. Grouped like the Actions block so a week's bumps land as
  # one PR.
  - package-ecosystem: pip
    directory: "/docs/requirements"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  # Python dev tooling (Sphinx + MyST + sphinx-needs docs site) — siloed under
  # docs/site/ with the feature it serves. Grouped like the blocks above so a
  # week's bumps land as one PR.
  - package-ecosystem: pip
    directory: "/docs/site"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  # Python dev tooling (pre-commit) — siloed under scripts/ with the hook
  # layer it serves. Grouped like the blocks above so a week's bumps land as
  # one PR.
  - package-ecosystem: pip
    directory: "/scripts"
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  # Node dev tooling (LikeC4 architecture-as-code) — siloed under
  # docs/architecture/ with the feature it serves, so its manifest and lockfile
  # live there and this block points at that directory, not the repo root.
  # Grouped like the blocks above so a week's bumps land as one PR.
  - package-ecosystem: npm
    directory: "/docs/architecture"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Go modules (the code generator pinned by the tool directive, and what the
  # backend will import) — siloed under backend/ with the package it serves.
  # Grouped like the blocks above so a week's bumps land as one PR.
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ["*"]

  # Node packages for the application frontend — siloed under frontend/ with
  # the package it serves, and separate from the architecture silo's block so
  # each root's bumps arrive against the root they belong to. Grouped like the
  # blocks above so a week's bumps land as one PR.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Base images for the container build — the Dockerfile sits at the repository
  # root (ADR 0021 rev 1), which is the one manifest location outside a silo, so
  # this block points there and keeps every `FROM` digest fresh. Grouped like the
  # blocks above so a week's bumps land as one PR.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
