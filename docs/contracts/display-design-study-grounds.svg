<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 462" role="img" aria-label="The same data row rendered over three reflected grounds — the deployed treatment on the top row, the corrected treatment on the bottom. Read across: only the ground changes.">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2f22"/>
      <stop offset="0.45" stop-color="#4b3d2b"/>
      <stop offset="1" stop-color="#2a2119"/>
    </linearGradient>
    <linearGradient id="bright" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d8579"/>
      <stop offset="0.5" stop-color="#b9b3a6"/>
      <stop offset="1" stop-color="#6f6a60"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="902" height="462" fill="#2e2e2e"/>

  <!-- Row 1 · deployed treatment: hours 15px #999 weight 300, ride 20px #fff weight 300 -->
  <rect x="2" y="2" width="298" height="228" fill="#050505"/>
  <rect x="302" y="2" width="298" height="228" fill="url(#room)"/>
  <rect x="602" y="2" width="298" height="228" fill="url(#bright)"/>

  <g font-family="monospace" font-size="11" fill="#8d9298">
    <text x="22" y="34">GROUND BLOCKED · true black</text>
    <text x="322" y="34">REFLECTED ROOM · warm cabinetry</text>
    <text x="622" y="34">REFLECTED COUNTER · lit surface</text>
  </g>
  <g font-family="sans-serif" font-size="15" font-weight="300" fill="#999999">
    <text x="22" y="130">Magic Kingdom</text><text x="280" y="130" text-anchor="end">8:00 AM – 11:00 PM</text>
    <text x="322" y="130">Magic Kingdom</text><text x="580" y="130" text-anchor="end">8:00 AM – 11:00 PM</text>
    <text x="622" y="130">Magic Kingdom</text><text x="880" y="130" text-anchor="end">8:00 AM – 11:00 PM</text>
  </g>
  <g font-family="sans-serif" font-size="20" font-weight="300" fill="#ffffff">
    <text x="22" y="175">The Barnstormer</text><text x="280" y="175" text-anchor="end">Closed</text>
    <text x="322" y="175">The Barnstormer</text><text x="580" y="175" text-anchor="end">Closed</text>
    <text x="622" y="175">The Barnstormer</text><text x="880" y="175" text-anchor="end">Closed</text>
  </g>

  <!-- Row 2 · corrected treatment: hours 22px #fff weight 500, ride 26px #fff weight 500 -->
  <rect x="2" y="232" width="298" height="228" fill="#050505"/>
  <rect x="302" y="232" width="298" height="228" fill="url(#room)"/>
  <rect x="602" y="232" width="298" height="228" fill="url(#bright)"/>

  <g font-family="monospace" font-size="11" fill="#8d9298">
    <text x="22" y="264">CORRECTED · 22 / 26, full emission</text>
    <text x="322" y="264">CORRECTED · reflected room</text>
    <text x="622" y="264">CORRECTED · reflected counter</text>
  </g>
  <g font-family="sans-serif" font-size="22" font-weight="500" fill="#ffffff">
    <text x="22" y="366">Magic Kingdom</text><text x="280" y="366" text-anchor="end">8:00 AM – 11:00 PM</text>
    <text x="322" y="366">Magic Kingdom</text><text x="580" y="366" text-anchor="end">8:00 AM – 11:00 PM</text>
    <text x="622" y="366">Magic Kingdom</text><text x="880" y="366" text-anchor="end">8:00 AM – 11:00 PM</text>
  </g>
  <g font-family="sans-serif" font-size="26" font-weight="500" fill="#ffffff">
    <text x="22" y="410">The Barnstormer</text><text x="280" y="410" text-anchor="end">Closed</text>
    <text x="322" y="410">The Barnstormer</text><text x="580" y="410" text-anchor="end">Closed</text>
    <text x="622" y="410">The Barnstormer</text><text x="880" y="410" text-anchor="end">Closed</text>
  </g>
</svg>
