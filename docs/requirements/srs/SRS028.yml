header: |
  Short-lived negative caching of upstream failures
level: 1.28
links:
- SYS021: iDFNl3INnR6LXeRlHUt0mPuuu4hVYgASAMic3R19skU=
normative: true
rationale: |
  Without negative caching, every client request during an outage retries
  upstream, in tension with SYS021's "never an unbounded relay"; caching the
  failure for the full success TTL would instead pin a transient blip for 10–15
  minutes. A short negative TTL is the middle course. The value is chosen in #6.
ref: ''
reviewed: CD8Ow7vCkfhC3tlXvrsRAq7h622ZnZ89s7hr28oNucw=
status: accepted
text: |
  The backend shall cache an upstream failure for a negative time-to-live
  shorter than the source's success TTL, so that a sustained upstream outage
  does not cause an upstream request on every incoming request, while still
  letting the module recover promptly once the upstream returns.
verification-method: test
