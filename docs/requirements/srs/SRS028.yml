status: proposed
text: |
  The backend shall declare a media type on every response it serves, and shall instruct the browser
  not to infer one.
verification-justification: |
  Both halves are asserted on the wire against served responses: that a media type is declared, and
  that the response forbids inference. What the check does not settle is whether a declared type is
  the correct one for the bytes beneath it - an upstream that mislabels its own payload is outside
  what this obligation reaches.
verification-method: test
