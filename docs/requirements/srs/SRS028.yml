header: |
  Short-lived negative caching of upstream failures
level: 1.28
links:
- SYS006: KZtswOlxN1xD3PUvRX2djU9sCMFBskYb-6W5Iq6nOdo=
normative: true
rationale: |
  Without negative caching, every client request during an outage retries
  upstream, in tension with SYS006's "never an unbounded relay"; caching the
  failure for the full success TTL would instead pin a transient blip for 10–15
  minutes. A short negative TTL is the middle course. The value is chosen in #6.
ref: ''
reviewed: OsQ-jKTz_tdrqqiU1VW_4YDCODN9-ISG6y5EK3PLaxQ=
status: accepted
text: |
  The backend shall cache an upstream failure for a negative time-to-live
  carried by that route's registration entry (SRS034), shorter than that
  route's success TTL, so that a sustained upstream outage does not cause an
  upstream request on every incoming request. The next request after the
  negative TTL elapses shall refetch from upstream.
verification-method: test
