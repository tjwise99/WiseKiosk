status: accepted
text: |
  The repository's comment checks shall not be represented as deciding whether a comment carries
  rationale; that determination shall be carried as a named review obligation.
verification-justification: |
  Whether a check's own documentation over-claims - whether the comment gates are described as
  deciding rationale - is a reading of that prose against what the checks actually decide. No parser
  compares a claim about a check to the check's behaviour, and the residue this item assigns to a
  reader is by definition the part no check reaches.
verification-method: inspection
