normative: true
rationale: |
  SYS043's closing clause - properties of a comment that are not mechanically decidable shall be
  carried as named review obligations rather than assumed - has no other child. SRS093, SRS094 and
  SRS095 are all mechanical, so this item is where that clause lives. What it uniquely carries was
  never "no rationale in comments"; SRS087 has always owned that. It is that the gate set does not
  decide it, and that the residue is assigned to a reader rather than assumed away. Stating the
  prohibition again would have made this a restatement of SRS087 and left SYS043's clause homeless.
  The same move is already accepted in SRS093, whose second clause constrains how its check may be
  represented. Dual-parented, and checked by hand as the requirements README asks: each parent
  supports the whole obligation independently - SYS042 because misplaced rationale is what the
  reader is looking for, and SYS043 because its closing clause reserves the undecidable residue for
  review rather than assuming it away.
