status: accepted
text: |
  The park-wait-times module shall show the rides a park's held reading does not, a few at a time in
  turn, advancing which it shows at the interval its configuration names rather than one fixed in the
  module.
verification-justification: |
  Read from a rendered page handed a payload carrying more rides than a park's held reading shows, under
  a driven clock and at least two distinct values of the rotation-interval configuration: which rides are
  shown changes when each configuration's interval elapses and not before, and every ride not held is
  shown across a full cycle.
  What it cannot settle is that the interval used is exactly the configured number to the second - a
  driven-clock render assertion reads before and after a boundary, not a stopwatch - nor whether touring
  the remainder is a good way to present it, which is a design judgement this item does not reach. It is
  bounded by the payloads and configurations the suite supplies.
verification-method: test
