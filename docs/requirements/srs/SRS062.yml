reviewed: vtT5crJ-8TGxFiq2Cou-2iTjBHKuoehbpLdibsM9j8E=
status: accepted
text: |
  The wait times the module shows shall be no more than five minutes behind what its source reports.
verification-justification: |
  Read from a rendered page against a source staged to change its answer: within the bound, and without
  the page being reloaded, what the region shows is the changed wait rather than the old one.
  What it cannot settle is how far behind the queue the source itself runs, which is another party's
  system and outside this one - so what is bounded is the display's distance from its source, not a
  viewer's distance from the queue. Nor does it settle the behaviour of a page left running far longer
  than a check runs: the bound is asserted over the span the harness holds the page open, so an ageing
  that appears only after days is outside it.
verification-method: test
