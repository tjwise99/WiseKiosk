rationale: |
  Gates the whole image - operating-system and base-layer packages included -
  which the source-level dependency gate never inspects.
ref: ''
reviewed: yI6UTTHoR-bzfNK9tr0x3NUpADIUush1m6l8zXnW-9k=
status: accepted
text: |
  Continuous integration shall scan the built container image for known
  vulnerabilities and shall fail the build when any finding is present, at any
  severity, unless that finding has a current entry in the
  vulnerability-exception register (SRS098). Every finding shall be reported in
  the job's output, at any severity and regardless of exception status.
verification-method: test
