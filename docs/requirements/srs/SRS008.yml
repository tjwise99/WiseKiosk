text: |
  A standalone validator shall check a configuration file against the
  configuration schema without starting the application. It shall report every
  validation error in operator language — what is wrong, where, and what to
  change — exit non-zero for an invalid configuration, and exit zero for a
  valid one.
verification-method: test
