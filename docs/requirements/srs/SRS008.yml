rationale: |
  The falsifiable edge of by-construction confinement
  (SYS003<!-- A deployment is parameterised from outside the image -->): a canary secret planted
  through the delivery path and asserted absent from every response and log line turns the
  structural claim into a failing test. Upstream request URLs and echoed upstream errors are the
  classic leak paths this guards.
ref: ''
reviewed: 1qCQzCWM5bM1Q9Y8NjlxHeuhegvz37D7vq3z4pFE-JY=
status: accepted
text: |
  No secret value shall appear in any HTTP response body or header, nor
  in any log output, produced by the backend. Where backend output must
  refer to a secret, it shall do so by the secret's name, never its value.
verification-justification: |
  Asserted by planting a canary secret and sweeping response bodies, headers and log output for its
  value. What no check settles is the case where a secret is transformed before it is emitted - a
  hash or a prefix of a key would not match the canary and would still be a leak.
verification-method: test
