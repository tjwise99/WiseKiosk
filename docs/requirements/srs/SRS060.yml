status: accepted
text: |
  The park-wait-times module shall arrange the parks it shows in a grid whose column and row counts its
  configuration names.
verification-justification: |
  Read from a rendered page under at least two grid-shape configurations naming the same parks: the
  cards are laid out in the column and row counts each configuration names, and a second shape re-lays
  the same parks.
  What it cannot settle is whether a chosen shape reads well at the deployed viewing distance - a denser
  grid draws smaller cards, which is a judgement about a real display in a real room - nor that every
  shape a configuration might name fits the region the module is given.
verification-method: test
