rationale: |
  Turns "a dependency should be updated" into "merge is blocked". The
  reachability allowance keeps the Go gate actionable rather than noisy.
ref: ''
reviewed: WaKsKXSLwOAlJ4Mv4ORCgiSqIl1DlySOn2Zqf3a0bS0=
status: accepted
text: |
  Continuous integration shall fail a pull request when any resolved Go-module
  or npm dependency has a known vulnerability, at any severity, unless that
  finding has a current entry in the vulnerability-exception register (SRS098).
  For the Go toolchain the gate may consider reachability - a vulnerability in
  code that is present but never called need not fail the gate. Every advisory
  the scan resolves shall be reported in the job's output, at any severity and
  regardless of reachability or exception status.
verification-method: test
