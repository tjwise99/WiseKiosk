text: |
  Continuous integration shall fail a pull request when any resolved Go-module
  or npm dependency has a known vulnerability at or above the configured
  severity threshold. For the Go toolchain the gate may consider reachability -
  a vulnerability in code that is present but never called need not fail the
  gate.
