rationale: |
  Structural wiring makes "wired into CI" the default for a new test rather than a step an author can
  forget. Distinct from SRS037, which owns per-module *presence* of the two required test kinds; this
  owns repo-wide runner *reachability*.

  TST `dead-test-scanner` — verification-method: test — PENDING (active: false) — header
  `Pending: repo-level dead-test detector`. Text: enumerates committed test files (Go `_test.go`;
  frontend `*.test.*`/`*.spec.*`) and asserts each falls under a configured runner's reach; fails on a
  file excluded by skip, build tag, glob gap, or wrong directory. Lands with the first application
  test runners (go.mod / Vitest config); activated with a `references` entry then. The requirements
  tier is already covered by `doorstop --error-all` — do not re-encode it here.
