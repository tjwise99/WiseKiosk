reviewed: hinXA-FpDpOB475foj4PVs0Fe82kf4tckwlVRRV-gkM=
status: accepted
text: |
  Each language test runner shall be invoked in its whole-tree discovery form (e.g. `go test ./...`,
  the frontend runner's default glob), with no hand-maintained per-file test list and no
  skip/build-tag/ignore entry that silences a committed test file, so a new test file is wired into
  CI by its location alone. A negative gate fixture committed as data and materialised into a
  temporary tree at run time is not an exclusion under this requirement: it is not a committed test
  file, so whole-tree discovery has nothing to silence.
verification-method: test
