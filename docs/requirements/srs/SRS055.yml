reviewed: jCGMl1Y5DAc7-VylwMo5sMOlFSNe2OBy6j9Aa3RZJ9A=
status: accepted
text: |
  The park-wait-times module shall declare the known-good constraint the park its requests carry must
  satisfy, admitting a theme park it recognises and no other value.
verification-justification: |
  Read against the constraint the module declares, exercised without a network: a request naming a park
  the module recognises is admitted and one naming anything else is rejected with nothing sent upstream.
  What it cannot settle is that an admitted park is one the source has wait times for right now. A park
  the module recognises may still be answered poorly or not at all by the source on a given day, which is
  an upstream failure rather than a rejection, and the boundary between the two is what this item fixes
  rather than something it proves right.
verification-method: test
