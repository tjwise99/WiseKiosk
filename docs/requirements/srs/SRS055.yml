text: |
  The park-wait-times module shall declare the known-good constraint the park its requests carry must
  satisfy, admitting a park drawn from its supported set and no other value.
verification-justification: |
  Read against the constraint the module declares, exercised without a network: a request naming a park
  in the module's supported set is admitted and one naming anything else is rejected with nothing sent
  upstream.
  What it cannot settle is that an admitted park is one the source answers for right now, which is an
  upstream non-answer surfaced by the failure path rather than a rejection; nor whether the supported set
  the module holds still matches what the source offers - keeping the baked-in set current against the
  source is the scheduled upstream-drift check's concern (docs/CI.md, Upstream contract checks), a
  mechanism of its own rather than something this item is failed against.
verification-method: test
