reviewed: ZdSLdSk86kozJ5Ar7kgCfItzrNBTtmCKvI4gsFKoJPQ=
status: accepted
text: |
  The weather module shall issue no more than one request to its source for any one location in any
  five minutes while that source is failing to answer.
verification-justification: |
  Read over the requests the module's route issues against a source staged to fail and a driven
  clock, with the route called far oftener than the bound permits: no more than one request leaves
  for one location in any five minutes.
  What it cannot settle is what the source makes of being retried while it is down - another party's
  tolerance for that is its own policy, published or not and changed without notice - nor whether
  five minutes is the right trade between noticing a recovery and leaving a struggling source alone,
  which is argued in the item rather than decided by any check. It is asserted under a clock the
  harness drives and over the window the suite runs, so a failure lasting longer than the suite
  stages is outside it.
verification-method: test
