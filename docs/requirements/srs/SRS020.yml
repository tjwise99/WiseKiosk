header: |
  Non-root container user
level: 1.53
links:
- SYS006: v3qSjDNbCins9CcqouJY2Vp6K1NhBAlUsPS8az2R1Kc=
normative: true
rationale: |
  SYS006's <!-- Neither grant privilege nor require it --> least-privilege half made falsifiable on
  the artifact: a process holding no more than it needs bounds what a compromise reaches, and root
  inside a container is the largest single grant available to it. The image is where this is
  decidable - the running user is a property of what was published, not of how an operator starts
  it.
ref: ''
reviewed: IR4fxX4YgiOyIsyE7FEnmeZBmSHsllH1ecnQck9seCk=
status: accepted
text: |
  The container image shall run as a non-root user.
verification-justification: |
  Asserted by inspecting the published image's declared user. What no check settles is what an
  operator does at run time: a deployment can override the user, and no property of the image
  prevents it.
verification-method: test
