normative: true
rationale: |
  The case no reference-resolution or regenerate-diff check reaches: a doc's claim stops matching
  reality with no broken link and no stale generated file to catch it. Named as a requirement so it is
  a stated review obligation, not assumed practice — it stays outside CI by nature, not by omission.
ref: ''
reviewed: UOkw1802u--LKoNePfBfIyLyPsxn28Isn3aoHFbnymg=
status: accepted
text: |
  When a change touches code or configuration that a canonical document describes, the change shall
  update the describing document or declare in the change that no update is needed.
verification-justification: |
  A check can prove the describing document was touched or an exemption declared; it cannot prove
  the resulting prose is now true of the code it describes, which is a judgement about meaning. The
  mechanical half - a registry mapping each canonical document to the paths it describes, asserted
  over the merge-base diff - is not yet built, and is tracked rather than assumed.
verification-method: inspection
