header: |
  The reserve spans what a reflection needs
level: 34
links:
- SYS008: AIuMYg7wHcfKr7RHldDawSRFk9RFv2Bb_t_vqiXoTfE=
normative: true
rationale: |
  Erosion is silent: content added a module at a time takes the mirror gradually, each step looking
  like the last, until the want the display was built for is gone with nothing having failed. A named
  span makes the loss observable at the step it happens.
  "The largest" rather than "a" keeps this item and the placement item on one region; otherwise a
  shallow strip could be placed while a squarer region carried the span, and the parent's
  single-region want would be discharged by neither.
  The two fractions are not independent of the text-size floor, the edge inset and the centring
  tolerance - a centred reserve pushes content outward and the inset forbids the outer band - so they
  are calibrated as a set. A configuration too dense for content to fit around the reserve gets no
  rendered failure state (owner, 2026-08-08): the degraded display is the signal.
ref: ''
reviewed: DKCdh5wA2hWCbbxImVE9IujWmguBWpBLxrMpff1LZE0=
status: accepted
text: |
  The largest contiguous region of the display held at minimum emission shall span at least a minimum
  fraction of the display's width and a minimum fraction of its height.
verification-justification: |
  Asserted by computing the largest contiguous region carrying no content from rendered geometry and
  comparing its two spans against the floor, over configurations chosen to load the display. Three
  bounds. The check reads a region carrying no content where this item obliges one at minimum
  emission, so a layout satisfying either through a dark-rendered element diverges from the other.
  Geometry is element boxes rather than lit pixels, making the computed region a lower bound. And the
  fractions are a decision about how much of a person the product returns, held with the check.
verification-method: test
