header: |
  The reserve spans what a reflection needs
level: 34
links:
- SYS008: yDPug9SYCBgbwHf9O9BLWWL3QAwl-drSHv-TZBgJJoU=
normative: true
rationale: |
  Erosion is silent: content added a module at a time takes the mirror gradually, each step looking
  like the last, until the want the display was built for is gone with nothing having failed. Naming
  a span makes the loss observable at the step it happens.
  The item states the end state rather than how a layout reaches it, because an order of construction
  cannot be falsified from a rendered page where a span can be measured off one. "The largest" rather
  than "a" keeps this item and the placement item on the same region; under an existential reading a
  shallow strip could be placed while a squarer region elsewhere carried the span, and the parent's
  single-region want would be discharged by neither.
  The two fractions are not independent of the text-size floor, the edge inset and the centring
  tolerance: a centred reserve pushes content outward, the inset forbids the outer band, and the floor
  sets how wide a row must be. Tightening one can make another unreachable with no check objecting,
  so they are calibrated as a set.
  A configuration too dense for content to fit around the reserve gets no rendered failure state
  (owner, 2026-08-08): the degraded display is the signal, and nothing has failed - a choice has been
  made badly.
