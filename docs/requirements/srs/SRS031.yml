header: |
  The reserve is taken first, and content laid around it
level: 34
links:
- SYS008: EzRvyFcrLJTbeQVTE829rysIoqaknMd6VTNv7UaLwCQ=
normative: true
rationale: |
  Erosion is silent: content added a module at a time takes the mirror gradually, each step looking
  like the last, until the want the display was built for is gone with nothing having failed. What
  prevents that is not a rule about configurations but an order of construction - the region is taken
  before content is placed, so content is laid around it rather than into it.
  An earlier draft obliged the property "under every configuration the display accepts", which was
  more than anyone intends to verify and more than the product promises. Configured volume is not
  bounded by the module roster being fixed at five: a single module may be instanced many times, and
  the deployed kiosk instances one of them six times. So a universal quantifier over configurations
  is a claim that cannot be discharged, and stating it would have put this item in conflict with the
  layout obligations - a reserve pushes content outward, the edge inset forbids the outer band, and a
  text-size floor sits under whatever ring remains.
  A configuration dense enough that content will not fit around the reserve is met with no rendered
  failure state, and that is a ruling rather than an omission (owner, 2026-08-08): the degraded
  display is itself the signal the operator needs, and rendering a message to announce that the
  display will look wrong is a second and worse way of saying what is already visible. Nor is it a
  failure in the sense the legibility-of-failure need carries - nothing has failed, a choice has been
  made badly.
