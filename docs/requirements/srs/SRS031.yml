status: accepted
text: |
  The display shall hold a contiguous region at minimum emission spanning at least a minimum fraction
  of its width and a minimum fraction of its height, and shall lay no configured content into that
  region.
verification-justification: |
  Asserted by computing a contiguous region carrying no content from rendered geometry and comparing
  its two spans against the floor, over configurations chosen to load the display. Three bounds. The
  check decides a region carrying no content where this item obliges a region at minimum emission;
  the two coincide only while
  SRS030<!-- Unoccupied surface is held at minimum emission --> holds, so a violation of that item
  would leave this check passing an obligation that has failed. Geometry is measured as element
  boxes, so a box that is largely empty counts as occupied and the computed region is a lower bound
  on the region a viewer actually gets - conservative in one direction, and silent about a layout
  whose boxes are compact while its lit pixels are not. And the two fractions are a decision about
  how much of a person the product returns; they are held with the check so that revisiting them is
  not a change to this obligation.
verification-method: test
