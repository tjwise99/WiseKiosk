status: accepted
text: |
  When a prose obligation in a canonical document is formalized as a requirement, the same change
  shall edit the prose to cite the new requirement ID and shall stop stating the obligation as
  independent normative text. That the cited ID resolves is asserted by SRS082.
verification-justification: |
  Whether prose has stopped stating an obligation as independent normative text, rather than
  appending an ID to an unchanged sentence, is a reading of what the prose asserts. The decidable
  half - that the cited identifier resolves - is SRS082's. The item constrains authorship and leaves
  no artifact recording whether it was followed; it is kept because an implementer consults the tree
  before acting.
verification-method: inspection
