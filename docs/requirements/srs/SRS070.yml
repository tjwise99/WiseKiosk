header: |
  No gate asserts a coverage percentage as a quality bar
level: '1.70'
links:
- SYS033: 8JVl-8S6Q2GtSeokKqVEBRNJ3wGfssHlc49w4LOJvf8=
normative: true
rationale: |
  Distinguishes coverage-as-closure (permitted, ADR 0005 gate 3) from coverage-as-quality-number
  (forbidden), so the requirement does not read as "no coverage gate at all".

  TST `coverage-stance-inspection` — verification-method: inspection — ACTIVE — references `justfile`
  and, once it exists, the coverage-closure gate config. Confirms no gate asserts a coverage % quality
  bar. (While no coverage gate yet exists, the inspection confirms the absence.)
ref: ''
reviewed: X0ZdfjnpchrvNuyOiGmSyKoCUrfrFG6ex5_uT9rbvMM=
status: accepted
text: |
  No gate in `just verify` or CI shall assert a coverage percentage as a pass/fail quality
  threshold. No gate configuration shall carry a coverage-threshold construct - a minimum-percentage
  setting, a threshold flag, or a target figure compared against a coverage number. The coverage
  gate, where present, shall fail only on uncovered source that is neither exempted nor justified
  (ADR 0005 gate 3), not on a target number.
verification-justification: |
  The prohibition is on treating a coverage percentage as a quality bar, which an unbounded set of
  configuration forms could express. The enumerated construct scan is a floor that fails open on the
  first tool whose flag it does not know - acceptable because the harm is a misleading gate rather
  than a leaked secret, and stated so the floor is not mistaken for proof.
verification-method: inspection
