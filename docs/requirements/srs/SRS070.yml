rationale: |
  Distinguishes coverage-as-closure (permitted, ADR 0005 gate 3) from coverage-as-quality-number
  (forbidden), so the requirement does not read as "no coverage gate at all".

  TST `coverage-stance-inspection` — verification-method: inspection — ACTIVE — references `justfile`
  and, once it exists, the coverage-closure gate config. Confirms no gate asserts a coverage % quality
  bar. (While no coverage gate yet exists, the inspection confirms the absence.)
ref: ''
reviewed: pCJ3BMgnokZvE9fsG-yX-u82WktazwW6IMGz_Tpvjog=
status: proposed
text: |
  No gate in `just verify` or CI shall assert a coverage percentage as a pass/fail quality threshold;
  the coverage gate, where present, shall fail only on uncovered source that is neither exempted nor
  justified (ADR 0005 gate 3), not on a target number.
verification-method: inspection
