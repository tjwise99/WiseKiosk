rationale: |
  Gives the altitude rule a concrete home in the existing `just verify` / CI structure.

  TST `check-altitude-inspection` — verification-method: inspection — ACTIVE — references `justfile`
  (the `verify` recipe enumerating the repo-spanning checks). Confirms the repo-spanning checks are
