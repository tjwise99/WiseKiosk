status: accepted
text: |
  The repository-level verification target (`just verify`, mirrored in CI) shall own every
  repo-spanning check; no repo-spanning check shall be hosted inside a single package's own test
  target. The set of repo-spanning checks shall be recorded in one place, and every recorded check
  shall appear in the verification target (asserted with SRS067's parity check).
verification-justification: |
  Classifying an arbitrary check as repo-spanning or package-local requires reading what it asserts,
  and the failure of concern is by definition the check not yet recorded - a new repo-spanning check
  written into a package's own suite, which no assertion over the recorded set can see. Conformance
  to the recorded set is decidable and is asserted with SRS067.
verification-method: inspection
