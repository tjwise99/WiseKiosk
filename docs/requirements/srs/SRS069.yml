text: |
  The repository-level verification target (`just verify`, mirrored in CI) shall own every
  repo-spanning check; no repo-spanning check shall be hosted inside a single package's own test
  target. The set of repo-spanning checks shall be recorded in one place, and every recorded check
  shall appear in the verification target (asserted with SRS067's parity check).
verification-method: inspection
