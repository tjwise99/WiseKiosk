reviewed: o9HQHRXk_09LrNVpCl--blJ0EUApKF0m463cBZ02r-M=
status: accepted
text: |
  The park-wait-times module shall put across the boundary, for each park a request names, the park's
  name, its operating hours, and for each of the park's rides the ride's name together with its current
  wait - a length of time, or that the ride is not operating.
verification-justification: |
  Read from the module's shaping run against a captured response from its source, without a network: for
  the park the request named, what it produces carries the park's name and operating hours and, for each
  ride, the ride's name with a wait that is either a length of time or a not-operating state.
  What it cannot settle is that any of it is true of the queue, the source being another party's system
  and outside this one. It is also bounded by the captures a suite holds: a response the source can
  return and no capture contains is unasserted here, which includes a source that answers with a ride's
  wait missing, so what is settled is the shaping of the responses that were captured rather than of
  every response the source can produce.
verification-method: test
