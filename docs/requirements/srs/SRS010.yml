header: |
  The display page reaches no origin but the backend's
level: 1.21
links:
- SYS004: zDeVzrtkJX0x8iRss9MhCXDMfx62PK7NqmJJoh2OQ9c=
normative: true
rationale: |
  Proxying even CORS-permitting sources is what makes the single-origin data plane hold for every
  source rather than most. Two mechanisms carry it: the page issues no direct cross-origin fetch, and
  a connect-src content-security policy enforces that on the wire rather than by convention.

  Reopen premise. A frame denial and a referrer policy were considered here and dropped. Both defend
  a browsing user against another origin - clickjacking needs an embedder and someone to click, and
  referrer leakage needs the cross-origin request this item already forbids - and a wall-mounted
  display has neither. Frame denial also forecloses an operator embedding the display in a dashboard
  of their own, which nobody decided to give up. Revisit if the page is ever served beyond the LAN,
  or to a browser a person also browses with. Nothing stops the middleware setting either header; what
  is dropped is the obligation, not the option.
ref: ''
reviewed: 4le5oWt-0wu6G6_ERW5LQK2leA7bvyngTYLolKg6ZIg=
status: accepted
text: |
  The display page shall be unable to reach any network origin other than the backend's.
verification-justification: |
  Asserted statically against the shipped bundle and dynamically with request interception, with the
  content-security policy enforcing the same clause at the browser. What no check settles is a
  request issued by code that reached the page some other way - the assertion covers what this
  project ships.
verification-method: test
