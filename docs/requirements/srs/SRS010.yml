rationale: |
  The falsifiable edge of by-construction confinement (SYS003): a canary
  secret planted through the delivery path and asserted absent from every
  response and log line turns the structural claim into a failing test.
  Upstream request URLs and echoed upstream errors are the classic leak
  paths this guards.
ref: ''
reviewed: V74e2cUNk8G6rE40usvr70VIWcZ5ReswduU2I1mbJGI=
status: accepted
text: |
  No secret value shall appear in any HTTP response body or header, nor
  in any log output, produced by the backend. Where backend output must
  refer to a secret — as in the failure treatment of SRS004 — it shall do
  so by the secret's name, never its value.
verification-method: test
