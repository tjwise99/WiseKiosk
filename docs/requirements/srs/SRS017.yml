header: |
  Full-screen assembly at kiosk; reflow, not overlap, at narrower widths
level: 1.41
links:
- SYS002: PlSjFH4xZA1G0BAj8r5IyQAw1ZI43ovYVM-4-yIoh0g=
normative: true
rationale: |
  Decomposes SYS002's<!-- The configured layout renders whole and reads --> kiosk-primary, desktop-secondary
  distinction into the concrete viewport-driven render obligations its rationale anticipates, which
  fixes no viewports itself. The deployed display is a 16:9 television, so 1920×1080 landscape is
  the canonical kiosk test viewport; relative units carry the same layout to 4K without a second
  viewport. 1280×800 and 1440×900 are the desktop window sizes the secondary use case must render
  sensibly at. Phone widths are deliberately not a requirement
  (SYS002<!-- The configured layout renders whole and reads -->; owner decision 2026-07-22) — if wanted
  later, support arrives as its own reviewed system need, not a clause here. What is owed is a
  reflowing layout, not a responsive-design programme, and the viewport figures are
  TST035's<!-- Pending: viewport-driven layout render test --> so tuning one does not touch the
  specification. Verified by viewport-driven render tests (Playwright-class) asserting the
  structural properties at each size; the residual aesthetic judgement stays human.
ref: ''
reviewed: osBw48Y05zAu8uBTckauRE2_-M6hBFmWOWWhGfPBfWA=
status: accepted
text: |
  The display page shall assemble the modules named in the configuration, each
  into its configured region of a single full-screen layout. The assembled layout
  shall exhibit no overlapping regions and no clipped content at the kiosk
  viewport, and shall reflow without overlap, clipping, or horizontal scrolling at
  narrower ones.
verification-justification: |
  Asserted by rendering a fixture configuration at three viewports and reading the resulting
  geometry and region set. Overlap and clipping are decidable; whether a person across the room can
  read what they enclose is not settled here, and is not this item's to settle -
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> carries the software's
  contribution to it, as SRS032<!-- Readable content is carried at full emission --> carries the
  other half - a minimum size and a full emission, neither a proof that anyone can read the result. What the kiosk
  actually needs is not thereby settled; it is carried by items rather than by none.
verification-method: test
