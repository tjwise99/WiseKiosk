header: |
  Full-screen assembly at kiosk; reflow, no horizontal scroll, at narrower widths
level: 1.41
links:
- SYS002: Zxe531jtUatE-VuJ4tpFFwvPcfWJ6Oup1VJEk-d-GGQ=
normative: true
rationale: |
  Decomposes SYS002's<!-- The display's rendering keeps nothing from a viewer --> kiosk-primary,
  desktop-secondary distinction, fixing no viewports itself: the figures are
  TST035's<!-- Pending: viewport-driven layout render test --> so tuning one does not touch the
  specification. What is owed is a reflowing layout, not a responsive-design programme. Phone widths
  are deliberately not a requirement (owner decision 2026-07-22) - if wanted later, support arrives
  as its own reviewed system need, not a clause here.
  The region set is the page's, so its disjointness is obliged here, and at every viewport rather
  than the kiosk alone: a layout that overlaps only when narrowed is the case a reflow obligation
  exists to catch. A configuration cannot express a geometry, so two modules can never be told to sit
  on top of one another - overlapping regions are a page defect rather than an operator's choice.
  These bounds are on what the page lays out, not on what content does to it afterwards.
  SRS031<!-- Content too large for its region overflows --> carries that, and what it permits -
  content crossing a region, or leaving the display - is not a breach of the bounds stated here.
ref: ''
reviewed: 481IpZfMXgMospkGAyD8raK4xP7wttz7FA_9IoJqSpE=
status: accepted
text: |
  The display page shall lay out its regions across a single full-screen display, no two overlapping
  and the set reflowing without horizontal scrolling, at any viewport it supports; and shall assemble
  into each region the modules the configuration names there.
verification-justification: |
  Asserted by rendering at three viewports and reading the laid-out regions against each other and
  against the viewport, and each module's rendered place against the region the configuration named
  for it. Disjointness and horizontal overflow are both decidable from rendered geometry and scroll
  extents.
  The obligation covers every viewport the page supports while the check samples three, so a layout
  that first overlaps at a fourth passes.
  Whether a person across the room can read the result is not settled here and is not this item's to
  settle: of the software's two contributions to that,
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> carries the type
  scale and SRS032<!-- Readable text is carried at full emission --> the emission, and neither is
  a proof that anyone can read anything.
verification-method: test
