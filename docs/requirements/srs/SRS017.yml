reviewed: uF03QRbBEIpaJPMnqn3dFg07YVVzmCL61XZkPKfAmeU=
status: accepted
text: |
  The display page shall lay out its regions across a single full-screen display so that no two
  overlap at any viewport it supports, and so that the set reflows without horizontal scrolling as
  the viewport narrows; and shall assemble into each region the modules the configuration names
  there. Content exceeding the region it was given shall overflow that region's bounds rather than be
  clipped, scrolled or scaled to fit, at any viewport, and where overflow and either the disjointness
  or the no-horizontal-scroll bound cannot both hold, the content is kept.
verification-justification: |
  Asserted by rendering at three viewports and reading the laid-out regions against each other and
  against the viewport, then reading each module's content against the region it was given - over a
  fixture whose content exceeds its region, so the overflowing case is measured rather than assumed.
  Disjointness, horizontal overflow, and whether content was clipped, scrolled or scaled are all
  decidable from rendered geometry and scroll extents.
  The precedence clause is what the check cannot fully reach. It can show the page keeps content in
  the colliding case, and it cannot enumerate the configurations that produce a collision, because
  how much any region is asked to hold follows from the configuration and from what upstream
  returned. So the assertion is that the layout is disjoint and does not scroll sideways, and that
  content is kept where it collides with either - not that no configuration collides.
  Whether a person across the room can read the result is not settled here and is not this item's to
  settle: of the software's two contributions to that,
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> carries the type
  scale and SRS032<!-- Readable content is carried at full emission --> the emission, and neither is
  a proof that anyone can read anything.
verification-method: test
