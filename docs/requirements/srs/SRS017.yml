rationale: |
  A declared minimum host has no headroom to absorb a leak, so unbounded
  growth breaks the claim SYS008 makes. Stated so it is provable early —
  from a bounded instrumented run rather than a full-length soak — and
  continuously, rather than only at a pre-release demonstration.
