normative: true
rationale: |
  Decomposes SYS002's<!-- Each module renders within its region, and reads --> kiosk-primary,
  desktop-secondary distinction into the concrete viewport-driven render obligations its rationale
  anticipates, which fixes no viewports itself. The deployed display is a 16:9 television, so
  1920×1080 landscape is the canonical kiosk test viewport; relative units carry the same layout to
  4K without a second viewport. 1280×800 and 1440×900 are the desktop window sizes the secondary use
  case must render sensibly at. Phone widths are deliberately not a requirement
  (SYS002<!-- Each module renders within its region, and reads -->; owner decision 2026-07-22) — if
  wanted later, support arrives as its own reviewed system need, not a clause here. What is owed is a
  reflowing layout, not a responsive-design programme, and the viewport figures are
  TST035's<!-- Pending: viewport-driven layout render test --> so tuning one does not touch the
  specification.
  An earlier text also obliged the assembled layout to exhibit no overlapping regions and no clipped
  content. Neither is the page's to promise while the configuration assigns the regions: two regions
  told to overlap will be rendered overlapping, faithfully. What survives is the half the page does
  decide - that a module's content stays inside the region it was given, and that the document does
  not scroll sideways when the viewport narrows. Reopen when what the page does with content
  exceeding its region - wrap, scale, clip, overflow - is decided, because a clipping obligation
  needs that answer and colliding with the type-scale floor is what makes it a decision rather than
  an omission.
ref: ''
reviewed: cX2dSPjcEPk8rNGtMvA0Ct8g15C2wZIMBEnmL_UQiaw=
status: accepted
text: |
  The display page shall assemble the modules named in the configuration, each into its configured
  region of a single full-screen layout, rendering every module's content within the bounds of the
  region it was given. The assembled layout shall reflow without horizontal scrolling at narrower
  viewports.
verification-justification: |
  Asserted by rendering a fixture configuration at three viewports, reading each module's box against
  the region it was assigned and the document's scroll width against the viewport's. Containment and
  horizontal overflow are decidable. Whether a person across the room can read what a region encloses
  is not settled here and is not this item's to settle: of the software's two contributions to it,
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> carries the
  type scale and SRS032<!-- Readable content is carried at full emission --> the emission, and
  neither is a proof that anyone can read the result. What the configuration composes is not settled
  here either - two assigned regions may overlap, and the page renders the overlap faithfully.
verification-method: test
