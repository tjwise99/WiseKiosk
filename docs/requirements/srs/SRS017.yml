normative: true
rationale: |
  Decomposes SYS002 (kiosk full-screen, the primary target) and SYS002 (desktop,
  the supported secondary) into the concrete viewport-driven render obligations
  their rationales anticipate. The deployed display is a 16:9 television, so
  1920×1080 landscape is the canonical kiosk test viewport; relative units carry
  the same layout to 4K without a second viewport. 1280×800 and 1440×900 are the
  desktop window sizes the secondary use case must render sensibly at. Phone
  widths are deliberately not a requirement (SYS002; owner decision 2026-07-22) —
  if wanted later, support arrives as its own reviewed system need, not a clause
  here. What is owed is a reflowing layout, not a responsive-design programme,
  and the viewport figures are TST038's so tuning one does not touch the
  specification. Verified by viewport-driven render tests
  (Playwright-class) asserting the structural properties at each size; the
  residual aesthetic judgement stays human.
ref: ''
reviewed: null
status: accepted
text: |
  The display page shall assemble the modules named in the configuration, each
  into its configured region of a single full-screen layout. The assembled layout
  shall exhibit no overlapping regions and no clipped content at the kiosk
  viewport, and shall reflow without overlap, clipping, or horizontal scrolling at
  narrower ones.
verification-justification: |
  Asserted by rendering a fixture configuration at three viewports and reading the resulting
  geometry and region set. What no check settles is whether the layout is legible to a person across
  a room - overlap and clipping are decidable, readability at distance is the property the kiosk
  actually needs and no assertion reaches it.
verification-method: test
