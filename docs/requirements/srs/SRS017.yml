header: |
  Full-screen assembly at kiosk; reflow, no horizontal scroll, at narrower widths
level: 1.41
links:
- SYS002: ToFVbPFp9IatUvVWKKn-3S83c7ebsKajo1MUVxVHdbE=
normative: true
rationale: |
  Decomposes SYS002's<!-- Each module renders in full, and reads --> kiosk-primary,
  desktop-secondary distinction, fixing no viewports itself: the figures are
  TST035's<!-- Pending: viewport-driven layout render test --> so tuning one does not touch the
  specification. What is owed is a reflowing layout, not a responsive-design programme. Phone widths
  are deliberately not a requirement (owner decision 2026-07-22) — if wanted later, support arrives
  as its own reviewed system need, not a clause here.
  The region set is the page's, so its disjointness is obliged here, and at every viewport rather
  than the kiosk alone: a layout that overlaps only when narrowed is the case a reflow obligation
  exists to catch. A configuration cannot express a geometry, so two modules can never be told to sit
  on top of one another - overlapping regions are a page defect rather than an operator's choice.
  Content too large for the region it was given overflows (owner, 2026-08-08). Clipping and scrolling
  hide content the operator asked for; scaling to fit drives type below the floor
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> sets, so the
  display would stay whole by becoming unreadable. Overflow is the only one of the four that hides
  nothing and reads at distance, and it makes a region given too little space visibly wrong rather
  than quietly lossy.
  A configuration dense enough to overflow badly gets no rendered failure state (owner, 2026-08-08):
  the degraded display is the signal an operator needs. Nothing has failed, so it is not the case
  SYS001<!-- Failure is legible and proportionate --> carries, and no configuration is rejected, so
  the allocation of configuration validation is untouched.
  Where overflow collides with disjointness or the no-horizontal-scroll bound, the text says content
  is kept rather than leaving it to a check. Both bounds are therefore obligations on what the page
  lays out, not on what content does to it afterwards.
