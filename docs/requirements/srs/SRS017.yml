reviewed: 32DiTWj7Nd_PZ2aQi_giU_IvKyG2EIq3UD-ECpMjQXE=
status: accepted
text: |
  The display page shall assemble the modules named in the configuration, each into its configured
  region of a single full-screen layout. Content exceeding the region it was given shall overflow
  that region's bounds rather than be clipped, scrolled or scaled to fit. The assembled layout shall
  reflow without horizontal scrolling at narrower viewports.
verification-justification: |
  Asserted by rendering a fixture configuration at three viewports, reading each module against the
  region it was assigned - with a fixture whose content exceeds its region, so the overflowing case is
  measured rather than assumed - and the document's scroll width against the viewport's. Whether
  content was clipped, scrolled or scaled is decidable from the rendered box and the scroll extents.
  Whether a person across the room can read it is not settled here and is not this item's to settle:
  of the software's two contributions to that,
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> carries the type
  scale and SRS032<!-- Readable content is carried at full emission --> the emission, and neither is
  a proof that anyone can read the result. What the configuration composes is not settled here
  either - two assigned regions may overlap, and the page renders the overlap faithfully. One case
  the two clauses here cannot both cover: content overflowing past the viewport's own edge extends
  the scrollable area, so a region given far too little space trades the no-horizontal-scroll
  property for the no-hiding one. The obligation is written to keep content rather than the property,
  and no check claims otherwise.
verification-method: test
