reviewed: NsHh2adbeSni8C4ZXTJrzBQP-yD_Xx_EnlXZhWKoqtA=
status: accepted
text: |
  While the backend is unreachable a module that fetches nothing shall go on rendering, neither
  standing down nor putting a state of its own in its place.
verification-justification: |
  Read from a rendered page whose backend is unreachable: the module's region still carries its
  content, still changing where its content changes, rather than being empty or carrying a message.
  Two things bound it. Unreachability is staged by the harness - one manner of failure among refusal,
  timeout, a wrong answer and a network that swallows the request - so this is evidence that a module
  taking nothing from the backend is undisturbed by one, rather than proof that no manner of outage
  can disturb it. And the obligation quantifies over every module that fetches nothing while the
  evidence today reads one of them, so what is settled is the claim for the modules actually
  exercised; each local module added brings its own reading of this item rather than inheriting one.
  What the display says about the outage is a different item's, and this check asserts nothing about
  it.
verification-method: test
