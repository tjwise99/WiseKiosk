header: |
  The clock goes on showing the time through a backend outage
level: 43
links:
- SYS009: tElibr5RJkXKnVo8YvMo4twKGHUtpZDziNHYYOIyKQQ=
normative: true
rationale: |
  A module that fetches has to stand down when the backend is gone, because a display cannot say the
  same outage once per region
  (SRS026<!-- The display says when the backend is gone -->). The clock fetches nothing, so nothing it
  shows is any less true for the backend being unreachable, and standing down would take from a viewer
  something the outage never touched. That is the half stated here: this item says the clock keeps
  rendering, and says nothing about the report, which is the page's and is already obliged.
  Nor is it the module's own unavailable state
  (SRS001<!-- A failed module shows why, and only that module -->), which a module renders for one
  cause and no other - its own source failing while the backend answered. The clock has no source that
  can fail that way.
  Reworded to name another local module the sentence would be equally true, which is the tell for a
  framework obligation, and no framework item says it today. Stating it here is the owner's call, taken
  knowingly (owner, 2026-08-27): when a second local module needs the same sentence that is the reopen
  trigger ADR 0012 rev 2 names, and the shared half is promoted to the framework then rather than
  guessed at now.
ref: ''
reviewed: WpXHbmoqHDksi3LAjQ4UwCWhikfZN-Mp1MFoFZXMp8c=
status: accepted
text: |
  While the backend is unreachable the clock module shall go on showing the time, neither standing down
  nor putting a state of its own in its place.
verification-justification: |
  Read from a rendered page whose backend is unreachable: the clock's region still carries a time, and
  it is still advancing, rather than being empty or carrying a message.
  What it cannot settle is every way a backend can be gone. Unreachability is staged by the harness -
  one manner of failure among refusal, timeout, a wrong answer and a network that swallows the request
  - so this is evidence that the clock does not depend on the backend rather than proof it cannot be
  disturbed by one. What the display says about the outage is a different item's, and this check
  asserts nothing about it.
verification-method: test
