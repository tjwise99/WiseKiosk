header: |
  Module components render from props and reach nothing else
level: '1.40'
links:
- SYS024: Hn5rIJlgWLcF4C2eS7P0aHqLN91cK86es9PFca9Afv4=
normative: true
rationale: |
  Props are the whole interface. A component that reaches past them for data or configuration
  reintroduces the coupling the module contract exists to prevent, and it does so invisibly - the
  component still renders, and nothing fails until the shape it reached for moves. The payload prop
  is conditional because a local module has none (SRS039, and the two module shapes in the module
  contract); requiring one of every component contradicted the clock exactly as SRS034 did before it
  was scoped. Payload validation is deliberately not stated here. It is SRS032's obligation under
  SYS041, where it is honestly inspected: a defensive type or null guard is indistinguishable from
  render logic to any check, so a copy of that clause in this item claimed a machine settles what a
  reader has to. The word "solely" is dropped for the same reason - the prohibitions are what it
  meant, and it added nothing a check could use.
ref: ''
reviewed: r2KXIhS3pPYS_ERoDYVoe09QKsmkEOu-Q-4WTuG-m4s=
status: accepted
text: |
  Each display module shall be rendered by a Svelte component that receives its configuration as a
  prop, and - where the module has one - its payload as a prop, and renders them into the module's
  region. The component shall issue no data fetch and shall not read the configuration source
  directly: every configuration value it uses shall arrive as a prop.
verification-method: test
