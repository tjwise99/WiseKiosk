header: |
  A module that fetches nothing renders on through an outage
level: 43
links:
- SYS001: VGhozQiiHRgx8gA75WcFC3WXgp9KCc4dS_FDyA8tuGg=
normative: true
rationale: |
  A module that fetches has to stand down when the backend is gone, because a display cannot say the
  same outage once per region
  (SRS026<!-- The display says when the backend is gone -->). A module that fetches nothing shows
  nothing that is any less true for the backend being unreachable, so standing it down would take from
  a viewer something the outage never touched - degrading more of the display than the failure
  requires, which is what the parent forbids. That is why this sits beside the report rather than
  under it: one obliges the page to say the outage once, this obliges the outage to cost nothing it
  need not cost. Neither implies the other, and the display is only right when both hold.
  It is not a module's own unavailable state
  (SRS001<!-- A failed module shows why, and only that module -->), which is rendered for one cause
  and no other - the module's own source failing while the backend answered. A local module has no
  source that can fail that way.
  This was first written as the clock's, then promoted. Reworded to name any other local module the
  sentence is identical, which is the tell for a framework obligation; what the tell could not settle
  is whether the framework already said it, and it did not. Promoting it before a second local module
  arrived is the alternative to waiting for the duplicate that would have proved it - the wait was
  available and was refused, because an obligation true of every local module is not made truer by a
  module restating it.
