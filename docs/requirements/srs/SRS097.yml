header: |
  Every gate job is a required check, and every required check names a real job
level: 1.97
links:
- SYS010: tunYeRPYjw1wheyLpOCTyiWRFVEHtFbzAcMgHdU_J_I=
normative: true
rationale: |
  A job that runs on every pull request but sits outside the required-status-check set reports its
  result and can fail nothing. It is green in the same place a real gate is green, which is the whole
  difficulty: the gap is invisible exactly where a reader looks for assurance. The reverse entry — a
  required name matching no job — fails the other way, blocking every pull request on a check that
  will never report.

  This is one fact about repository configuration and it belongs to one item. SRS058, SRS059, SRS060
  and SRS062 each carried "as a required check" in their own text, and four verification items each
  tried to assert it; six items half-owning one configuration fact is how it ended up asserted
  nowhere. Those items now state only what their scanner does, and requiredness is proved here.

  Verifiable at all only because branch protection is expressed as a ruleset: ruleset rules are
  readable with the workflow's own token, where classic branch protection required an admin-scoped
  read that SYS003 keeps out of CI.
ref: ''
reviewed: GxO6ipFuPE-al4ir1sOkqVJz60uoIeckUUpnA0d6F7M=
status: proposed
text: |
  Every continuous-integration job that gates merges shall appear in the repository's
  required-status-check set for the default branch, and every entry in that set shall name a job the
  checks workflow defines. A gate job absent from the set, or a set entry naming no defined job,
  shall fail.
