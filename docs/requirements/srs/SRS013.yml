normative: true
rationale: |
  ADR 0007: the page shell runs validation itself and owns the presentation of
  its result. Failure classes are enumerated because SYS003's never-a-blank-
  screen intent covers more than schema errors — an absent, unfetchable, or
  unparseable file must be as legible as an invalid one. Scoped to "no valid
  configuration applied" so a future live-apply path keeps the freedom to hold
  last-good on a bad reload.
ref: ''
reviewed: rPCebG_zzzS3ns7vK-cFNLbyBLuQKRK2-x8WcBYGtQw=
status: accepted
text: |
  When no valid configuration has been applied — the configuration file
  absent, unfetchable, unparseable, or failing schema validation — the display
  page shall render a plain-language error state naming which failure
  occurred. For schema-validation failures it shall render the validation
  report in operator language: for each error, what is wrong, where, and what
  to change. The page shell shall load and render this state without requiring
  a valid configuration.
verification-method: test
