header: |
  Page renders the validation report when the configuration is invalid
level: 1.13
links:
- SYS003: null
normative: true
rationale: |
  ADR 0007: the page shell runs validation itself and owns the presentation of
  its result — full diagnostic context, mapped to the configuration the
  operator authored. Scoped to "no valid configuration applied" so a future
  live-apply path keeps the freedom to hold last-good on a bad reload.
ref: ''
status: proposed
text: |
  When no valid configuration has been applied, the display page shall render
  the validation report in operator language — for each error: what is wrong,
  where, and what to change. The page shell shall load and render this state
  without requiring a valid configuration.
verification-method: test
