header: |
  Outbound upstream timeout and response-size bound
level: 1.27
links:
- SYS021: szam5gPHPMXdmfL7WtI-9KiX_Buai2NqsFGsqXwXkB8=
normative: true
rationale: |
  SYS021 bounds the system's upstream use in volume, and SRS001 reports a
  timeout failure class — but nothing else imposes a timeout or a size limit, so
  a hung or oversized upstream could stall the handler or exhaust the single
  process. This item imposes the bounds that make those failure classes real.
ref: ''
reviewed: Ylvr1cIsdBuGdWyMU7eW9_HyS7532JplfcllQIMqpYg=
status: accepted
text: |
  The backend shall impose an outbound timeout on each upstream request and a
  maximum size on each upstream response it will accept. Exceeding either shall
  be handled as an upstream failure (the timeout or malformed-response classes
  of SRS001) and shall not wedge the request handler or exhaust process memory.
verification-method: test
