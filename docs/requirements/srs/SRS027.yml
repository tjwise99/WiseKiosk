header: |
  Outbound upstream timeout and response-size bound
level: 1.27
links:
- SYS021: szam5gPHPMXdmfL7WtI-9KiX_Buai2NqsFGsqXwXkB8=
normative: true
rationale: |
  SYS021 bounds the system's upstream use in volume, and SRS001 reports a
  timeout failure class — but nothing else imposes a timeout or a size limit, so
  a hung or oversized upstream could stall the handler or exhaust the single
  process. This item imposes the bounds that make those failure classes real.
ref: ''
reviewed: wldUb-D4P8zwdSl7se0oflUptoeWqr4XOPj-X9SENpg=
status: accepted
text: |
  The backend shall impose on each upstream request the outbound timeout, and
  on each upstream response the maximum accepted size, carried by that route's
  registration entry (SRS034). Exceeding either shall be handled as an upstream
  failure (the timeout or malformed-response classes of SRS001). On exceeding
  the size bound the backend shall stop reading after at most the bound plus one
  buffer, and the request handler shall remain able to serve subsequent
  requests.
verification-method: test
