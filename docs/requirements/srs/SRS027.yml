header: |
  The display page holds no device capability it does not use
level: 30
links:
- SYS006: v3qSjDNbCins9CcqouJY2Vp6K1NhBAlUsPS8az2R1Kc=
normative: true
rationale: |
  Split from the reachability item, whose text had carried this as a trailing clause. The two
  decompose from different needs: reaching no foreign origin is the single-origin data plane
  (SYS004<!-- Upstream data reaches the display only through the backend -->), while holding no
  capability beyond what is needed is SYS006's<!-- Neither grant privilege nor require it -->
  second half - a process holding no more than it needs bounds what a compromise reaches. Under one
  parent the capability clause traced to no clause of its own need, which item-level link checking
  cannot see.

  The clause was originally rescued from a dropped browser-headers item and appended here rather than
  given its own text, to avoid re-creating an item a merge had just absorbed. That reason does not
  reach the parentage question, which was never put.

  A module renders third-party data. A page that cannot reach camera, microphone, geolocation, USB,
  serial or Bluetooth cannot be made to, whatever that data turns out to contain.
ref: ''
reviewed: 2lFm_qjKuAbVT9WJ5sE_ptMJRd6IEZhduwFMSwAkvG8=
status: accepted
text: |
  The display page shall be unable to use any device feature it does not need.
verification-justification: |
  Asserted on the wire against a committed allowlist of granted features: the served policy grants
  nothing outside it, and the page still renders under the policy. Leaves unproven whether an entry on
  that allowlist is justified. Deciding which features a module legitimately needs would require
  modules to declare their capabilities, and no artifact in this repository provides for that; until
  one does, entries are added by hand and rest on review.
verification-method: test
