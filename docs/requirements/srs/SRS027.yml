header: |
  The backend runs on both supported architectures
level: 1.51
links:
- SYS008: null
normative: true
rationale: |
  Decomposes SYS008 on the backend side. The deployment model puts the backend
  on whatever small host is to hand — a Pi, a mini PC, a spare desktop — so a
  single-architecture build would make that choice for the operator. Stated as
  an obligation on WiseKiosk rather than as a fact about the host, because a
  host's capabilities are not ours to require; what is ours is running on both.
ref: ''
reviewed: null
status: accepted
text: |
  The backend shall run on both amd64 and arm64 hosts.
verification-justification: |
  Asserted by building for both architectures and running the smoke test on each. What no check
  settles is behaviour under load on either - it establishes that the binary runs, not that it runs
  well.
verification-method: test
