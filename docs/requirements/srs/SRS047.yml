header: |
  The weather module asks an answering source at most four times an hour for a location
level: 50
links:
- SYS010: dgflQFtHGeswH-PgjWmcBkfuJujSp-a-Z5JtN4H0Low=
normative: true
rationale: |
  The source is a free service run by somebody else, and a display that is never turned off asks for
  years. What ends that arrangement is not one bad hour but a steady rate somebody decides is unfair, so
  the module sets its own politeness bound low enough that a deployment left running is not throttled or
  cut off for asking too often.
  Four times an hour is what the freshness figure comes to and nothing beyond it: asking more often
  cannot make what a viewer sees fresher than that item obliges, so the extra requests would be spent
  for no viewer. The bound is per location because that is what a request is about - two displays
  configured for two places are two conversations, and one of them being busy is not a reason to starve
  the other.
  The bound is the answering source's, and the scoping is what makes the figure argued rather than
  merely stated. Four an hour is read out of the freshness figure, and that reading rests on there
  being a fresh answer already held: asking oftener cannot make what a viewer sees fresher than the
  freshness item obliges. Nothing of that argument survives a failure, where what is held is no
  answer at all, so a source that is failing is asked on a different argument and at a different
  figure, stated separately
  (SRS049<!-- The weather module asks a failing source no more often than once every five minutes -->).
  Left unscoped, this item would either be read as forbidding a retry worth making or be read as
  permitting the failure path's rate, and it cannot honestly be both. The in-flight clause is not
  scoped with it: a module that reissued on top of a slow answer multiplies its own rate exactly when
  the source is least able to bear it, and that is the same failure on either path.
  One request in flight is the second half and is not implied by the first. A module that reissued on
  top of a slow answer would multiply its own rate exactly when the source is least able to bear it,
  which is the moment a politeness bound is for; a per-hour count alone permits four at once.
  What is not restated is that the rate is bounded at all and not left for an operator to raise
  (SRS011<!-- Upstream request rate is bounded, and the bound is not operator-tunable -->). The
  framework obliges there be a bound; this says what this module's is.
