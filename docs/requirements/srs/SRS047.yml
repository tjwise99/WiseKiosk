reviewed: KRI3alkPrkXY2b5HunGDvCW6Aq9Nie_gCB5_p4w0nGw=
status: accepted
text: |
  The weather module shall issue no more than four requests an hour to its source for any one location,
  and shall have no more than one request to that source in flight at a time.
verification-justification: |
  Read over the requests the module's route issues against a staged source and a driven clock: no more
  than four leave in any hour for one location, and a second is never outstanding while a first has not
  answered.
  What it cannot settle is that this rate is one the source accepts. What a free supplier will tolerate
  is its own policy, published or not, changed without notice and not decidable here; the figure is
  chosen to sit well under what such a service is likely to permit, and a check reads what this system
  emits rather than what another party thinks of it. It is also asserted over the window the harness
  runs, so a rate that drifts only over days is outside it.
verification-method: test
