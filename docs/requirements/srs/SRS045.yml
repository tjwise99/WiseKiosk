status: accepted
text: |
  The weather module shall show both the present weather and the weather expected next, the present
  distinguishable from the expected, and the hours next to come distinguishable from the days next to
  come.
verification-justification: |
  Read from a rendered page handed a payload: the present weather and both forward ranges are all
  present, and each is separable from the other two by what is drawn.
  What it cannot settle is whether the arrangement chosen is a good one. That a viewer can tell the
  parts apart at a glance across the room is a judgement about a real display in a real room, and a
  check reads a rendered page rather than a viewer. It is also bounded by the payloads a suite supplies:
  a payload shape no case covers is unasserted here.
verification-method: test
