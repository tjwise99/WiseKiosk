header: |
  Request parameters validated against known-good per-source patterns
level: 1.23
links:
- SYS004: zDeVzrtkJX0x8iRss9MhCXDMfx62PK7NqmJJoh2OQ9c=
normative: true
rationale: |
  Validating against known-good patterns keeps malformed or unrecognized requests from reaching
  upstream and bounds the proxy so it cannot be driven to forward arbitrary requests
  (SYS004<!-- Upstream data reaches the display only through the backend -->). The client-facing
  form of a rejection is specified by SRS013<!-- Client-facing contract for rejected requests -->.
  What a given source's pattern is — a code format, an enumerated identifier set — is that module's
  own obligation under ADR 0012 rev 2, not this one's; naming examples here would put two modules'
  requirements in a framework item.

  Verification lands with the first module end-to-end (#12) rather than with the backend skeleton:
  the rejection is against the pattern a source declares, and a skeleton registers no source to
  declare one, so TST026<!-- Pending: parameter-validation rejection test --> is active from #12
  and not before. Until then this requirement is decomposed but carries no active verifying item.
  The gap is in the tree's record rather than in coverage: the skeleton does reject a non-conforming
  request without issuing an upstream request, and a test asserting it runs on every commit — what
  is missing is a verifying item that can name a declared pattern, not the behaviour or its
  exercise.
ref: ''
reviewed: Z5qNQJtHpfyr3N4yrdVReMQsHVaMBG3kEvo01SxiqEM=
status: accepted
text: |
  The backend shall validate each request's parameters against the known-good
  pattern its source declares, and shall reject a request whose parameters do not
  conform without issuing any upstream request.
verification-justification: |
  Asserted by submitting non-conforming parameters and requiring rejection with no upstream call
  issued. What no check settles is whether a source's declared pattern actually matches what that
  source accepts - the pattern is authored per source and a wrong one rejects valid requests just as
  decidably.
verification-method: test
