header: |
  No single upstream exchange can stall or exhaust the backend
level: 1.27
links:
- SYS001: TQyfJejH81RI-POadHI3gN0eM_DDB8AFAnMwcKjCth4=
normative: true
rationale: |
  SYS004 bounds the system's upstream use in volume, and SRS001 reports a
  timeout failure class — but nothing else imposes a timeout or a size limit, so
  a hung or oversized upstream could stall the handler or exhaust the single
  process. This item imposes the bounds that make those failure classes real.
ref: ''
reviewed: null
status: accepted
text: |
  No single upstream request or response shall be able to stall the backend or exhaust its
  memory.
verification-justification: |
  Asserted by a hung upstream and an oversized response against a live handler, with a concurrent
  request completing throughout. What the check does not settle is the bound's value - that a
  timeout and a size limit exist is decidable, whether they are set correctly for a real upstream is
  a judgement made when the source is added.
verification-method: test
