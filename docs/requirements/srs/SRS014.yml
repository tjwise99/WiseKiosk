header: |
  No single upstream exchange can stall or exhaust the backend
level: 1.27
links:
- SYS001: 6qFC_CQhjx9LmDh-ODsNnVL1vJeEfMTJLKl3dXhLnr8=
normative: true
rationale: |
  SYS004 <!-- Upstream data reaches the display only through the backend --> bounds the system's
  upstream use in volume, and SRS001 <!-- A failed module shows why, and only that module -->
  reports a timeout failure class — but nothing else imposes a timeout or a size limit, so a hung or
  oversized upstream could stall the handler or exhaust the single process. This item imposes the
  bounds that make those failure classes real.
ref: ''
reviewed: i1pVzlg7mBKHbPuYsglzpGCz4taBBJDc9vLYW5rX0Hs=
status: accepted
text: |
  No single upstream request or response shall be able to stall the backend or exhaust its
  memory.
verification-justification: |
  Asserted by a hung upstream and an oversized response against a live handler, with a concurrent
  request completing throughout. What the check does not settle is the bound's value - that a
  timeout and a size limit exist is decidable, whether they are set correctly for a real upstream is
  a judgement made when the source is added.
verification-method: test
