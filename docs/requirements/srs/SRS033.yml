text: |
  Each module's construction of its upstream request URL and its parsing and
  reshaping of the upstream response into the frontend payload shall be
  implemented as a library of pure functions that perform no I/O and can be
  exercised in isolation against a known upstream response without network
  access.
verification-method: inspection
