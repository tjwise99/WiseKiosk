rationale: |
  The shaping library is pure functions with no I/O, unit-tested directly — the
  valuable part — and the TESTING.md Unit tier, whose speed and totality depend
  on that purity. Complements SRS020, which governs the route's transport
  behaviour, by constraining the internal design the route invokes; the payload
  these functions produce is the value the single boundary schema defines
  (SRS029) and the module component renders from the generated type (SRS031).
