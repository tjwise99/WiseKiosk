header: |
  The backend is config-blind
level: 1.11
links:
- SYS016: yJnvlCKpHBVwFJM3ZmGJRcer-EzrbedxtexqGPvDHJw=
normative: true
rationale: |
  ADR 0007: the backend has no code path that knows the display configuration
  exists — no read, no parse, no endpoint. Operational constants are the
  answer to non-tunable keys; secret delivery via the environment is not
  configuration and is specified in the secrets domain (#35).
ref: ''
reviewed: c683F2crw_G9SaEwchf59ywotaYjIlgzs1aT2Zy7s1o=
status: accepted
text: |
  The backend shall have no configuration concept: no configuration file of
  its own, no code path that reads or parses the display configuration, and no
  tunable keys. Operational constants such as bind address and port shall be
  fixed in code.
verification-method: test
