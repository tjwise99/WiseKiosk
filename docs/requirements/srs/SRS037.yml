header: |
  Tests are the contract's fifth part; a module is incomplete without them
level: 1.37
links:
- SYS024: Hn5rIJlgWLcF4C2eS7P0aHqLN91cK86es9PFca9Afv4=
normative: true
rationale: |
  The contract ("the specific obligations in TESTING.md, not 'some tests'")
  and the TESTING.md standing obligation "Every module supplies unit tests for
  its shaping library and a render test for its component," lifted into the tree
  so per-module test presence is gated rather than trusted. This requirement
  owns the completeness obligation — that both tests exist and are wired — and
  references the render test; what the render test itself asserts (the component
  renders supplied props without fetching) is the frontend lane's separate
  behavioural verification, not re-derived here.
ref: ''
reviewed: C12kfGakQkOtdvNxkMgNkT9HlFN1ZbaAuog17pGY1Zc=
status: accepted
text: |
  Each module shall supply, as part of its contract, a render test for its component, and - where
  the module fetches an external data source - unit tests for its shaping library. Both shall be
  wired into CI. A module missing a test its shape requires is an incomplete module, not a passing
  one.
verification-method: test
