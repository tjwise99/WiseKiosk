header: |
  The masked edge band is the deployment's to declare
level: 38
links:
- SYS003: x73sA6VMR9aDga-PqTW6L49gj-iwZdgTOg5xG8VhAwM=
normative: true
rationale: |
  What the band stands in for is a bezel, or a television's overscan - a physical property of one
  installation, which distinguishes that deployment from every other and which no two need share. A
  depth compiled into the image is one deployment's figure imposed on the rest, and the need above
  admits no such value.
  Assuming none where the configuration supplies none is the honest default (owner, 2026-08-09). The
  software cannot observe the mask, so a guessed depth is a claim about hardware nobody described,
  and it costs surface on every display that has no mask at all. A deployment with no bezel and no
  overscan is then correct while saying nothing, and one with either says so once: the bezel is
  uniform, so a single depth governs all four edges, and stating it against the display's height
  keeps it one figure rather than one per axis.
  The key's name and its shape are not stated here (owner, 2026-08-09). Those are the schema's, and a
  requirement naming them would make renaming a key a specification change. What is obliged is that
  the depth comes from outside the image.
ref: ''
reviewed: zvhw2i6ddYHjyaVoNuuqI-TF3OMC4d0Si2S1Cjqto3U=
status: accepted
text: |
  The depth of the band the display page holds its regions clear of shall be supplied by the
  deployment's configuration, and where none is supplied the page shall assume none.
verification-justification: |
  Asserted by rendering with the band declared at more than one depth and reading the laid-out
  regions against each, then rendering with it undeclared and finding the regions reaching the
  display's own edge. A figure compiled into the image fails that in both directions - ignoring what
  is declared, and substituting itself when nothing is. What the check does not settle is whether the
  depth an operator writes clears the mask actually fitted: the frame and the television are theirs,
  and no assertion over a rendered page reaches a bezel.
verification-method: test
