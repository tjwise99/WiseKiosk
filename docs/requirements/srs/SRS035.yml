reviewed: r0-uFGnixoyWzxlKqScJxnWr8nU6gcGM7gZhICtLxrc=
status: accepted
text: |
  The depth of the band the display page holds its regions clear of shall be supplied by the
  deployment's configuration, and where none is supplied the page shall assume none.
verification-justification: |
  Asserted by rendering with the band declared at more than one depth and reading the laid-out
  regions against each, then rendering with it undeclared and finding the regions reaching the
  display's own edge. A figure compiled into the image fails that in both directions - ignoring what
  is declared, and substituting itself when nothing is. What the check does not settle is whether the
  depth an operator writes clears the mask actually fitted: the frame and the television are theirs,
  and no assertion over a rendered page reaches a bezel.
verification-method: test
