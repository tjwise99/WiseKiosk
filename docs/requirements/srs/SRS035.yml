header: |
  Config schema fragment composes into the single configuration schema
level: 1.35
links:
- SYS009: tf7grKzQp6z4Xnv2kCe1PEvssAsF7YR-HmGXlUTFyyM=
normative: true
rationale: |
  The module contract gives the fragment concept, reconciled here with ADR 0007
  (configuration validation is frontend-owned, run at apply time and by the desk
  validator; the backend is config-blind) and with ADR 0008's consequence that
  the configuration schema is a separate artifact from the boundary schema and
  never crosses the wire. The "validated at boot" phrasing in the earlier
  module-contract prose is superseded by ADR 0007; this requirement follows
  ADR 0007. Keeps the module contract from re-declaring configuration
  shape or opening a second single-definition regime. The module component's
  receipt of that configuration as props is the frontend lane's render concern,
  not this requirement's.
ref: ''
reviewed: N9jQxssZdbtJZHSRsA7Px7pkjm6Co6T-BG12rIkt-pA=
status: accepted
text: |
  Each module shall declare the configuration it accepts as a fragment composed
  into the one machine-readable configuration schema (SYS003); the module's
  configuration shape shall not be declared a second time anywhere, and shall be
  enforced by the single validation implementation (SRS014) both at apply time
  and by the standalone validator. A module's configuration fragment is part of
  the configuration schema and shall not cross the frontend/backend boundary.
verification-method: test
