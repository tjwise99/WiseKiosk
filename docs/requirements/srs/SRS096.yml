header: |
  The backend establishes no client identity and gates no route on one
level: '1.96'
links:
- SYS011: null
normative: true
rationale: |
  Makes SYS011's security model falsifiable. The posture itself — a deployment serves exactly one
  trusted LAN — is a fact about where the system is installed, which no check inside the repository
  can decide. What can be decided is the absence the model rests on, and that absence is precisely
  what stops being true quietly: a session added for convenience, an access check added by reflex
  during a later security pass. SYS011's rationale exists to stop that "fix"; this requirement is
  what lets a gate stop it.

  SRS020 states statelessness as a transport property of the proxy route, and this requirement
  restates the observable half as a security posture. The duplication is deliberate: SRS020's
  obligation would be satisfied by a route contract rewrite that kept per-request determinism while
  introducing an identity mechanism elsewhere, and the posture must outlive that. Stated here so the
  overlap does not read as an oversight.
ref: ''
status: proposed
text: |
  The backend shall establish no client identity and shall gate no route on one. No response shall
  carry session or authentication material, no route shall accept or reject a request on the basis
  of who sent it, and no session, authentication, or access-control middleware shall be registered
  on the request path.
