header: |
  No region is laid out within the mirror reserve
level: 38
links:
- SYS008: hcxzAWXDaJB9XZIG2gfgGXg_VS5IRfZ4uYbXzbR81YA=
normative: true
rationale: |
  The reserve survives assignment because nothing can be assigned into it: the page owns the region
  set and the configuration names a region per module, so a reserve the page declines to cover is one
  no position an operator can write addresses. That is the erosion this obligation stops, and the
  whole of it - modules stacking in an adjacent region leave each less room, and
  SRS017<!-- Full-screen assembly at kiosk; reflow, no horizontal scroll, at narrower widths -->
  obliges the excess to overflow into the reserve if that is where the region borders. Adding modules
  therefore does reach it, by the route the overflow ruling permits rather than the route this item
  closes.
  Stated over the regions the page lays out rather than over the surface that ends up empty. The
  extent and placement are the check's, so calibrating how much of a person the display returns is
  not a specification change; they are not independent of the edge inset or the region set's own
  geometry, which is why one check reads them together.
  Three obligations spend the same finite height - this reserve, the inset in
  SRS034<!-- The laid-out regions keep clear of the display edge --> and the size floor in
  SRS033<!-- Text holds a minimum size against the display, at every resolution --> - and their
  figures are calibrated as a set against a display an operator would plausibly build. Past that
  density they cannot all hold, and that is not a conflict between them to be resolved by loosening
  one: an operator who loads a region past what it can show has overloaded it, and the result is
  theirs (owner, 2026-08-09). What the page does then is already ruled - the content overflows and
  nothing is rendered to announce it. No bound on the configuration follows, and none should be
  added; the figures move together or not at all.
