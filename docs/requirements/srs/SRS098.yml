reviewed: 8BVtw__kk_xHAeDgWAOrpRMSBJgjO4KSFfqPVBb6Tyw=
status: proposed
text: |
  The repository shall maintain a committed vulnerability-exception register. A third-party
  dependency or container-image vulnerability finding shall fail continuous integration unless it has
  a current entry in that register. Each entry shall name the specific advisory, state why no fix is
  available, state why no alternative dependency or base image is viable, and carry a review date no
  more than 90 days after the entry was created or last reviewed. An entry past its review date shall
  fail. A finding in the project's own first-party source shall have no entry and no exception path.
