header: |
  Third-party findings are dispositioned in an expiring exception register, one at a time
level: 1.98
links:
- SYS010: tunYeRPYjw1wheyLpOCTyiWRFVEHtFbzAcMgHdU_J_I=
normative: true
rationale: |
  A severity threshold decides in advance that a whole class of finding is acceptable, sight unseen.
  That is the wrong shape for this project: a low-severity advisory with a published patch is a
  dependency shipping something broken, and the answer is to take the patch or take a different
  dependency. The register replaces a standing threshold with a decision per finding.

  The required justification is what makes it a decision rather than a suppression. Naming why no
  alternative dependency or base image is viable is the test the owner actually applies; an entry
  that cannot state it is an entry that should have been a version bump or a replacement.

  Entries expire because an exception register without expiry is where vulnerabilities go to be
  forgotten — it converts "accepted for now" into "accepted permanently" with no moment at which
  anyone looks again. Ninety days puts every live exception back in front of a human quarterly.

  Scoped to third-party findings deliberately. A finding in the project's own source has no exception
  path, because "someone else shipped it broken" is the whole justification the register exists to
  capture, and it is not available for code the project authors.

  This is one fact with one home, cited by the dependency and image gates rather than restated in
  each — the same reason SRS097 owns the required-check fact for six items.
