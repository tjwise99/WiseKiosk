header: |
  Nothing the page draws carries a lit ground
level: 33
links:
- SYS008: VPfvnggRFZk-lw_hS19tLa7dy6YEIx6HnnAFt0GPdyo=
normative: true
rationale: |
  The mirror is made of absence, so anything drawn where content is not is drawn at the mirror's
  expense. This forecloses the devices a designer reaches for first on a dark interface - a panel
  behind a block of text, a card, a fill marking a region's bounds, a scrim to lift a glyph off its
  background. Each is emitted light, so each brightens the ground rather than darkening it, spending
  mirror that does not come back on a legibility gain that does not arrive.
  Stated over every element the page draws rather than over the surface no content occupies, and that
  is the whole point of the wording. Under the earlier form the check sampled the surface content did
  not occupy, and occupancy is read from element boxes - so drawing a scrim removed its own area from
  the population being measured, and the item passed on a display whose mirror had been spent. Adding
  an element now adds an obligation instead of shrinking a sample, which is the only form of this
  requirement that a lit ground cannot walk out of.
ref: ''
reviewed: S6UtwEWjaVPVmeLck41_IG1UOcUoHGf03KYBqSURs88=
status: accepted
text: |
  Every element the display page draws shall have a ground at the display's minimum emission, so that
  the display emits only from the content it presents to be read.
verification-justification: |
  Asserted by reading the rendered ground of every element the page draws, the page's own root among
  them. The population is every element rather than a sampled area, so an element added to the page
  is an element the check reads. Three steps sit outside the assertion. What the page renders is not
  what the panel emits - backlight, gamma, colour profile and any tone mapping lie between them, and
  a half-silvered surface attenuates the result again - so the check settles the value the software
  chose, not the light that leaves the glass. What a viewer sees there is the reflected room, which
  the software neither supplies nor controls. And an element may still emit through its content
  rather than its ground: a bright image fills its box and this item does not forbid it, because a
  module presenting an image is presenting content.
verification-method: test
