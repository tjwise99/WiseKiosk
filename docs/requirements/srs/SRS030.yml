header: |
  Both sides generated and drift-gated
level: '1.30'
links:
- SYS023: vqoPBOFlW4NRIpov_HBa66bXY8P8VLnuvFp2lNyicUk=
normative: true
rationale: |
  A generated artifact that can drift silently reintroduces the two-definition
  defect the contract exists to kill; the enforcing gate, not the generator, is
  what makes the single-definition guarantee real (TESTING.md Boundary tier). A
  version-pinned generator keeps a toolchain bump from reading as schema drift.
ref: ''
reviewed: wOSbk7kbk2JGpCBU31tK9Sek3V-NGRyyAoIeHQG3gZQ=
status: accepted
text: |
  The backend and frontend boundary types shall be generated from the schema and
  committed to the repository with no hand edits. A continuous-integration check
  shall regenerate both sides from the schema and fail the build when any
  committed generated file differs from the regenerated output; the generators
  shall be version-pinned so that regeneration is deterministic.
verification-method: test
