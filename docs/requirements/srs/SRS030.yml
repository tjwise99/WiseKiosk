header: |
  Only content is rendered above the emission ceiling
level: 33
links:
- SYS008: xUHCdfa_Ow3zNzkpwvNkW_hwz5jaAUJTR2Gv9aw9AXA=
normative: true
rationale: |
  The mirror is made of absence, so anything drawn where content is not is drawn at the mirror's
  expense: a panel behind a block of text, a card, a fill marking a region's bounds, a scrim lifting a
  glyph off its background. Each brightens the ground rather than darkening it, spending mirror on a
  legibility gain that does not arrive over a background already dark.
  Stated as a ceiling on emission rather than as a list of permitted devices. A list decides today's
  design - and a fourth device then becomes a specification change, which is what a requirement
  naming its own devices always costs. A ceiling states the property and leaves the devices to the
  design: a hairline divider and a grouping tint dark enough sit under it, a lit card or a scrim does
  not, and how dark is dark enough is calibrated against the glass in
  TST045<!-- Pending: emitting-surface test --> rather than fixed here.
  It narrows the judgement without removing it. Whether a thing is text or imagery rendered as
  content, rather than a scrim under another name, still has to be decided - a gradient is imagery by
  every rendering definition and is the spelling that reads as legal. What changes is the population
  that decision is made over: below the ceiling nothing is classified, because nothing there spends
  the mirror, so the judgement falls only on what is bright enough to matter.
  Stated over emission rather than over the surface no content occupies, because occupancy is read
  from element boxes and a scrim would remove its own area from the population measured.
  The exemption is text and imagery, and it is the page's rather than a module's: a configuration
  that cannot be applied leaves no modules at all, and
  SRS004<!-- Page renders a legible error state for every configuration failure class --> obliges a
  legible error state anyway. Scoping it to a module's content would leave the page owing a message
  and forbidden to light it.
  What this permits is a large bright image rendered as content, which takes the mirror as surely as
  a scrim does. That is a module's design, and no item in this tree obliges otherwise.
