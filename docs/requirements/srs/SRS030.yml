status: accepted
text: |
  Only the text and imagery the display page presents as content shall be rendered above a stated
  fraction of the display's maximum emission.
verification-justification: |
  Asserted by reading every emitting surface of every element the page draws - ground, border,
  outline and shadow, the page's own root among them - and requiring each below the ceiling except
  where it is rendered text or imagery. The population is every element rather than a sampled area,
  and every way an element emits rather than one of them.
  Four things sit outside it. The exemption is a judgement the check cannot make: above the ceiling
  it must still decide whether a surface is text or imagery rendered as content, and a gradient
  behind a block is imagery by every rendering definition while being a scrim by intent. What the
  page renders is not what the panel emits, since backlight, gamma, colour profile and the
  half-silvered surface all lie between. What a viewer sees in the unlit surface is the reflected
  room, which the software neither supplies nor controls. And nothing bounds how much of the display
  sits at the ceiling, or how bright the exempt content is, so a tint covering everything passes and
  so does an image that takes the mirror.
verification-method: test
