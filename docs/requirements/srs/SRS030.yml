reviewed: TiZrpCTYfPATPX91QbNAu1gYewOyDIdOh7s5rHw8Rzg=
status: accepted
text: |
  The display page shall emit above the display's minimum emission only where it renders content a
  module presents.
verification-justification: |
  Asserted by reading every emitting surface of every element the page draws - ground, border,
  outline and shadow, the page's own root among them - and requiring each above the minimum to belong
  to a module's rendered content. The population is every element rather than a sampled area, so an
  element added to the page is an element the check reads, and it is every way an element emits
  rather than one of them. Three steps sit outside the assertion. What the page renders is not what
  the panel emits - backlight, gamma, colour profile and any tone mapping lie between them, and a
  half-silvered surface attenuates the result again - so the check settles the value the software
  chose, not the light that leaves the glass. What a viewer sees in the unlit surface is the
  reflected room, which the software neither supplies nor controls. And how much a module's own
  content emits is outside the exemption's reach by construction: a module rendering a large bright
  image satisfies this and takes the mirror, which the rationale records as unobliged rather than the
  check reporting green over.
verification-method: test
