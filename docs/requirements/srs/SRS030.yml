status: accepted
text: |
  Only the text and imagery the display page presents as content shall be rendered above a stated
  fraction of the display's maximum emission.
verification-justification: |
  Asserted by reading every emitting surface of every element the page draws - ground, border,
  outline and shadow, the page's own root among them - and requiring each below the ceiling except
  where it is rendered text or imagery. The population is every element rather than a sampled area,
  so an element added to the page is an element the check reads, and it is every way an element emits
  rather than one of them.
  The exemption is where judgement survives. For every surface above the ceiling the check must still
  decide whether it is text or imagery rendered as content, and a gradient behind a block is imagery
  by every rendering definition while being a scrim by intent. The ceiling bounds how often that
  decision is reached, not whether it is sound, and no assertion here settles it.
  Four things sit outside the assertion. What the page renders is not what the panel emits -
  backlight, gamma, colour profile and any tone mapping lie between them, and a half-silvered surface
  attenuates the result again - so the check settles the value the software chose, not the light that
  leaves the glass. What a viewer sees in the unlit surface is the reflected room, which the software
  neither supplies nor controls. How much the exempt content itself emits is outside the assertion by
  construction: a large bright image satisfies this and takes the mirror, which the rationale records
  as unobliged rather than the check reporting green over it. And nothing bounds how much of the
  display sits at the ceiling, so a tint covering all of it passes.
verification-method: test
