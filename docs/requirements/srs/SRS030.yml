header: |
  The page emits only through the content it presents
level: 33
links:
- SYS008: hcxzAWXDaJB9XZIG2gfgGXg_VS5IRfZ4uYbXzbR81YA=
normative: true
rationale: |
  The mirror is made of absence, so anything drawn where content is not is drawn at the mirror's
  expense - a panel behind a block of text, a card, a fill marking a region's bounds, a scrim lifting
  a glyph off its background. Each is emitted light, so each brightens the ground rather than
  darkening it. That list is the calibration of
  TST045<!-- Pending: emitting-surface test -->, so a fifth device arrives as a case in a check
  rather than a fifth noun here.
  Stated over emission rather than over the surface no content occupies, because occupancy is read
  from element boxes and a scrim would remove its own area from the population measured. A page that
  lights a pixel owes a module's content behind it, whatever draws it.
  The exemption is text and imagery, and it is the page's rather than a module's: a configuration
  that cannot be applied leaves no modules at all, and
  SRS004<!-- Page renders a legible error state for every configuration failure class --> obliges a
  legible error state anyway. Scoping it to a module's content would leave the page owing a message
  and forbidden to light it. "Text and imagery" rather than "content" because a scrim is content to
  whoever added it; "as content" because a gradient drawn behind an element is a scrim under another
  name.
  What this permits is a large bright image rendered as content, which takes the mirror as surely as
  a scrim does. That is a module's design, and no item in this tree obliges otherwise.
