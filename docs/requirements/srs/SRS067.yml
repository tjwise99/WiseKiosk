text: |
  Where the park-wait-times module's own response has a part that can fail apart from the rest, the
  module shall confine that part's failure to it, carrying every other part unaffected.
verification-justification: |
  Each instance is its own verifying test, read against a failure staged to touch one part while the
  rest of the response is staged to answer: the touched part alone carries why, and every other part
  carries its answer unchanged.
  What no single instance settles is a failure straddling two parts at once, which no capture stages,
  nor how a touched part's absence is drawn on a rendered page, which is a different item's.
verification-method: test
