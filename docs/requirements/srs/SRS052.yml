status: accepted
text: |
  The artifacts WiseKiosk delivers shall be exactly the published container image, its software bill
  of materials, its signature and provenance attestation, and the deployment recipe. No host
  operating system, browser, or autostart provisioning shall be delivered; the kiosk host platform
  lies outside the delivered system.
