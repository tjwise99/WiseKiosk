text: |
  The weather module shall show, for each of the hours next to come and each of the days next to
  come, the chance of precipitation expected then.
verification-justification: |
  Read from a rendered page handed a payload whose hours and days each carry a precipitation figure:
  the chance of precipitation for each hour and each day is present somewhere in what is drawn for it.
  What it cannot settle is where or how it is drawn - curve, strip, or otherwise - which is the
  module's UI design spec's rather than this item's, nor whether the figure shown is the true chance,
  the source being outside this system. It is bounded by the payloads the suite supplies.
verification-method: test
