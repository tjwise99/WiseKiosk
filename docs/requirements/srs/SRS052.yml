rationale: |
  Restated as a positive allowlist. As a prohibition on shipping a host OS it was an unbounded
  negative - every mechanisation would have been a denylist of forms already thought of, passing the
  first time an unlisted one appeared, which is the control this project rejects on principle. The
  allowlist inverts it: the release asset set is finite and observable, so an artifact nobody
  declared fails rather than passing unrecognised. The scope boundary SYS009 draws is preserved and
  becomes a gate.
