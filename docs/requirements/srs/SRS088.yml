status: accepted
text: |
  Where a comment reaches rationale, it shall do so by citing a requirement ID or ADR number and shall not
  restate the cited content. A comment is a restatement rather than a citation if any assertion still
  stands when the cited identifier is removed from it.
verification-method: inspection
