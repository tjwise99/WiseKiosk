header: |
  A comment references rationale by citation, never by restatement
level: 1.88
links:
- SYS011: GG37Ciys0N_S9xmzaKrup_W8ce0inLFB84S65X8sz_g=
normative: true
rationale: |
  Without a stated boundary, "cite the home" degrades into copying a sentence and appending an ID, which
  reintroduces the duplicate SYS011 exists to prevent while looking compliant. The strip-the-identifier
  test gives reviewers one operation to apply and is the reason this is expressible as a requirement at
  all. A bare document-section citation fails on a second count: a section anchor is not an identifier the
  citation resolver can check, so the ID form is what the obligation asks for.
ref: ''
reviewed: Siho7mjLL_k80fa3jPSVrx-mJOU5O0ap0nqbAAEXSZA=
status: accepted
text: |
  Where a comment reaches rationale, it shall do so by citing a requirement ID or ADR number and shall not
  restate the cited content. A comment is a restatement rather than a citation if any assertion still
  stands when the cited identifier is removed from it.
verification-justification: |
  The strip-the-identifier test is a semantic operation: it asks whether an assertion still stands
  once its citation is removed, which requires understanding the assertion. SRS091's one-line cap
  bounds the form a restatement can take and SRS095 proves the identifier resolves, but nothing
  mechanical decides whether the surviving words assert anything alone.
verification-method: inspection
