header: |
  Secret resolution: file at <NAME>_FILE, trailing whitespace stripped
level: 1.15
links:
- SYS003: r0OHFjma5xOn8ZgSOGL1oBns-m0Q-TKD9LQHrUnwXSw=
normative: true
rationale: |
  One delivery path keeps delivery unambiguous — no shadowing between a
  file and an environment variable — and a file path is what container
  platforms and secrets managers already provide (decision on #35,
  superseding the earlier env-var-fallback sketch). Trailing-
  whitespace stripping removes the `echo > file` footgun — and reduces a
  whitespace-only file to empty, which is unresolvable per SRS016 — where
  the value presents as rejected credentials while the file looks correct
  on inspection.
ref: ''
reviewed: IGOcRrTlnBdk6-csAW0MQC04vgltmYrE4ZpBdAD6VtA=
status: accepted
text: |
  The backend shall resolve a secret named NAME by reading the file at the
  path given by the environment variable <NAME>_FILE. The secret value
  shall be the file content with trailing whitespace stripped. No
  other delivery path shall exist; in particular, the backend shall not
  read a secret from a bare <NAME> environment variable.
verification-method: test
