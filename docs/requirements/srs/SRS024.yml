header: |
  Per-route rate limiting on the upstream path
level: 1.24
links:
- SYS021: szam5gPHPMXdmfL7WtI-9KiX_Buai2NqsFGsqXwXkB8=
normative: true
rationale: |
  Rate limiting bounds request volume toward upstream regardless of client
  behaviour (SYS021); a static-analysis finding is expected absent it. It is
  global per route because a per-client-address limit is inert behind container
  NAT, where every client presents the same masqueraded address (a control that
  does not function where deployed). It gates the upstream path because a cache
  hit issues no upstream request and so needs no limiting.
  Thresholds are chosen in #6.
ref: ''
reviewed: _HaEgMpTqPYL63XduDcWDshzPjAzyGMLND_uyCbyn9k=
status: accepted
text: |
  Each proxy route shall enforce a rate limit that is global to the route, not
  per client address. The limit shall gate the upstream path only: a request
  served from the cache shall be neither counted against the limit nor rejected
  by it. A request that exceeds its route's limit shall be rejected without
  issuing an upstream request.
verification-method: test
