header: |
  Every offered configuration key is exercised at a non-default value
level: 1.101
links:
- SYS003: x73sA6VMR9aDga-PqTW6L49gj-iwZdgTOg5xG8VhAwM=
normative: true
rationale: |
  SYS003's obligation had no child expressing it. The backend has no configuration concept
  (ADR 0007), which is a property of a component holding no keys - it satisfied the need
  vacuously while the demand that every offered key actually works went unverified, and the gate
  stayed green over the gap. Stated as an observable difference rather than as "renders without
  error", because a dead knob - a key the schema offers and the code ignores - renders the page
  perfectly. Absence of error is what a key wired to nothing produces, so it cannot be the
  criterion. The last sentence carries SYS003's second clause: a value that cannot be changed
  observably is a constant, and offering it is the defect. The check ranges over the schema rather
  than a hand-written key list, because the schema is the finite machine-readable statement of what
  is offered: a key added there is covered the moment it exists, where a list would drift silently.
ref: ''
reviewed: eTQTLIQ-F9xKktkv72gGmPCcFAKbymdx0KP6DtDdZ7M=
status: proposed
text: |
  Every key the configuration schema offers shall produce an observable difference in the rendered
  page between its default value and at least one other schema-valid value, and the page shall
  render without error at every schema-valid value the key admits. A key whose value cannot be
  observed to change the page is a constant and shall not be offered.
verification-justification: |
  Asserted per key by rendering at its default and at one other schema-valid value and requiring the
  page to differ, plus a render at every admitted value. What no check settles is whether the
  observable difference is the intended one - that the page changed is decidable, that it changed
  correctly is the module's own concern.
verification-method: test
