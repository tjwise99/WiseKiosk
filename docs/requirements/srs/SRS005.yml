normative: true
rationale: |
  SYS005 bounds the system's upstream use in volume, and SRS001 reports a
  timeout failure class — but nothing else imposes a timeout or a size limit, so
  a hung or oversized upstream could stall the handler or exhaust the single
  process. This item imposes the bounds that make those failure classes real.
