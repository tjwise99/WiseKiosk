header: |
  Configuration is validated before it is applied; never partially
level: 1.5
links:
- SYS001: TQyfJejH81RI-POadHI3gN0eM_DDB8AFAnMwcKjCth4=
normative: true
rationale: |
  Partial recovery converts a configuration error into silent degradation —
  the blank or wrong module the operator cannot diagnose. Phrased against
  "apply", not "page load", so a future live-apply path validates the same way
  without a rewrite (ADR 0007); page load is today's only apply point.
ref: ''
reviewed: 5y2suwnX5RK1N6-EoAAyWQGxcOgHB6qPW_GItdqvXCo=
status: accepted
text: |
  A configuration shall be validated against the configuration schema before
  it is applied. A configuration that fails validation shall not be applied in
  whole or in part: no defaults merged over invalid or missing values, no
  failing portion dropped, no module subset rendered. At page load, the
  frontend shall run this validation before rendering from the configuration.
verification-method: test
