rationale: |
  Partial recovery converts a configuration error into silent degradation —
  the blank or wrong module the operator cannot diagnose. Phrased against
  "apply", not "page load", so a future live-apply path validates the same way
  without a rewrite (ADR 0007); page load is today's only apply point.
