normative: true
rationale: |
  Retired (#129) with the desk validator it constrained. A second engine enforces the schema
  slightly differently, and the divergence surfaces as a validator that accepts what the page
  rejects — the defect class the single-definition rule exists to kill. That defect needs two
  consumers to exist. With validation running in the page and nowhere else (ADR 0007 rev 2) the
  schema has one enforcer by construction, so nothing the software does can violate this item.
  What survives is the rejection of a second engine, which is ADR 0007 rev 2's to hold.
ref: ''
reviewed: WIBwzzG4HfiUhYcGH--ulnnOEjmXsoPFdOr7wCpZsAE=
status: accepted
text: |
  The configuration schema's rules shall be enforced by exactly one
  implementation, shared by the display page and by any tool that validates a
  configuration without starting the application.
verification-justification: |
  Asserted by running one fixture corpus through both validation entry points and comparing verdicts
  and error sets. What the check does not settle is agreement on inputs outside the corpus;
  identical verdicts on five fixtures is evidence of a shared implementation rather than proof of
  one.
verification-method: test
