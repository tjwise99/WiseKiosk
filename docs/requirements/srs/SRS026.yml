header: |
  The display says when the backend is gone
level: 29
links:
- SYS001: S72Ttym255pW5SuA1xELQbSn6rPxaSUFZj1Lhfn5xtA=
normative: true
rationale: |
  Created when the operator-self-sufficiency need was narrowed and then dissolved: it gave up the
  claim that no operator is needed to keep a deployment running, and this is the part of that want
  which is ours entirely. Without it the
  operator sees each module reporting its own unavailability and nothing saying the service itself is
  down - five separate failures where there is one. The corrective action is named because a failure
  state that teaches the fix converts a repeating incident into a one-time one; it must be distinct
  content rather than a rephrasing of the diagnosis, or an item could satisfy the clause by saying the
  same thing twice. Cadence, what the page displays, and whether one endpoint serves both the page and
  an orchestrator are mechanism, and are #72's.
ref: ''
reviewed: J23XsIdVZ_-23ju6VwTnghbQfTzfROKs6brnxwJW-8A=
status: proposed
text: |
  When the backend is unreachable, the display shall say so rather than showing each module as
  separately unavailable, and shall name the corrective action available to the operator, distinct
  from the failure it reports.
verification-justification: |
  Both halves are asserted against an induced backend outage: that one page-wide state replaces the
  per-module states, and that the state carries a remediation distinct from its diagnosis. What the
  check does not settle is whether the remediation is the right advice - that a restart policy is what
  an operator should add is a recommendation #71 makes, not a property this gate decides.
verification-method: test
