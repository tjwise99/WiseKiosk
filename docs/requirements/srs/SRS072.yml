text: |
  The park-wait-times module shall advance its cards' tours together, a card with more than one page of
  rides to show taking its next page at the same moment as every other such card it is drawn beside.
verification-justification: |
  Read from a rendered page under a driven clock, over a configuration placing more than one park and a
  payload giving those parks different numbers of pages to tour - the differing counts being what tells
  a shared tick from cards that merely started together, since cards holding equally many pages stay
  level under either. Read across a tick: every card that has somewhere to advance to has advanced, and
  across a later one at which the shorter tour has returned to its first page while the longer has not,
  so agreement is read where the cards are showing different positions rather than only where they
  happen to coincide.
  What it does not settle. Whether the cards are within any stated tolerance of one another: the
  reading is taken at instants the check chooses, so it establishes that no card is a whole tick out of
  step, not that two advances land within some margin - and this item obliges no margin. How the
  agreement is reached, which this item does not oblige and no check reads. And it is bounded by the
  rosters and page counts the suite supplies and the intervals it drives, so a drift that first appears
  after more turns than a check runs, or at a card count nothing samples, passes.
verification-method: test
