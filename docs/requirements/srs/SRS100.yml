header: |
  Each module declares its boundary payload as a composed fragment
level: '1.100'
links:
- SYS007: gygNneD3A0xV6q5KFtBovv0bgMlX3e9zgdO0nGPLfYI=
normative: true
rationale: |
  Closes the contradiction the module contract recorded against #18: a module's component must
  consume a generated payload type (SRS031), that type exists only if the module's payload reaches
  the one boundary schema, and SRS036 confined a module's edits to locations that did not include
  it. Every module was therefore unbuildable as specified, or the confinement invariant was.
  Composition rather than a sixth permitted shared file, so both properties survive: the payload is
  defined once (SRS029) and adding a module still touches nothing shared (SRS036). This is the
  mechanism SRS035 already uses for the configuration schema, applied to the boundary schema rather
  than a second mechanism invented for it.
ref: ''
reviewed: M45vfVj9Zr5uRsuVJ89bu9xoZI2_8_evcr-R1eyfpso=
status: proposed
text: |
  Each module whose payload crosses the frontend/backend boundary shall declare that payload as a
  fragment composed into the one boundary schema (SRS029), held in that module's own directory. The
  payload shape shall not be declared a second time anywhere, and the composed schema shall be the
  sole input to boundary code generation (SRS030). A module that fetches no external source
  contributes no fragment.
