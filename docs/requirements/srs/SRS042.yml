status: accepted
text: |
  The weather module shall report the weather for the location its configuration names, and for no
  other.
verification-justification: |
  Read from a rendered page under a configuration naming a location, against a source staged to answer
  differently by location: the request the module causes carries the configured place and the region
  shows the answer given for it, and a second configuration naming a second place moves both.
  What it cannot settle is that the source's answer is true of that place - which place a supplier
  believes it is answering for is its own, and outside this system. It also settles nothing about a
  configuration naming no location, which is a configuration-validation question rather than this
  module's.
verification-method: test
