text: |
  Every third-party dependency in a build manifest shall be justifiable at review as work the
  standard library cannot reasonably do. Any dependency requiring a native build toolchain shall
  carry a recorded ADR justification that resolves, and a dependency requiring one without such a
  reference shall fail.
verification-justification: |
  Whether a dependency does work the standard library "cannot reasonably do" is a judgement about
  alternatives not taken; no check enumerates the standard library's reachable equivalents. The
  native-toolchain clause is decidable and is asserted, so only the alternatives judgement remains.
verification-method: inspection
