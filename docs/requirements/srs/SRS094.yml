header: |
  A deferred-work marker names a tracked issue
level: 1.94
links:
- SYS043: v0892nFH1_ptHaW3_A00SDf0ukhzFBUdXkLfwDDDD9I=
normative: true
rationale: |
  An untracked TODO is an obligation with no owner and no expiry — it survives every review because it
  reads as someone else's problem. Requiring the issue number moves the work into the tracker where it is
  visible, and makes the marker's own staleness resolvable. The check is form-only and offline by
  decision: verifying that the issue exists and is open costs one API call per marker against an
  unauthenticated hourly limit, and would turn CI red on unrelated branches the moment an issue closes,
  training authors to strip the reference rather than finish the work. A dangling number is partly
  reachable by SRS095 in any case.
ref: ''
reviewed: 9a_8aSNmTddQeG98L7nfEbYZClxe2Jt2fnlf0G_HZSI=
status: accepted
text: |
  A deferred-work marker in a first-party authored artifact shall name a tracked issue, in the form
  TODO(#nnn). The check shall verify the marker's form without requiring network access.
verification-method: test
