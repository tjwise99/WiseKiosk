header: |
  Stateless GET /api/<source> returns the shaped payload
level: '1.20'
links:
- SYS005: null
- SYS007: null
normative: true
rationale: |
  The payload's shape is defined once by the boundary contract (#37) and
  generated on both sides; this requirement governs the transport — that every
  source is reachable and that reaching it is stateless — not the shape's
  definition, nor how many endpoints a source needs, nor what they are called.
  Fixing a route template here would declare the interface a second time, which
  is the defect ADR 0008 exists to prevent, and would forbid a module that needs
  two calls for no reason anyone stated. Statelessness is stated as an observable
  so it can be tested rather than asserted. The shared response cache (SRS020),
  keyed on the request itself, is not per-client state: it may determine whether a
  request is served from cache, but not the payload a client receives.
ref: ''
reviewed: null
status: accepted
text: |
  Every supported external source shall be reachable through the backend, by the
  endpoints the boundary contract defines for it. Those endpoints shall hold no
  per-client or session state: they shall not distinguish between clients, and the
  payload returned for a request shall be determined solely by that request, not
  by who sent it or by earlier requests.
verification-method: test
