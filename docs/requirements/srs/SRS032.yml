header: |
  Frontend hand-writes no runtime validator for proxied payloads
level: 1.32
links:
- SYS041: 0JV2qdT9ZGdmekYq1jQOdrMbNwjx731QZB_YfMG9sSs=
normative: true
rationale: |
  Compile-time types are erased at runtime, but the failure a runtime validator
  would catch — bytes not matching the contract — is foreclosed here: the backend
  serializes generated structs, the SPA and backend ship in one image and deploy
  together (no version skew), server-side shaping is unit-tested, and SYS005's
  error state backstops an unrenderable payload. A validator would add bundle
  weight and per-render cost on a Raspberry-Pi-Zero-class browser against a case
  that does not exist. Revisit only if the two sides ever become
  independently deployable.

  Parented to SYS041 rather than SYS023. The obligation is not that the two sides agree - SRS029,
  SRS030, SRS031 and SRS099 carry that - but that a second validator is not built against a case
  that does not exist, which is SYS041's subject exactly. Held under SYS023 it also kept that need
  at inspection, because a judgement clause belonging to a different parent was setting its method.
ref: ''
reviewed: mJRRoUUHXun3BJY_zHr0XR7d8CBF-Vgg8SxPr04X6z8=
status: accepted
text: |
  The frontend shall not re-validate proxied payloads at runtime: no validator shall be written by
  hand on the render path. Cross-boundary agreement shall rest on the single schema and the drift
  gate (SRS030). That the generated artifact itself contributes no validator is SRS099's obligation.
verification-justification: |
  Proving the absence of a hand-written validator is not mechanically decidable. A defensive type or
  null guard is indistinguishable from render logic to any check, and a denylist of validator
  libraries fails open the first time one is written by hand - the case of concern. The decidable
  half is carved out as SRS099.
verification-method: inspection
