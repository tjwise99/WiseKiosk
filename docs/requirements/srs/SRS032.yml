header: |
  Readable content is carried at full emission
level: 35
links:
- SYS002: 91axd_1dLgOSnLun8sBZIMhrVsiH2HQyeBW5OaT1VAQ=
normative: true
rationale: |
  The ground behind any glyph is the reflected room, so the display's contrast against it is neither
  known nor controlled: the same character is crisp over a dark cabinet and gone over a lit counter,
  and the software cannot tell which is behind it. It also cannot darken either one - the surface adds
  light and subtracts none - so emission is the whole of what it controls, and a reduced-emission
  glyph is not a quieter one but one that disappears sooner, in conditions nobody can predict.
  Stating the obligation over emission rather than over a ratio against a background is what keeps it
  honest. A ratio computed against the rendered background is computed against the absence of one,
  and would report the same result whether the display were readable or unreadable.
