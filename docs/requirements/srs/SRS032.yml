normative: true
rationale: |
  The ground behind any glyph is the reflected room, so the display's contrast against it is neither
  known nor controlled: the same character is crisp over a dark cabinet and gone over a lit counter,
  and the software cannot tell which is behind it. It also cannot darken either one - the surface adds
  light and subtracts none - so emission is the whole of what it controls, and a reduced-emission
  glyph is not a quieter one but one that disappears sooner, in conditions nobody can predict.
  Stating the obligation over emission rather than over a ratio against a background is what keeps it
  honest. A ratio computed against the rendered background is computed against the absence of one,
  and would report the same result whether the display were readable or unreadable.

  Reopen premise. This forecloses typographic hierarchy in the one dimension a dark interface would
  normally use it: no dimmed secondary text, no greyed stale reading, no colour carrying meaning.
  That cost is accepted (owner, 2026-08-09) on the ground above - the room behind a glyph is not the
  software's to know, so a reduced-emission glyph is not a quieter one but one that disappears
  sooner, in conditions nobody can predict. Revisit if a deployed display proves hard to scan because
  nothing distinguishes what matters from what surrounds it, which is the want uniform emission is
  spending to protect. Size, weight and position remain available to distinguish content and are
  untouched by this item; what is given up is brightness and colour as carriers of meaning.
