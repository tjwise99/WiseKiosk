text: |
  Text the display presents to be read shall be rendered at the display's maximum emission.
verification-justification: |
  Asserted by reading the rendered value of every text element the page presents for reading. That is
  the value the software chose rather than the light the panel emits - backlight, gamma, colour profile
  and the half-silvered surface all lie between the two, and none of them is asserted. Nor does the
  check settle legibility itself, which depends on what the room reflects behind each glyph, and the
  room is outside the system. It bounds the software's contribution rather than proving the outcome.
verification-method: test
