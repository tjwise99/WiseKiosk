header: |
  Every source reachable through the backend, statelessly
level: '1.20'
links:
- SYS004: zDeVzrtkJX0x8iRss9MhCXDMfx62PK7NqmJJoh2OQ9c=
- SYS006: v3qSjDNbCins9CcqouJY2Vp6K1NhBAlUsPS8az2R1Kc=
normative: true
rationale: |
  The payload's shape is defined once by the boundary contract (#37) and generated on both sides;
  this requirement governs the transport — that every source is reachable and that reaching it is
  stateless — not the shape's definition, nor how many endpoints a source needs, nor what they are
  called. Fixing a route template here would declare the interface a second time, which is the
  defect ADR 0008 exists to prevent, and would forbid a module that needs two calls for no reason
  anyone stated. Statelessness is stated as an observable so it can be tested rather than asserted.
  The shared response cache
  (SRS011<!-- Upstream request rate is bounded, and the bound is not operator-tunable -->), keyed
  on the request itself, is not per-client state: it may determine whether a request is served from
  cache, but not the payload a client receives.
ref: ''
reviewed: Ue7CeL-hE21iO02KgjhVHcYv-3xOWQOPA11OponM_rM=
status: accepted
text: |
  Every supported external source shall be reachable through the backend, by the
  endpoints the boundary contract defines for it. Those endpoints shall hold no
  per-client or session state: they shall not distinguish between clients, and the
  payload returned for a request shall be determined solely by that request, not
  by who sent it or by earlier requests.
verification-justification: |
  Asserted from three directions - every declared source has a route and every route has a source,
  the same request from two differing clients returns identical bytes, and a repeat after an
  intervening request is unchanged. What no check settles is discrimination on a fact the harness
  holds constant.
verification-method: test
