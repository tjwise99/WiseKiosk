rationale: |
  The tree is too large for one reader to hold, so its own coherence has to be mechanical or it is
  not checked at all. A parent claiming test while a child is inspection is a false signal about
  verification - the defect SYS031 exists to forbid, occurring inside the specification rather than
  in a check. The two directions are deliberately asymmetric. Overstating is never excusable: it
  asserts a machine settles what a human decides. Understating is, where the parent holds a residue
  no child carries, so it is permitted against a written justification - which is the argument, not
  an escape hatch. This check caught two real violations on the change that introduced it, and one
  the author had introduced earlier in the same pass.
