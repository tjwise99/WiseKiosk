header: |
  Page renders a legible error state for every configuration failure class
level: 1.13
links:
- SYS001: TQyfJejH81RI-POadHI3gN0eM_DDB8AFAnMwcKjCth4=
normative: true
rationale: |
  ADR 0007: the page shell runs validation itself and owns the presentation of
  its result. Failure classes are enumerated because SYS001's never-a-blank-
  screen intent covers more than schema errors — an absent, unfetchable, or
  unparseable file must be as legible as an invalid one. Scoped to "no valid
  configuration applied" so a future live-apply path keeps the freedom to hold
  last-good on a bad reload.
ref: ''
reviewed: jGfomvjnVhqnkF3dCM00Js-XAYAkZP276TtzJzBhf1A=
status: accepted
text: |
  When no configuration can be applied - the file absent, unfetchable,
  unparseable, or failing validation in a way that cannot be isolated to a
  single module - the display shall render a plain-language error state naming
  which failure occurred. The page shell shall load and render this state
  without requiring a valid configuration.
verification-method: test
