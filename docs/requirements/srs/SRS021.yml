active: true
derived: false
header: |
  Request parameters validated against known-good per-source patterns
level: 1.23
links:
- SYS005: null
normative: true
rationale: |
  Validating against known-good patterns keeps malformed or unrecognized
  requests from reaching upstream and bounds the proxy so it cannot be driven to
  forward arbitrary requests (SYS005). The client-facing form of
  a rejection is specified by SRS022.
ref: ''
reviewed: awmf7f4ZhwdHxftl-IEkRuL_b4V34RCYrJws9ufMyJo=
status: accepted
text: |
  The backend shall validate each request's parameters against known-good
  patterns for the requested source — for example ICAO code format for aviation
  weather and a known park-ID map for wait times — and shall reject a request
  whose parameters do not conform without issuing any upstream request.
verification-method: test
