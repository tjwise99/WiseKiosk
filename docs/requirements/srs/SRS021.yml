verification-justification: |
  An emulated ARM boot renders the page and drives the display, and CPU-throttled render timing plus a
  bundle ceiling bound performance. Emulation does not decide device timing — the emulator's clock is
  not the device's — so the performance claim rests entirely on the proxies.
