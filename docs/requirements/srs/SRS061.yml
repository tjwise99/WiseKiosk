reviewed: GEs8qJ6pnXaIzLntNYlgS8GkWX2iEESDpqfj8HOzBuU=
status: accepted
text: |
  The park-wait-times module shall draw each ride's wait as the length of time it is handed or, where the
  ride is not operating, as the state it is handed, following the payload rather than deciding for itself
  whether a ride can be ridden, and drawing a length of time distinguishably from a state.
verification-justification: |
  Read from a rendered page handed payloads differing only in a ride's wait: a ride handed a length of
  time draws that time and a ride handed a not-operating state draws that state, the drawing does not
  follow the page's clock or the park's hours where they disagree with the payload, and a time and a
  state are drawn as different kinds of mark.
  What it cannot settle is whether a viewer reads the two as distinct across the room, which is a
  judgement about a real display rather than a rendered page, nor that the state the payload carries is
  true of the ride, the source being another party's system and outside this one.
verification-method: test
