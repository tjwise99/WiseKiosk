header: |
  Every offered configuration key is exercised at a non-default value
level: 1.96
links:
- SYS016: null
normative: true
rationale: |
  SYS016's obligation had no child expressing it. SRS011 states that the backend has no
  configuration concept, which is a property of a component holding no keys - it satisfies the need
  vacuously while the demand that every offered key actually works went unverified, and the gate
  stayed green over the gap. The check ranges over the schema rather than a hand-written key list,
  because the schema is the finite machine-readable statement of what is offered: a key added there
  is covered the moment it exists, where a list would drift silently. A key no test ever varies is
  an unproven claim of tunability, which is the same closure argument ADR 0005 makes for source
  coverage, pointed at configuration.
ref: ''
reviewed: null
status: proposed
text: |
  For every key the configuration schema offers, the behavioural suite shall render the page from a
  fixture configuration setting that key to a schema-valid value other than its default, and shall
  assert the page renders without error. A key the suite never varies shall fail the check.
verification-justification: ''
verification-method: test
