header: |
  Client-facing contract for rejected requests
level: 1.26
links:
- SYS005: null
normative: true
rationale: |
  SRS021 and SRS020 reject invalid and over-limit requests but do not say what
  the client receives; a module still needs something renderable, and it must be
  able to tell an operator misconfiguration from a source outage. The concrete
  body shape is defined by the boundary contract (#37); this item fixes the
  status codes, the reject-before-upstream behaviour, and the separation from
  the upstream-failure shape.
ref: ''
reviewed: nh_nk7dDqUsx68CR3qXxByNi8WHCU39rAEK2d4UDB4I=
status: accepted
text: |
  A request the backend rejects before making any upstream call shall return a client-error
  status distinct to its cause, with a response body the frontend can render.
verification-method: test
