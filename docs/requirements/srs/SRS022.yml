header: |
  Bounded resource use
level: 1.57
links:
- SYS007: null
normative: true
rationale: |
  A declared minimum host has no headroom to absorb a leak, so unbounded
  growth breaks the claim SYS007 makes. Stated so it is provable early —
  from a bounded instrumented run rather than a full-length soak — and
  continuously, rather than only at a pre-release demonstration.
ref: ''
reviewed: null
status: accepted
text: |
  The backend shall not grow its resident memory or handle count without bound.
verification-justification: |
  Asserted by sampling resident memory, handle count and task count across a run and failing on
  monotonic growth past a threshold. What no check settles is the timescale this obligation is
  really about: an hour of sampling is read as evidence about months of running, and a leak slower
  than the window is invisible to it.
verification-method: test
