header: |
  A bounded running footprint
level: 1.57
links:
- SYS007: NFy-WbNRxUQwknLO07y9H-EFDWuo_jGKosorPOiOSes=
normative: true
rationale: |
  A declared minimum host has no headroom to absorb a leak, so unbounded growth breaks the claim
  SYS007<!-- The declared minimum host, and staying within it --> makes. Stated so it is provable
  early — from a bounded instrumented run rather than a full-length soak — and continuously, rather
  than only at a pre-release demonstration.

  It names no resource. Which ones are sampled, and at what thresholds, is
  the verification's business: a leak class discovered later is then a change
  to a check rather than to this obligation, and an enumeration here would
  otherwise be read as the complete list of what may not leak.
ref: ''
reviewed: BT5IDdJPmgF5S9_XRTOvDrB7B0DuYVTDWS9kRYh3TsY=
status: accepted
text: |
  The backend's running footprint shall stay bounded: no resource it holds shall grow without bound
  across a continuous run.
verification-justification: |
  Asserted by sampling resident memory, handle count and task count across a run and failing on
  monotonic growth past a threshold. Because the obligation names no resource, what the check
  settles is narrower than what is stated: a resource nothing samples can grow unbounded and pass.
  Nor does any check settle the timescale this obligation is really about — an hour of sampling is
  read as evidence about months of running, and a leak slower than the window is invisible to it.
verification-method: test
