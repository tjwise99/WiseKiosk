header: |
  External links point only at recorded upstream documentation
level: 1.102
links:
- SYS011: GG37Ciys0N_S9xmzaKrup_W8ce0inLFB84S65X8sz_g=
normative: true
rationale: |
  SYS011's second sentence - external references may point only at third-party projects' own
  documentation, never at material required to build, verify, or operate WiseKiosk - had no child.
  SRS003 covers relative links only, so the clause that keeps the repository self-contained against
  the outside world was the unverified half of the need. An allowlist rather than a scan for "is
  this material we depend on", because that judgement cannot be made from a URL. Adding a host
  becomes a reviewed act, which is where the judgement belongs: the check ranges over every link,
  and the human decides once per host rather than once per link.
ref: ''
reviewed: JBcVYNbgJoJxzN0aUf7kSRE_-tKAVuqPciw8b4VTB1Q=
status: proposed
text: |
  Every absolute http or https link in tracked documentation shall resolve to a host recorded in a
  committed allowlist, each entry naming the upstream tool or service whose own documentation it
  serves. A link to a host not on that list shall fail.
verification-justification: ''
verification-method: test
