text: |
  Continuous integration shall statically scan the project's own Go and
  Svelte/TypeScript source for security-defect patterns on every pull request,
  and shall fail the pull request when any finding is present, at any severity.
  A finding in first-party source has no exception path. Every finding shall be
  reported to the repository's code-scanning dashboard and annotated on the
  pull request.
