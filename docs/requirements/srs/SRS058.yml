text: |
  The park-wait-times module shall keep in view, for each park and without rotating them away, the rides
  whose current waits are the longest, so that a park's longest waits are readable the instant a viewer
  looks.
verification-justification: |
  Read from a rendered page handed a payload whose rides carry differing waits: the rides kept in view
  are those with the longest waits, and they remain in view across the rotation of the rest.
  What it cannot settle is that the number held is the right one to hold - that is a composition
  judgement the UI design spec makes - nor whether a viewer reads the ranking as intended. It is bounded
  by the payloads a suite supplies.
verification-method: test
