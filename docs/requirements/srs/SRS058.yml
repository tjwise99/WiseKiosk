text: |
  Continuous integration shall statically scan the project's own Go and
  Svelte/TypeScript source for security-defect patterns on every pull request,
  and shall fail the pull request when a finding of CRITICAL severity is
  present. Every finding the scan produces, at any severity, shall be reported
  to the repository's code-scanning dashboard and annotated on the pull
  request; the gate threshold shall govern what fails, never what is
  reported.
