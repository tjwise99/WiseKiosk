reviewed: 2g1HZ7HkBfjBCRkGZDGIFyzGE-aMKApertzNRLCQZRU=
status: accepted
text: |
  The park-wait-times module shall issue no more than one request to its source for any one park in any
  five minutes while that source is answering, and shall have no more than one request to that source in
  flight at a time.
verification-justification: |
  Read over the requests the module's route issues against a staged source that answers and a driven
  clock: no more than one leaves in any five minutes for one park, and a second is never outstanding
  while a first has not answered.
  What it cannot settle is that this rate is one the source accepts. What a free supplier will tolerate
  is its own policy, published or not, changed without notice and not decidable here; the figure is
  chosen to sit at the source's own stated ceiling, and a check reads what this system emits rather than
  what another party thinks of it. It is also asserted over the window the harness runs, so a rate that
  drifts only over days is outside it.
verification-method: test
