text: |
  The weather module shall declare the known-good constraint the location its requests carry must
  satisfy, admitting a point on the earth's surface and no other value.
verification-justification: |
  Read against the constraint the module declares, exercised without a network: a request naming a
  point on the earth's surface is admitted and one naming anything else is rejected with nothing sent
  upstream.
  What it cannot settle is that an admitted location is one the source has weather for. A well-formed
  point in the middle of an ocean conforms and may still be answered poorly or not at all, which is an
  upstream failure rather than a rejection, and the boundary between the two is what this item fixes
  rather than something it proves right.
verification-method: test
