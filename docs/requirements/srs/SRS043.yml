reviewed: ciJJrE-Ufu-xKnVM5E5HxE6EPJ-uRmK5VvpyR9s8UBY=
status: accepted
text: |
  The frontend shall refresh module data by polling and shall depend on no server-pushed channel for
  data or refresh. Each module that fetches data shall refresh on its own module-declared cadence,
  independent of other modules; there shall be no single global refresh interval. The refresh
  cadence shall be a module-owned constant set by the module author, not an operator configuration
  key.
