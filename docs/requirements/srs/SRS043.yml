header: |
  Frontend polls; each module refreshes on its own module-owned cadence
level: 1.43
links:
- SYS006: KZtswOlxN1xD3PUvRX2djU9sCMFBskYb-6W5Iq6nOdo=
normative: true
rationale: |
  The refresh is frontend-driven; a server-push channel for ten-to-fifteen-minute
  data is a transport chosen before the access pattern, so the frontend polls and
  introduces no live channel. Each
  module refreshes on its own cadence rather than a single global interval because
  the sources differ in how often they change and how tolerant they are of request
  volume. The cadence is a module-owned constant set by the author, not an
  operator configuration key: it is a source-determined value, and such a value
  is a constant, not a knob — exposing it would invite an
  operator to set a wrong value and provoke upstream rate-limiting (429s), so
  SYS003 (every offered key is operator-tunable) is deliberately not engaged
  because no key is offered. The per-module cadence is the front-of-house twin of
  the route's response-cache TTL (the software-architect's SRS034), and the two
  are chosen together so the poll does not out-run the cache.
  Concrete interval values are deferred to open-question #6.

  Parented to SYS006, which absorbed this item when SYS020 was retired as
  tautological. The fit is the data plane rather than the origin constraint:
  SYS006 governs how the page obtains upstream data, and polling on a
  module-owned cadence is that mechanism. SYS006's same-origin clause is carried
  separately by SRS042.
