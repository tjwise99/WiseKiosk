reviewed: R7LavsntvpENOdA0MxuYkxBwRpGPM9FuRY93W_iuUmk=
status: accepted
text: |
  The frontend shall refresh module data by polling and shall depend on no
  server-pushed channel for data or refresh. Each module shall refresh on its own
  module-declared cadence, independent of other modules; there shall be no single
  global refresh interval. The refresh cadence shall be a module-owned constant set
  by the module author, not an operator configuration key.
verification-method: test
