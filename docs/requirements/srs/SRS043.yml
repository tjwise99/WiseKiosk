header: |
  The weather module declares the known-good constraint the location it is asked about must satisfy
level: 46
links:
- SYS010: dgflQFtHGeswH-PgjWmcBkfuJujSp-a-Z5JtN4H0Low=
normative: true
rationale: |
  The framework obliges the validating and the rejecting, and hands the pattern itself to the source
  that declares it
  (SRS012<!-- Request parameters validated against known-good per-source constraints -->). This is that
  hand-off taken up, and it is the one overlap with the framework a module's decomposition legitimately
  carries: the framework says a constraint is applied before anything goes upstream, and the module says
  which constraint that is.
  What a location is, is the whole of what is fixed here. A point on the earth's surface is the class of
  value this module can be asked about, and anything outside that class is not an unlucky request but a
  request this module cannot mean. How such a value is spelled on the wire - which characters, which
  order, which precision - is the boundary schema's, and a requirement fixing it would settle an
  interface that record is the record of.
  What the module declares is a constraint on the value rather than on its spelling, and the
  difference is not a change of words. The parameters cross in a request body generated from the
  boundary schema, so a spelling that is not a number is refused by the decoding before this module
  sees it - a property of the generated boundary rather than an obligation this module could fail on
  its own - and what is left for the module to declare, and the only half of it that can fail here,
  is which values count as a point on the earth's surface. An item obliging a pattern would be
  satisfied by a module declaring one nothing applies.
  It stands apart from the configured location for a reason that is not tidiness: this bounds what the
  backend will carry upstream from any caller, and holds against a request the page never made.
