status: accepted
text: |
  The park-wait-times module shall report the wait times for the theme parks its configuration names,
  and for no other.
verification-justification: |
  Read from a rendered page under a configuration naming parks, against a source staged to answer
  differently by park: the requests the module causes carry the configured parks and the region shows
  the answers given for them, and a second configuration naming different parks moves both.
  What it cannot settle is that the source's answer is true of those parks - which park a supplier
  believes it is answering for is its own, and outside this system. It also settles nothing about a
  configuration naming no park, which is a configuration-validation question rather than this module's.
verification-method: test
