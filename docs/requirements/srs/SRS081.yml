normative: true
rationale: |
  Cites ADR 0003 ("Model-vs-real-code drift is not auto-verified... carried by review").

  Parented to SYS037 rather than SYS038. SYS038 is scoped to generated artifacts being regenerated
  and failing on drift; a link pointing at the wrong source is not generator drift, and holding it
  there made a wholly mechanical need answer for a judgement no check makes. The architecture model
  is the canonical home for the system's structure, so a link that no longer reaches its
  implementation is that home describing something absent.

  TST `model-to-code-link-review` — verification-method: inspection — PENDING (active: false) —
  header `Pending: model-to-code link review`; activated when first-party source exists.
ref: ''
reviewed: 4NStcg-EMYWBf5F66f-sV6vnRrmEQq6jMEJN1LyfVSw=
status: accepted
text: |
  Every `link` in the LikeC4 architecture model shall resolve to a tracked path (asserted with the
  model validation, SRS078). As an architecture element gains a real implementation, its `link`
  shall be updated to the corresponding source.
verification-justification: |
  Whether a link points at the code that actually implements an element is a semantic correspondence
  between a model node and a source tree, and whether an element has gained an implementation real
  enough to link is a judgement about the state of the code. ADR 0003 records that the staleness
  gate cannot prove the model matches the code. That a link resolves is asserted by SRS078.
verification-method: inspection
