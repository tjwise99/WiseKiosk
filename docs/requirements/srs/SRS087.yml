rationale: |
  The operative half of SYS042, written so a reviewer can apply it to a single comment: mechanism stays,
  rationale moves. Naming every home matters — a comment justifying a test-strategy choice belongs in
  TESTING prose, and a shorter formulation would push it toward FOUNDATIONS or an ADR, neither of which
  guarantees it. The live example this was written against is scripts/check-verify-ci-parity.mjs, whose
  header restates rationale already carried verbatim by SRS067's own rationale field.
