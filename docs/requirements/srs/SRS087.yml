status: accepted
text: |
  A comment in a first-party authored artifact shall state what the code or configuration does, or how it
  does it. A statement of reason, history, or evaluative judgment shall instead be authored in FOUNDATIONS
  prose, TESTING prose, an ADR, or a requirement's rationale field, and the comment shall cite that home in
  place of the statement.
verification-method: inspection
