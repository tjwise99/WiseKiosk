header: |
  One schema, package-neutral, all boundary value classes
level: 1.29
links:
- SYS006: null
normative: true
rationale: |
  "Every payload shape and every parameter name" (TESTING.md Boundary tier)
  includes the error and status contracts the frontend renders from; enumerating
  the value classes keeps them from being the uncovered value the tier warns
  about. The schema's repository location is allocated by #5 and not fixed here.
ref: ''
reviewed: null
status: accepted
text: |
  The boundary contract shall be defined by exactly one schema artifact, owned by neither the
  backend nor the frontend package, from which both sides are generated. It shall define every
  value crossing the boundary, including those a module contributes. No boundary value shall be
  defined in more than one place.
verification-method: test
