header: |
  Both sides consume the generated types
level: 1.31
links:
- SYS005: vWpFwzXUqypym6hKI0F3IGqVwyPFfH32lieducWW6tM=
normative: true
rationale: |
  The failure this forecloses is the hand-declared twin: a struct or interface that mirrors a
  generated type closely enough to compile and render, and then drifts. Structural typing lets such
  a twin compile cleanly, which is why the obligation is stated over declaration origin rather than
  over shape - the compiler reports origin exactly even where it permits assignability. Scoped to
  modules that have a boundary payload. A local module puts no value on the boundary and so has no
  generated payload type to consume; requiring one of every component would oblige a type that
  cannot exist.
ref: ''
reviewed: ouM9Tz5jlgEvD8ezsiv4Uhjhr3HFsRBSpPZtMZWytj4=
status: accepted
text: |
  Every value crossing the boundary shall be used on both sides through a type generated from the
  schema, never one declared by hand.
verification-justification: |
  Asserted by requiring every handler's request and response types, and every module component's
  payload and error props, to resolve to declarations under the generated package. What no check
  settles is a value that crosses the boundary without appearing in either position.
verification-method: test
