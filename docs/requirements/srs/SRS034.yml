header: |
  Route registration is a single static compile-time list entry; no registry or discovery
level: 1.34
links:
- SYS024: h3-BB26CIO3s86rk1gJVjLpPnDr6NuByu5coK4iPu3o=
normative: true
rationale: |
  Route registration is a static list resolved at compile time: not a registry,
  not discovery, not dynamic loading — and not the plugin-system-with-no-plugins
  anti-pattern. This governs how the SRS020 route is registered (the mechanism),
  not the route's runtime behaviour; the per-route cache TTL it carries is the
  one governed by SRS022.
ref: ''
reviewed: UaqQuiebwCMQhZEuUsfvaUsXVWc31ogGz5oJuPU8O1A=
status: accepted
text: |
  Each module shall be bound to its GET /api/<source> route by exactly one
  registration entry in a static list resolved at compile time, carrying that
  route's parameter validation and cache TTL. The backend shall implement no
  runtime module registry, no route discovery, and no dynamic route loading.
verification-method: inspection
