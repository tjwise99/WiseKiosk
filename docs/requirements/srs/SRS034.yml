header: |
  Route registration is a single static compile-time list entry; no registry or discovery
level: 1.34
links:
- SYS009: tf7grKzQp6z4Xnv2kCe1PEvssAsF7YR-HmGXlUTFyyM=
normative: true
rationale: |
  Route registration is a static list resolved at compile time: not a registry,
  not discovery, not dynamic loading — and not the plugin-system-with-no-plugins
  anti-pattern. This governs how the SRS020 route is registered (the mechanism),
  not the route's runtime behaviour; the per-route cache TTL it carries is the
  one governed by SRS022.
ref: ''
reviewed: macbkSWd_mvdoaY7UPF6QGn_cVDyH90Qf2rs2IUo6Bk=
status: accepted
text: |
  Each module that fetches an external data source shall be bound to its GET /api/<source> route by
  exactly one registration entry in a static list resolved at compile time. The entry shall carry
  every policy governing that route: its parameter validation, its success cache TTL, its negative
  cache TTL, its rate limit, its outbound timeout, and its maximum accepted upstream response size.
  No such policy shall be held anywhere else. A module that fetches no external source shall have no
  entry. The backend shall implement no runtime module registry, no route discovery, and no dynamic
  route loading.
verification-method: test
