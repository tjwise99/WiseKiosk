text: |
  The weather module shall take the weather it shows from one external weather source, and shall derive
  the weather it shows from no other.
verification-justification: |
  Read from the module's shaping and from the requests its route issues under a rendered page: the
  request built is the one that source answers, and the weather rendered is parsed from that source's
  response rather than assembled from anywhere else.
  What it cannot settle is that no second source exists behind the first: the source is another party's
  system, so what is checkable is that this module asks one party and reads that party's answer, not
  what that party does to produce it. The absence half is also evidence rather than proof, being
  asserted over the traffic the harness observes - a channel it does not watch is outside what the check
  sees.
verification-method: test
