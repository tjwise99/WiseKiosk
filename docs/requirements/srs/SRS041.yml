rationale: |
  The weather module is upstream-backed, and what kind of thing it reads is the module's to say. The
  framework bounds where upstream data may reach the page from
  (SRS010<!-- The display page reaches no origin but the backend's -->) and obliges every source it
  supports to be reachable through the backend
  (SRS009<!-- Every source reachable through the backend, statelessly -->); neither says what a given
  module reads, so rewording this item to name another module names a different kind of source rather
  than leaving a sentence already said elsewhere.
  Abstracted, the item reads that an upstream-backed module takes what it shows from exactly one
  source, and that sentence is module-contract.md's rather than the tree's - under Writing the
  module's requirements, which places it in part 5's exactly one entry in the static, compile-time
  list. Nothing here is promoted and nothing is escalated: what this item adds to the structure that
  clause already binds is which kind of source the weather module's one is.
  One source rather than several is the choice being made. A second source for the same weather would
  need a rule for which answer wins when the two disagree, and a viewer reading one region cannot be
  told which one answered - so the display would carry a disagreement nobody can see and nobody can
  resolve. Changing which supplier is read is an edit to this repository rather than something an
  operator selects or the module arbitrates at runtime, so nothing here needs the plurality.
  No supplier is named. The obligation is on the kind of source and on there being one of it, and a
  requirement naming the party would make replacing that party a specification change.
