reviewed: aPKQHUwAzyxBSoMVcNQuWwaV4EqKGS5jQlkJJSn2_tw=
status: accepted
text: |
  The display page shall assemble the modules named in the configuration, each
  into its configured region of a single full-screen layout, using relative units.
  At the kiosk viewport (1920×1080, 16:9 landscape) the assembled layout shall
  exhibit no overlapping regions, no clipped content, and no scrollbars. At the
  desktop viewports 1280×800 and 1440×900 the layout shall reflow so that regions
  do not overlap and content is not clipped, and the page shall not scroll
  horizontally. At 375px width the layout shall not overlap, clip, or scroll
  horizontally. No device detection or per-client layout profile shall be used.
verification-method: test
