rationale: |
  Decomposes SYS008 (kiosk full-screen, the primary target) and SYS013 (desktop,
  the supported secondary) into the concrete viewport-driven render obligations
  their rationales anticipate. The deployed display is a 16:9 television, so
  1920×1080 landscape is the canonical kiosk test viewport; relative units carry
  the same layout to 4K without a second viewport. 1280×800 and 1440×900 are the
  desktop window sizes the secondary use case must render sensibly at. 375px is
  the stretch tier from FOUNDATIONS §1: a phone width is deliberately not a
  designed-for feature, so the obligation there is only that the layout not
  actively break — no overlap, no clipping, no horizontal scroll — not the full
  reflow fidelity required at desktop sizes. "No device detection or per-client
  layout profile" holds the §1 line that this costs relative units and a
  reflowing layout, not a responsive-design programme. Verified by viewport-driven
  render tests (Playwright-class) asserting the structural properties at each size;
  the residual aesthetic judgement stays human.
