header: |
  One instance, one configuration, nothing shared with another
level: 32
links:
- SYS003: null
normative: true
rationale: |
  SECURITY.md publishes this as a threat-model premise - "one instance serves exactly one
  configuration and shares no runtime state with any other" - and until now nothing in the tree
  obliged it. The check that establishes it existed, parented to the image item, verifying a property
  no requirement stated.

  It is the runtime consequence of SYS003 rather than a restatement of it. SYS003 and SRS018 say
  difference enters from outside the image; this says two instances given different inputs stay
  different, and that neither can reach the other's state. An image carrying no deployment-specific
  content still permits a shared writable volume, and two containers sharing one would satisfy SRS018
  while breaking the claim SECURITY.md makes.

  The household case is the concrete one: a second kiosk in another room, same image, different
  configuration, and no way for one to disturb the other.
ref: ''
status: proposed
text: |
  A running instance shall be determined solely by the configuration and secrets supplied to it,
  shall serve exactly one configuration, and shall share no runtime state with any other instance.
verification-justification: |
  Asserted by running two instances of one image side by side with different configurations and
  showing that neither reflects the other, that the image declares no shared writable storage, and
  that stopping one leaves the other serving. What the check does not settle is whether an operator
  can defeat it from outside - two deployments deliberately pointed at one bind mount share that
  mount, and no property of the image prevents it.
verification-method: test
