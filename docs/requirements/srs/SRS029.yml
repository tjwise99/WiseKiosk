header: |
  One schema, package-neutral, all boundary value classes
level: 1.29
links:
- SYS007: gygNneD3A0xV6q5KFtBovv0bgMlX3e9zgdO0nGPLfYI=
normative: true
rationale: |
  "Every payload shape and every parameter name" (TESTING.md Boundary tier)
  includes the error and status contracts the frontend renders from; enumerating
  the value classes keeps them from being the uncovered value the tier warns
  about. The schema's repository location is allocated by #5 and not fixed here.
ref: ''
reviewed: hqOb_GBcTMNLQLr2s4YZb2Ctw-U5R8Ah0Nwvtp2SkhY=
status: accepted
text: |
  The boundary contract shall be defined by exactly one schema artifact, owned by neither the
  backend nor the frontend package, from which both sides are generated. It shall define every value
  crossing the boundary: request parameter names and types, success response payloads, the
  structured upstream-failure body (SRS001), the client-error rejection body (SRS026), and every
  response status code the frontend discriminates on to choose an error state. Module-specific
  payloads shall reach it as module-owned fragments composed into it (SRS100); framework-wide values
  shall be defined in the schema itself. No boundary value shall be defined in more than one place.
verification-method: test
