header: |
  The weather module puts the present conditions and the near-term outlook across the boundary
level: 47
links:
- SYS010: dgflQFtHGeswH-PgjWmcBkfuJujSp-a-Z5JtN4H0Low=
normative: true
rationale: |
  A viewer standing in front of a wall display asks two questions and asks them together: what is it
  doing out there, and what is it about to do. The present half is what is doing, how warm it is, how
  warm it feels and how the wind stands - feel is carried separately from temperature because it is what
  a coat is chosen against and the two part company in wind and in damp. The forward half is stated as
  two ranges rather than one because the hours ahead answer whether to go out now and the days ahead
  answer whether to plan for tomorrow, and a single range answers one of those badly.
  Day or night is the fifth respect, and it is carried rather than worked out. What a source reports
  a sky with says what is happening and not when: the same condition stands for a clear morning and a
  clear midnight, so a display drawing one for the other has nothing in its payload that was wrong. It
  cannot be settled on the page either - the place reported on is the configuration's and need not be
  where the display hangs, and an hour of a forecast is a different sun's position from the hour the
  page is drawn in - so it is a distinct signal the module puts across for the present and for each
  hour it forecasts. The days ahead carry no such flag: a day is not day or night.
  The two ranges carry figures for the same reason the timing items do. Stated only as the hours next
  to come, the obligation is met by a payload carrying one of them, and a shaping that silently
  returned fewer would leave a viewer reading a shorter outlook than the display was built for with
  nothing to fail against - while a check written against the module's own constant asserts only that
  the module agrees with itself. Twelve hours reaches through the rest of a day already begun,
  answering not only whether to go out now but whether conditions hold across what is left of it, and
  five days far enough to plan around while still being a forecast worth reading rather than a guess.
  The item states what a viewer is owed and not the shape it arrives in. The names of the fields, their
  units, their types and however the source happens to encode a sky are the boundary schema's and the
  shaping library's; a requirement fixing any of them would settle an interface those records are the
  record of, and would tie the payload to one supplier's vocabulary.
  It is separate from what the module shows because a payload is settled without a page: the shaping
  runs on a captured response with no browser and no network, and a module handed everything a viewer is
  owed can still draw half of it.
