header: |
  The weather module puts the present conditions and the near-term outlook across the boundary
level: 47
links:
- SYS010: dgflQFtHGeswH-PgjWmcBkfuJujSp-a-Z5JtN4H0Low=
normative: true
rationale: |
  A viewer standing in front of a wall display asks two questions and asks them together: what is it
  doing out there, and what is it about to do. The present half is what is doing, how warm it is, how
  warm it feels and how the wind stands - feel is carried separately from temperature because it is what
  a coat is chosen against and the two part company in wind and in damp. The forward half is stated as
  two ranges rather than one because the hours ahead answer whether to go out now and the days ahead
  answer whether to plan for tomorrow, and a single range answers one of those badly.
  The item states what a viewer is owed and not the shape it arrives in. The names of the fields, their
  units, their types and however the source happens to encode a sky are the boundary schema's and the
  shaping library's; a requirement fixing any of them would settle an interface those records are the
  record of, and would tie the payload to one supplier's vocabulary.
  It is separate from what the module shows because a payload is settled without a page: the shaping
  runs on a captured response with no browser and no network, and a module handed everything a viewer is
  owed can still draw half of it.
