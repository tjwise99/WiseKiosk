status: accepted
text: |
  The weather module shall put across the boundary, for the location a request names, the weather there
  at present - what it is doing, how warm it is, how warm it feels and how the wind stands - together
  with what the weather is expected to be over the hours next to come and over the days next to come.
verification-justification: |
  Read from the module's shaping run against a captured response from its source, without a network: for
  the location the request named, what it produces carries the present weather in each of the four
  respects and both forward ranges.
  What it cannot settle is that any of it is true of the sky, the source being another party's system
  and outside this one. It is also bounded by the captures a suite holds: a response the source can
  return and no capture contains is unasserted here, which includes a source that answers with a value
  missing, so what is settled is the shaping of the responses that were captured rather than of every
  response the source can produce.
verification-method: test
