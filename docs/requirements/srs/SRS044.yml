reviewed: iYPl_S9EkFE6Ltj8q0bfUxC1NkQBQbk7Wh1G3hkIquA=
status: accepted
text: |
  The weather module shall put across the boundary, for the location a request names, the weather
  there at present - what it is doing, whether it is day or night, how warm it is, how warm it feels
  and how the wind stands - together with what the weather is expected to be over each of the twelve
  hours next to come, day or night with each of them, and over each of the five days next to come.
verification-justification: |
  Read from the module's shaping run against a captured response from its source, without a network:
  for the location the request named, what it produces carries the present weather in each of the five
  respects, both forward ranges at the lengths the item states, and the day-or-night distinction with
  each hour of the forward range that carries hours.
  What it cannot settle is that any of it is true of the sky, the source being another party's system
  and outside this one. It is also bounded by the captures a suite holds: a response the source can
  return and no capture contains is unasserted here, which includes a source that answers with a value
  missing, so what is settled is the shaping of the responses that were captured rather than of every
  response the source can produce.
verification-method: test
