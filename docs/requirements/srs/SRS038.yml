header: |
  Frontend builds to a static bundle with no SSR or router
level: 1.38
links:
- SYS025: m8cBQg83AS0sNzhFKajueIP_82WvmQgkwrQiUQALXOM=
normative: true
rationale: |
  SYS025 states the constraint; this item makes it verifiable at the artifact. A
  static SPA with no SSR, router, or meta-framework is observable in two places:
  the build output (a single static bundle served as files, not server-rendered
  markup) and the shipped dependency graph (no routing library or meta-framework
  runtime reaching the bundle). Phrasing the requirement against those observables
  keeps the SYS025 axiom from being an untestable assertion and catches the
  realistic regression — a contributor reaching for a router or an SSR adapter —
  at CI rather than in review prose.
ref: ''
