header: |
  Invalid configuration: backend refuses, reports, and flags unhealthy
level: 1.6
links:
- SYS003: null
normative: true
rationale: |
  Owner decisions 2026-07-22/23 (ADR 0007): refuse-and-report over hard exit.
  A hard exit leaves the headless display showing a browser connection error
  that names nothing, and the healthcheck is the only health signal the
  deployment has. Presentation of the report belongs to the frontend (SRS013).
ref: ''
status: proposed
text: |
  When boot validation fails, the backend shall serve no configuration and no
  module API. It shall expose a structured validation report listing every
  validation error — what is wrong, where, and what to change — and its
  healthcheck shall report unhealthy.
verification-method: test
