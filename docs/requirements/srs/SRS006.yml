header: |
  Unresolvable secret surfaces as that source's upstream failure
level: 1.16
links:
- SYS001: VGhozQiiHRgx8gA75WcFC3WXgp9KCc4dS_FDyA8tuGg=
- SYS003: x73sA6VMR9aDga-PqTW6L49gj-iwZdgTOg5xG8VhAwM=
normative: true
rationale: |
  The backend is config-blind (ADR 0007 rev 1) and cannot know which sources a deployment uses, so a
  boot-time secrets gate would brick deployments that use a subset of sources. A per-source failure
  at the kiosk names what is missing and leaves the rest of the display running
  (SYS001<!-- Failure is legible and proportionate -->) — the debuggable outcome chosen on #35 over
  failing to boot.
ref: ''
reviewed: _uhbAwg-OnYgRmFJ9Qu3Hoa_SI_qTGEeu7HWL-ZSXMg=
status: accepted
text: |
  The backend shall resolve a secret when handling a request for the
  source that needs it, not at boot; the backend shall boot successfully
  regardless of which secrets are deliverable. When a source's secret is
  unresolvable — <NAME>_FILE unset, or the file missing, unreadable, or
  empty after trailing-whitespace stripping — requests to that source's
  route shall fail with the same legible
  per-source failure treatment as any other upstream failure, identifying
  the unresolvable secret by name, while all other sources remain
  unaffected.
verification-justification: |
  Asserted at both ends - a boot with no secret deliverable succeeds, and a request to a source
  whose secret is unresolvable fails in the per-source form while its siblings serve. What no check
  settles is whether every unresolvable case is enumerated; the four named here are the ones the
  file interface makes reachable.
verification-method: test
