status: accepted
text: |
  The park-wait-times module shall show every park its configuration names at the same time, none
  waiting off screen for its turn.
verification-justification: |
  Read from a rendered page under a configuration naming several parks: every named park is drawn at the
  same sampled moment, none absent awaiting a rotation between parks.
  What it cannot settle is that every named park fits legibly in the region a given deployment gives the
  module - how small a card is drawn falls out of the grid's shape and the region's size and is a
  judgement about a real display in a real room - nor whether the arrangement chosen reads well.
verification-method: test
