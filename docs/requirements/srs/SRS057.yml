status: accepted
text: |
  WiseKiosk shall exhibit no unbounded growth in memory or other finite
  resources under sustained operation. Verification shall exercise the backend
  under sustained synthetic load for 60 minutes, sampling every 30 seconds, and
  shall assert that goroutine count and open file descriptors each return to
  within 10 percent of their post-warmup baseline. Heap occupancy shall be
  recorded as a diagnostic and shall not gate.
verification-method: test
