reviewed: _sVsMsovU-eeIVm3jOMINrrk52_yqbi67DaY5yxxroI=
status: accepted
text: |
  The park-wait-times module shall exclude from a park's rides any entity its configuration names for
  exclusion, and shall exclude, unless a deployer turns it off, a default set of entities the module
  names on its own.
verification-justification: |
  Read from the shaping run against a captured response whose rows include entities the default set
  names and entities a configuration separately names: each is absent from the park's rides regardless
  of the status it reports, an entity the default alone names reappears once a deployer turns the
  default off, and an entity the configuration names stays excluded either way.
  What it cannot settle is that the default names every entity a park's catalogue holds that is not a
  ride - a park the default has not been curated against, or a change to one it has, is unproven here -
  nor that a deployer's own name is written well enough to match what the source sends.
verification-method: test
