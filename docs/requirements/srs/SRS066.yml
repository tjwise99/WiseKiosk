header: |
  Standard browser-hardening response headers
level: 1.66
links:
- SYS006: KZtswOlxN1xD3PUvRX2djU9sCMFBskYb-6W5Iq6nOdo=
normative: true
rationale: |
  Closes MIME-confusion, clickjacking, referrer-leakage, and unused-capability
  abuse classes that the same-origin resource policy does not itself address.
ref: ''
reviewed: I53HUfQDyWlD14_VhLprXhILwbKR4p7eMw99RLtr9nQ=
status: accepted
text: |
  When serving the display frontend, the backend shall accompany its responses
  with the standard browser-hardening headers: X-Content-Type-Options set to
  nosniff; a frame-embedding denial via frame-ancestors 'none'; a
  referrer-minimising Referrer-Policy of no-referrer; and a Permissions-Policy
  disabling every browser feature the display does not use, namely camera,
  microphone, geolocation, usb, serial, bluetooth, payment, and idle-detection,
  each with an empty allowlist. Each header shall be present and no weaker than
  stated.
verification-method: test
