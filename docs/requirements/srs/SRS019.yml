header: |
  Workflows hold no credentials; Contract tier excluded from CI
level: 1.19
links:
- SYS003: r0OHFjma5xOn8ZgSOGL1oBns-m0Q-TKD9LQHrUnwXSw=
normative: true
rationale: |
  SYS003 decomposed to the repository surface that could violate it: the
  workflow files are where a credential secret would be introduced and
  where a credential-dependent job would be wired. CI wiring lives under
  .github/workflows/, which Doorstop cannot reference (ADR 0002), so the
  verifying inspection cites it here rather than in a references entry.
ref: ''
reviewed: gbK8r-jRAFQJ-ZMwFyeIK9Jaw7p-RbpNqn9rhnQGSA8=
status: accepted
text: |
  No CI workflow shall store or reference an API key or other upstream
  credential, and no CI job shall run a check that requires one. Contract-tier
  checks (TESTING.md) shall be wired to run outside CI, in a nested module
  outside the parent module's test discovery, so that their absence from CI is
  a language boundary rather than a skip, build tag, ignore entry, or
  hand-maintained exclusion (SRS068).
verification-method: test
