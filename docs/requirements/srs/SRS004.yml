header: |
  Page renders a legible error state for every configuration failure class
level: 1.13
links:
- SYS001: VGhozQiiHRgx8gA75WcFC3WXgp9KCc4dS_FDyA8tuGg=
normative: true
rationale: |
  ADR 0007 rev 2: the page shell runs validation itself and owns the presentation of its result. Failure
  classes are enumerated because SYS001's<!-- Failure is legible and proportionate -->
  never-a-blank- screen intent covers more than schema errors — an absent, unfetchable, or
  unparseable file must be as legible as an invalid one. Scoped to "no valid configuration applied"
  so a future live-apply path keeps the freedom to hold last-good on a bad reload.
ref: ''
reviewed: 2uqMlxQg1UPLJF8b1zazh1sB8le6lexjVqWRVAduEcU=
status: accepted
text: |
  When no configuration can be applied - the file absent, unfetchable,
  unparseable, or failing validation in a way that cannot be isolated to a
  single module - the display shall render a plain-language error state naming
  which failure occurred. The page shell shall load and render this state
  without requiring a valid configuration.
verification-justification: |
  Asserted by inducing each failure class and reading the rendered shell. What the check does not
  settle is that the four classes are exhaustive: a configuration failing in a way none of them
  names would render some state, and no check decides whether that state is the right one.
verification-method: test
