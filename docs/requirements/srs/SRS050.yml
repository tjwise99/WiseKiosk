status: accepted
text: |
  The weather module shall show, for the present weather and for each of the hours next to come,
  whether what it shows is a day's weather or a night's, following the distinction it is handed.
verification-justification: |
  Read from a rendered page handed payloads differing only in that distinction: what is drawn for the
  present and for each hour follows the payload, and does not follow the page's own clock where the
  two disagree.
  What it cannot settle is whether a viewer reads the marks as day and night - which is a judgement
  about a real display in a real room, and a check reads a rendered page rather than a viewer - nor
  that the distinction the payload carries is true of the sky at that place, the source being another
  party's system and outside this one.
verification-method: test
