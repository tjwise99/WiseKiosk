text: |
  WiseKiosk shall sustain at least thirty days of continuous unattended
  operation on the reference platform without operator intervention, and
  without degradation: no container restart, no unhandled process exit, and no
  module render stall exceeding that module's own refresh interval.
verification-justification: |
  The thirty-day window is the obligation, not an implementation of it: no bounded run establishes
  that the system survives thirty days. The observation is scripted - restart count, process exits,
  render stalls - so the human's role is starting the clock rather than judging the outcome.
verification-method: demonstration
