header: |
  Pending: the displayed time moves as the host clock moves
level: 74
links:
- SRS037: hTyiAGqlWlrBOwNWIR6jau_BeL-gwNorP7QdPmuft_M=
normative: true
rationale: |
  The failure this catches is a module that renders once. It is invisible at a single reading and
  invisible to the source check, which a clock frozen at mount passes completely, so the assertion has
  to be made across more than one reading of the same loaded page.
  Advancing the host clock rather than waiting is what keeps this in a tier that runs on every commit:
  the item obliges tracking, not a re-render every so many seconds, and a check that waited for real
  seconds would smuggle an interval into the requirement by choosing how long to wait.
ref: ''
reviewed: 6sDkq0Hy6rRJT8lGV5_i7MCaPohjD9kINMa_jkJ-Kgg=
status: proposed
text: |
  Pending: render test loading the page once, advancing the controlled host clock by more than the
  smallest unit the clock displays, and asserting the displayed time has moved to match - repeated so
  that a module updating once and stopping fails as well. Lands with the first vertical slice (#12);
  activated and given a references entry then.
verification-justification: |
  Settles that the displayed time follows the host clock across successive advances on one loaded page,
  which fails a clock frozen at first render and a clock that updates once.
  Leaves unproven the behaviour of a page left running for days: tracking is asserted over the span the
  harness holds the page open, so a drift or a stall appearing only over a long run is outside it.
verification-method: test
