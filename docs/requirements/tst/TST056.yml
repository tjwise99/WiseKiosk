rationale: |
  Two things are asserted together because either alone passes a module that fails the item.
  A payload that looks like weather does not say which party produced it, so the check stages the source
  and reads the page against what that source alone returned. And a module reading its source can still
  be reading a second one beside it - blending, or falling back - so the traffic the module causes is
  watched as well.
