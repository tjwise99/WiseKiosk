status: proposed
text: |
  Pending: unit and render test driving the module against one staged weather source and asserting the
  weather rendered is that source's answer, with no part of it drawn from anywhere else, while observing
  the traffic the module's route causes and asserting no request reaches a second source. Lands with the
  first vertical slice (#12); activated and given a references entry then.
verification-justification: |
  Settles that what a viewer reads is the one staged source's answer, over the traffic the harness
  observes.
  Leaves unproven what that source does behind its own boundary, it being another party's system, and
  bounds the absence half by what the harness watches - a destination it does not observe is not
  asserted about.
verification-method: test
