text: |
  Test asserting a route's global rate limit rejects requests over the threshold without an upstream
  call, that one source's traffic does not spend another's budget, and that cache hits are neither
  counted against the limit nor rejected by it.
verification-justification: |
  Settles that the limit rejects over threshold without an upstream call and that cache hits are
  neither counted nor rejected. Leaves unproven the threshold's value against a source's published
  limit.
