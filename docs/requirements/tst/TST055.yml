header: |
  Pending: the clock survives an unreachable backend
level: 77
links:
- SRS040: kHM_asrS0CgJK7zRaAQwi2AspEQV5oumMe6j-SQh-P0=
normative: true
rationale: |
  The render tier already stands a supplied upstream-backed module down against an unreachable backend;
  what it does not read is the other side of that distinction, a module that must not stand down. So
  this is asserted in the same staged outage.
  Its parent obliges every module that fetches nothing, and the clock is the one that exists, so the
  clock is what this reads. That is the ordinary shape of a verification item rather than a shortfall
  in it - a general obligation is verified by the instances there are, and the next local module brings
  its own item rather than being covered retrospectively by this one.
  Advancing is asserted rather than presence alone, because a clock frozen at the moment the backend
  went away is the failure that would otherwise read as survival.
