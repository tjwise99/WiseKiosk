text: |
  Pending: render a fixture configuration and read the rendered ground of every element the page
  draws, its root among them, asserting each sits at the display's minimum. Lands with the frontend
  skeleton (#10); activated and given a references entry then.
verification-justification: |
  Settles that the page draws no panel, card, fill or scrim anywhere, whatever the configuration -
  the population is every element rendered, so an element added is an element read, and there is no
  sampled area for a lit ground to hide in. Leaves unproven what a viewer sees there, which is the
  reflected room and outside the system; what the panel emits, since backlight, gamma and the
  half-silvered surface all lie past the value read; and any emission an element makes through its
  content rather than its ground, which a module presenting an image legitimately does.
verification-method: test
