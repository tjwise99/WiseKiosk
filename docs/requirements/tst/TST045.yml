text: |
  Pending: render a fixture configuration and read every emitting surface of every element the page
  draws - ground, border, outline and shadow, its root among them - asserting each sits at the
  display's minimum except where it is rendered text or imagery. Lands with the frontend skeleton
  (#10); activated and given a references entry then.
verification-justification: |
  Settles that the page draws no panel, card, fill, scrim, border, outline or shadow that emits,
  whatever the configuration - the population is every element rendered and every surface it emits
  from, so neither an element added nor a decoration drawn some other way escapes the reading. Leaves
  unproven what a viewer sees in the unlit surface, which is the reflected room and outside the
  system; what the panel emits, since backlight, gamma and the half-silvered surface all lie past the
  value read; and how much the exempt text and imagery themselves emit, which a large bright image
  takes the mirror with while satisfying this.
verification-method: test
