text: |
  Pending: test recomposing the boundary schema from its module fragments and asserting the
  committed schema is unchanged; asserting a bijection between registered modules and boundary
  fragments; and asserting each payload shape has exactly one definition site across the composed
  schema and its fragments. Lands with the codegen mechanism (#7).
