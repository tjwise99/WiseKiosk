rationale: |
  SRS023's<!-- The backend establishes no client identity and gates no route on one --> three
  checks establish that no identity machinery exists - no Set-Cookie or WWW-Authenticate, no 401 or
  403, no session or access-control middleware on the chain. None of them asserts that two different
  callers issuing the same request receive the same payload. A backend reading a caller address from
  a forwarded header and varying its response sets no cookie, returns neither status, and registers
  no middleware, so it satisfies all three while breaking the clause this item verifies.
