status: proposed
text: |
  Pending: integration test issuing the same request to a source endpoint from two clients that differ
  in every way the transport exposes - source address, forwarded-for header, user agent, and
  connection - and asserting the response bodies are byte-identical and the response headers differ in
  no value derived from the caller. Repeated after an intervening request from one of the two, so that
  a response varying with request history fails as well. Lands with the first module end-to-end
  (#12); activated and given a references entry then.
verification-justification: |
  What the check settles is that the transport-level facts a backend could discriminate on do not
  change the answer. What it does not settle is discrimination on a fact the test does not vary - a
  backend keying on something the harness holds constant would pass, so this is evidence against
  per-client behaviour rather than proof of its absence.
verification-method: test
