  configuration path, asserting the served configuration reflects the fixture byte-for-byte; and
  running the same image with no mount, asserting it fails loudly rather than serving a baked
  default. That nothing sits at the configuration path in the image is TST010's. Lands with the
  container image build (#54); activated then.
