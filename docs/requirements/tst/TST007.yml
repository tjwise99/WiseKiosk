text: |
  A CI matrix builds the published image on amd64 and arm64, one architecture per leg, and runs the
  smoke harness against each. The CI wiring lives under .github/
  (not Doorstop-referenceable, ADR 0002 rev 4) and is cited here; the non-dot-dir smoke harness it
  invokes is the references target.
verification-justification: |
  Settles that the image builds and smoke-tests on both architectures. Leaves unproven behaviour
  under load on either - the matrix establishes that it runs, not that it runs well.
