text: |
  Two checks. A unit test that serves a request naming two configured parks, one whose upstream call
  answers not found and one whose call fails only transiently: both parks are carried unavailable,
  each with its own message, the two messages differ rather than sharing the transient wording, and
  the park named alongside either is unaffected. And a render test that a card draws whichever message
  its own park was given, transient or permanent, without matching on the wording to treat either
  specially.
verification-justification: |
  Settles that an upstream's own not-found answer costs only that park, is worded distinctly from a
  transient failure, and that the frontend renders whichever message a park's own card carries
  without branching on it.
  What it cannot settle is that a park's identifier was ever valid to begin with - the source is the
  only authority on that - nor how a card's unavailable state is otherwise drawn, which is a different
  item's.
verification-method: test
