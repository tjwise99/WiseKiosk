text: |
  Unit test that serves a request naming two configured parks with one park's own upstream calls
  staged to fail while the other answers: the request still succeeds, the failed park is carried
  unavailable with a message naming why and no rides, and the other park is carried available with its
  rides unchanged.
verification-justification: |
  Settles that one park's own upstream failure costs only that park: the request succeeds, the failed
  park carries why and no rides, and the parks named alongside it are unaffected.
  What it cannot settle is a failure straddling two parks at once, which no capture stages, nor how a
  failed park's unavailable state is drawn on a rendered page, which is a different item's.
verification-method: test
