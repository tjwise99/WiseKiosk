status: proposed
text: |
  Pending: backend integration test that, for every entry in the static route registration list,
  induces each failure class - unreachable, timeout, non-success status, malformed payload - and
  asserts each produces the structured error payload, with the four pairwise distinguishable from it,
  so a backend answering all four identically fails. Lands with the proxy skeleton; activated and
  given a references entry then.
verification-justification: |
  Settles that each failure class produces a payload of the declared shape and that the four are
  pairwise distinguishable from it. Leaves unproven that the four cover what real upstreams do - a
  source failing in a fifth way produces some payload and nothing here decides which.
verification-method: test
