rationale: |
  Driven from the static route registration list rather than a hand-written route set, so coverage
  is total by construction and a route added later cannot escape the sweep - TST015
  <!-- Pending: no credential material on the wire, over every registered route -->'s ground,
  against the same list. Malformed payload is the one class that is per module rather than
  transport: it is the shaping library failing to parse, so it is induced per route rather than
  once.
