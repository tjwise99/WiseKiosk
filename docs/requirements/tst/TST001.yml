text: |
  Verified by scripts/check-links.mjs, which walks every tracked Markdown file
  and exits non-zero on the first relative link that escapes the repo or points
  at a missing file. It is wired into CI as the "Markdown links resolve inside
  the repo" step of the docs-and-hygiene job in .github/workflows/checks.yml,
  and runnable locally as `just check-links`.

  Note: the machine-checked reference above points only at scripts/check-links.mjs.
  Doorstop 3.2 cannot resolve a file reference under a dot-prefixed directory
  such as .github/, so the CI wiring (.github/workflows/checks.yml) is cited in
  prose rather than as a references entry. See ADR 0002.
