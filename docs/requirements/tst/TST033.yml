  Retired, unwritten, with the mechanism it verified. It would have injected a deliberate mismatch
  between the schema and a committed generated file, asserted a CI drift check failed, then
  regenerated and asserted the build passed. The mechanism generates at build instead, when the
  target file is absent, and a malformed schema fails compilation rather than a diff.
