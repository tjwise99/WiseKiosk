text: |
  Start two containers from one image with two different bind-mounted configurations on two ports,
  asserting each serves only its own configuration and neither reflects the other; assert the image
  declares no shared writable volume; then stop one and assert the other stays healthy.
verification-justification: |
  Settles that two instances of one image serve only their own configuration, declare no shared
  writable storage, and survive each other stopping. Leaves unproven what an operator can defeat
  from outside - two deployments pointed at one bind mount share it, and no image property prevents
  that.
verification-method: test
