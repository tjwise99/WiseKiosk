text: |
  Pending: test asserting the backend's transitive dependency set contains no configuration-schema
  or schema-validation package, so it cannot parse the display configuration; that environment reads
  appear only in the secrets resolver and only against the <NAME>_FILE form; and that the flag
  package and os.Args are unused, which is the decidable form of no tunable keys. Lands with the
  backend skeleton (#9).
