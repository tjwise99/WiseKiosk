text: |
  Start a container from the published image and assert its effective uid is non-root (not 0), and
  read the committed Dockerfile's final stage, asserting it declares an explicit non-root USER.
verification-justification: |
  Settles that the image declares a non-root user and runs as one. Leaves unproven what an operator
  does at run time, since a deployment can override the user and no image property prevents it.
