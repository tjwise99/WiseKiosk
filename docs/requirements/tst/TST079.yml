text: |
  Pending: two checks, one per half of what the bound is met between. A unit test over the module's
  registered policy, asserting the interval a served answer is held for is no longer than the five-minute
  freshness bound the requirement states. And a render test holding the page open against a source staged
  to change its answer and a driven clock, asserting the region carries the changed wait on the display's
  own cadence and without the page being reloaded. Lands with the wait-times implementation (#309);
  activated and given a references entry then.
verification-justification: |
  Settles both halves: that an answer is held no longer than the figure the requirement states, and that
  what is drawn follows a change at the source on a page nobody reloaded. Leaves unproven how far behind
  the queue the source itself runs, which is another party's and outside this system. The render half is
  asserted against a clock the harness drives, so a page left running far longer than the suite runs is
  outside it.
verification-method: test
