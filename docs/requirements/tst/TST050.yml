text: |
  Pending: compute the centre of the largest contiguous region carrying no content from rendered
  geometry and assert its offset from the display's centre is within tolerance in each dimension,
  across configurations chosen to load the display - the module roster at its fullest, and repeated
  instances of a module an operator may add. Lands with the frontend skeleton (#10); activated and
  given a references entry then.
verification-justification: |
  Settles that the reserve is where a viewer facing the display would be returned, rather than banked
  against an edge. Leaves unproven that any particular viewer is in front of it, which depends on the
  height the panel is hung at and is the operator's.
