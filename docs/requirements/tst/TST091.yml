text: |
  A render test over a configuration placing two parks whose payloads give them different numbers of
  pages to tour, asserting under a driven clock that both cards advance across the one tick while each
  has somewhere to advance to, and that they still change together at a later tick, by which the
  shorter tour has returned to its first page and the longer has not.
verification-justification: |
  Settles that the cards agree on the moment they turn, read off each card's own shown position rather
  than off a count the module exposes, so a module recording one tick and then drawing from a per-card
  timer is caught. The unequal page counts are what make it evidence at all: with equal counts the same
  assertions pass for per-card timers started together, which is the implementation the parent forbids.
  Leaves unproven that two advances land within any margin of one another - the readings are taken at
  chosen instants and establish that no card is a whole tick out of step, which is what the parent
  obliges and no more. Leaves unproven how the agreement is reached, the parent naming no mechanism.
  And it is bounded by the two-park roster and the page counts the fixture carries and by the number of
  turns the case drives, so a drift appearing only after more turns, or at a card count nothing
  samples, passes.
verification-method: test
