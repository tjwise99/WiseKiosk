header: |
  Cards of unequal page counts turn their pages on the one tick
level: 113
links:
- SRS072: null
normative: true
rationale: |
  The discriminator is the differing page counts, and without it the case asserts almost nothing. Two
  cards holding equally many pages stay level under a module that shares one tick and under a module
  that gives each card its own timer started when that card was first drawn, because the timers were
  started at the same moment and nothing has yet pulled them apart; such a case passes for the
  implementation the parent exists to forbid. Cards of different page counts come apart on their own -
  the shorter tour returns to its first page while the longer is still working through its own - so the
  positions the two cards show diverge while the moment they change at must not.
  Two readings for that reason. The first is taken across a tick at which both cards have somewhere to
  advance to, which establishes that they move at all and move together; the second across a tick at
  which the shorter tour has wrapped, which is where cards showing different positions must still agree
  on when. A module reading a shared count into each card's own page total passes both; a module
  keeping a timer per card fails the second even where it passes the first.
  The clock is driven rather than waited on, so what the cases read is which page each card shows at an
  instant they choose, and neither asserts how long the module takes to get there or how close together
  two advances land - the parent obliges no margin.
