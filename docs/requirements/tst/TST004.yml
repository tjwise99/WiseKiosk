text: |
  Bounded-growth observation over a continuous run under sustained load, two minutes long and
  sampled every two seconds by default, discarding the first three samples as warm-up and requiring
  at least eight judged samples for the run to be read at all. Resident memory fails on a rise from
  the median of the judged series' first quartile to the median of its last quartile exceeding ten
  percent. Duration, interval and the threshold are tunable here rather than in the requirement.
verification-justification: |
  Settles that resident memory does not rise past its threshold across the judged samples of the
  run. The comparison is between quartile medians rather than endpoints, so a single spike does not
  fail it while a sustained rise does. What it does not settle is the timescale the obligation is
  about: a two-minute run is a per-commit smoke test, and a leak slower than that window is
  invisible to it - evidence about a kiosk running for months is a longer soak this does not
  perform. It says nothing about any other resource either: SRS022<!-- A bounded running footprint -->
  names none, so what is sampled is only what
  TST043<!-- Handle count does not grow without bound --> and
  TST044<!-- Task count does not grow without bound --> add to this.
verification-method: test
