text: |
  Pending: bounded-growth observation over a run of at least sixty minutes, sampling resident memory
  and handle count at thirty-second intervals, failing on a monotonic increase in resident memory
  exceeding ten percent, on a monotonic increase in handle count exceeding its own threshold, or on any
  increase in the runtime's task count. Duration, interval and both thresholds are tunable here rather
  than in the requirement.
verification-justification: |
  Settles that memory, handles and tasks do not grow monotonically past their thresholds across the
  sampled run. Leaves unproven that those three are every resource the parent obliges - it names
  none, so a leak in a resource this does not sample passes - and the timescale the obligation is
  about: an hour is read as evidence about months, and a leak slower than the window is invisible.
verification-method: test
