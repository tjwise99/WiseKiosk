text: |
  Over the shared instrumented run, failing on any increase in the runtime's task count between the
  first and last judged sample. Each sample's count is the lowest of several readings taken a few
  milliseconds apart, so a task serving a request in flight at one reading is not counted as one
  that leaked.
verification-justification: |
  Settles that the task count does not end the judged samples above where it started. Its predicate
  is absolute where its siblings carry thresholds: the load pool runs across both readings and
  contributes the same tasks to each, so what an increase leaves is growth. Leaves unproven the
  timescale the obligation is about: a two-minute run is a per-commit smoke test, not evidence about
  a kiosk running for months.
verification-method: test
