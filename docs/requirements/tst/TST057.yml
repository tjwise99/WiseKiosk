normative: true
rationale: |
  One configuration is not enough. A module ignoring its configuration and reporting on a place fixed in
  its own code passes a single reading whenever that place happens to be the one configured, so two are
  driven and both halves are read to move with them.
  The request and the region are both read because either alone is satisfiable while the item fails: a
  module can ask about the right place and draw a cached answer for another, or ask about the wrong one
  and draw its answer faithfully.
