text: |
  Render test loading the page under two configurations naming two locations, against a source staged
  to answer differently by location, and asserting that the request the module causes carries the
  configured location and that the region shows the answer given for it, both following the
  configuration.
verification-justification: |
  Settles that the place configured is the place asked about and the place drawn.
  Leaves unproven that the source's answer is true of that place, which is the source's own and outside
  this system. It settles nothing about a configuration naming no location, which is a
  configuration-validation question rather than this module's.
verification-method: test
