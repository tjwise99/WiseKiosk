text: |
  Pending: test asserting WebSocket and EventSource appear nowhere in the shipped bundle and are
  never constructed during a page render - they are the platform's only push primitives, so their
  absence is decidable rather than a denylist; rendering the assembled page under fake timers and
  advancing to one module's cadence to assert exactly one refetch for it and none for another, then
  the reverse; and asserting the composed configuration schema declares no refresh, cadence, or
  interval property, which is the strongest clause and a single assertion over one artifact. Lands
  with the frontend skeleton (#10).
