text: |
  Over the shared instrumented run, failing when the highest descriptor count among the judged
  samples sits more than sixteen above the idle baseline read before load starts. The peak rather
  than a median, because a descriptor leak shows first in the highest reading. The margin is tunable
  here rather than in the requirement.
verification-justification: |
  Settles that the descriptor count does not peak more than sixteen above the idle baseline across
  the judged samples. The margin is calibrated against what the backend legitimately holds under
  load - the outbound client's pooled sockets, and the secret file each cache miss opens and closes
  - rather than chosen, so a margin that stopped matching the design is a failing run rather than a
  silent allowance. Leaves unproven the timescale the obligation is about: a two-minute run is a
  per-commit smoke test, not evidence about a kiosk running for months.
verification-method: test
