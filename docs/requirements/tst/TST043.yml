text: |
  Pending: over the shared instrumented run, failing on a monotonic increase in the backend's handle
  count exceeding its own threshold. The threshold is tunable here rather than in the requirement.
verification-justification: |
  Settles that the handle count does not grow monotonically past its threshold across the sampled run.
  Leaves unproven the timescale the obligation is about, and carries no threshold value yet: until the
  backend exists there is no idle handle count to set one against, so activating this item sets it.
