text: |
  Pending: test enumerating modules and asserting each has a render test beside its component, and
  that each module registered against an external source additionally has a unit test beside its
  shaping library. A module with no registration entry is a local module and is not expected to have
  one. Correct location is sufficient proof CI reaches them, since SRS068 forbids any skip, build
  tag, or exclusion that would silence a committed test. What those tests assert is SRS033's and
  SRS040's obligation, not this one. Lands with the first module (#12).
