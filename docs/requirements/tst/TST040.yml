text: |
  Check that induces a backend outage with the page already served, and asserts the display renders
  one page-wide unreachable state rather than a per-module unavailable state in each region; and that
  the state carries a remediation field, non-empty and not equal to the diagnosis it reports.
verification-justification: |
  Settles that one page-wide state replaces the per-module states and that it carries a remediation
  distinct from its diagnosis. Leaves unproven whether the remediation is the right advice - #71
  recommends it, no gate decides it.
  The replacement half is asserted against nothing: no module carries an unavailable state yet, so
  what the check reads is that the page raises one state, not that it raises one instead of several.
  It is re-read when #12 first module end-to-end lands a module whose own failure is rendered.
verification-method: test
