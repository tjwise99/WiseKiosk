normative: true
rationale: |
  The fake-timer cadence assertion was struck: it measured the frontend's poll interval against a
  backend rate bound SRS011's text declares irrelevant ("regardless of how many clients it serves or
  how often they ask"). That a cadence is a constant in code rather than an operator-tunable key is
  module-contract.md's, under Cadence and TTL are chosen together. What remains here is SRS011's own
  clause that the bound is not raisable by configuration.
ref: ''
reviewed: null
status: proposed
text: |
  Pending: test asserting the composed configuration schema declares no property that sets a refresh
  cadence, by ranging over the policies a registration entry owns and asserting none of them is
  reachable from a schema property - not by matching a keyword list, which fails open on a name nobody
  anticipated. Lands with the frontend skeleton (#10).
verification-justification: |
  Settles that no schema property reaches a cadence policy, by ranging over the registration entry's
  own policies rather than a keyword list. Leaves unproven a cadence made configurable by a
  mechanism outside the schema.
verification-method: test
