text: |
  Check that induces a backend outage with the page already served, and asserts the display renders
  one page-wide unreachable state rather than a per-module unavailable state in each region; and
  that the state carries a remediation field, non-empty and not equal to the diagnosis it reports.
verification-justification: |
  Settles that one page-wide state replaces the per-module states and that it carries a remediation
  distinct from its diagnosis. Leaves unproven whether the remediation is the right advice - #71
  recommends it, no gate decides it. Leaves unproven, too, that a module standing down keeps no
  content. What the stand-down case asserts is that a module handed a false reachability signal
  renders nothing of the box it drew while reachable; the fixture it reads carries no payload, so a
  module that dropped that box and went on showing last-known content is not distinguished here from
  one that stood down. That is structural rather than a weakness of this check: the render tier reads
  the stand-down against a module it supplies, and honouring the signal is each module's own, so no
  supplied fixture settles it for a module the tier does not supply. It lands with the first vertical
  slice (#12), which has to decide where an upstream-backed module's stand-down is verified.
verification-method: test
