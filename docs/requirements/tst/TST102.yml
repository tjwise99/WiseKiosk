rationale: |
  An equality against the declared chain, not a search for session or authentication packages: a
  denylist of known middleware passes the first time one is hand-rolled, and this repository rejects
  denylist controls on principle. Equality fails closed — any middleware nobody declared, whatever
  it is called, breaks the assertion.
