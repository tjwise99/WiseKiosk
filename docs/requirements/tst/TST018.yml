rationale: |
  SRS021's justification rested on both proxies before either was specified anywhere, so they are
  stated here.

  Emulation is the accepted evidence for the Zero-class claim (owner decision 2026-07-29). A run on
  physical hardware happens when a deployment is stood up and is obliged by nothing - not by this item,
  not by TESTING.md, not by a review checklist - so the whole of what this item asserts is
  CI-runnable, which is why it sits at test rather than demonstration. What emulation cannot decide is
  device timing, and the throttled budget and bundle ceiling carry that half instead of the boot.
