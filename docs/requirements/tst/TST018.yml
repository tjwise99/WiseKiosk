text: |
  Pending: test booting the frontend under ARM emulation at Raspberry Pi Zero-class resources and
  asserting it renders and drives the display, with render timing under CPU throttling against a stated
  budget and the emitted bundle size against a committed ceiling. Lands with the frontend skeleton
  (#10); activated then.
verification-justification: |
  Settles that the frontend renders and drives the display under ARM emulation at the declared resource
  class, within a throttled render budget and a bundle ceiling. Leaves unproven device timing - the
  emulator's clock is not the device's - which is accepted rather than outstanding.
verification-method: test
