rationale: |
  Presence alone would pass a component that ran the three parts together into one undifferentiated
  block, which is the failure the item names rather than an untidy version of success. So separability
  is asserted beside presence.
  It is read from the rendered output rather than from what the component was handed, the whole
  distinction between this and the payload obligation being that a component can be given everything and
  draw half of it.
