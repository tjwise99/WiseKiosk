text: |
  Render test handing the component a payload and asserting the present weather and both forward
  ranges are all drawn, and that each of the three is separable from the other two in what is
  rendered.
verification-justification: |
  Settles that all three are drawn and are told apart in the rendered output.
  Leaves unproven that a viewer glancing across a room tells them apart, which is a judgement about a
  real display in a real room and not something a rendered page settles. It is bounded by the payloads
  the suite supplies: a payload shape no case covers is unasserted.
