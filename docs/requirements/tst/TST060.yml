text: |
  Pending: integration test asserting the frontend-serving response and every proxy response carry
  X-Content-Type-Options: nosniff, and that a proxied upstream response whose declared media type is
  wrong is not executed as script by the browser. Fails if the header is absent or weakened on any
  served route. Lands with the backend that serves the frontend; activated with a references entry to
  the integration test then.
