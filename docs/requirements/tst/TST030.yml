status: proposed
text: |
  Test asserting an upstream that hangs past the outbound timeout, or returns a response over the
  size bound, is handled as an upstream failure without wedging the request handler or exhausting
  process memory; and that a concurrent request to a healthy source completes normally while one
  upstream is still hanging, so a single stalled exchange is shown not to stall the backend rather
  than only not to crash it.
verification-justification: |
  Settles that a hung or oversized exchange neither wedges the handler nor exhausts memory, and that
  a concurrent request still completes. Leaves unproven that the timeout and size values are right
  for a real upstream.
verification-method: test
