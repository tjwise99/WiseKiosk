text: |
  Verified by scripts/check-verify-ci-parity.mjs, which extracts the check tokens `just verify`
  depends on, asserts each appears in .github/workflows/checks.yml, and asserts every CI step matches
  either a mapped token or the named CI-only allowlist (secret scanning; the PR-title
  Conventional-Commit check). Fails on a divergence in either direction. Runnable locally as
  `just check-verify-ci-parity`; wired into CI as the docs-and-hygiene job's parity step in
  .github/workflows/checks.yml, cited here in prose because Doorstop cannot reference files under
  dot-directories (ADR 0002).
