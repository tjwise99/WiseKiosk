text: |
  Pending: demonstration asserting the build-provenance attestation validates for the published
  image digest and binds it to its build workflow, and fails for a mismatched digest (expected:
  cosign verify-attestation or gh attestation verify; SLSA provenance). Fails if the attestation is
  absent or does not verify. Lands when the image is published; activated with a references entry to
  the verify script then. Owned by #67.
