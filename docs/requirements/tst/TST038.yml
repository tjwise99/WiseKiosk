text: |
  Integration test requesting the backend's frontend-serving route and asserting the response
  carries a Content-Security-Policy whose connect-src is exactly 'self', whose default-src is
  'self', and whose base-uri is exactly 'self', and asserting the page still renders under the
  served policy. Fails if the header is absent, if connect-src, default-src or base-uri admits any
  host, wildcard, scheme-source, or 'unsafe-' form, or if the served policy breaks rendering.
verification-justification: |
  Settles that the served policy restricts connect-src and default-src to 'self' and that the page
  renders under it. Leaves unproven whether the browser in the field enforces the policy as served.
verification-method: test
