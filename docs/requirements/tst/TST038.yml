text: |
  Pending: test asserting the build emits exactly one HTML entry whose mount element is empty, that
  no server-entry chunk is produced and the build configuration declares no SSR target or adapter,
  and that the set of npm packages appearing in the emitted module graph is a subset of a committed
  allowlist manifest. The allowlist is deliberate: a denylist of named routers and meta-frameworks
  fails open the first time someone hand-rolls a hash router, and any new runtime dependency should
  fail until it is reviewed. Lands with the frontend skeleton (#10).
