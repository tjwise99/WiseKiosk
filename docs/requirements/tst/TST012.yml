header: |
  The published image carries no secret material
level: 1.14
links:
- SRS025: Ru3Q6IBSgjCJAdEUd3Hb0Ppg12_EcwOG12CSOXBTOJ4=
normative: true
rationale: |
  The earlier form asserted that "no secret material is present", a predicate with no oracle anywhere
  in the corpus, and offered as its fallback a canary "delivered the supported way" - which is
  <NAME>_FILE at run time, and a run-time value cannot be in a build layer, so that clause could not
  fail on the image either. Both are replaced by artifacts the check owns: a committed pattern set, and
  a canary planted where the image can actually carry it.
ref: ''
references:
- path: scripts/image/layer_secret_scan.py
  type: file
reviewed: GBERp9Fk-jmk8pVXV_crqgo_45ljtNe7VWF_kKpIiOo=
status: accepted
text: |
  Export the published image filesystem and every layer, asserting that no value matching the
  committed secret-pattern set appears in any of them - not in a file, not in the image environment,
  and not in a layer an earlier stage deleted. The pattern set is the check's own committed
  artifact, so "secret material" resolves to an enumeration rather than a judgement. A planted
  canary, written into the build context before the build, must be reported.
verification-justification: |
  Settles that no value matching the committed pattern set appears in any layer, and that a planted
  canary is reported. Leaves unproven a secret the pattern set does not describe; the predicate is
  an enumeration this project maintains, not a decision procedure.
verification-method: test
