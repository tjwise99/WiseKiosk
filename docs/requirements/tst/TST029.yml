status: proposed
text: |
  Test asserting the backend returns 400 (invalid parameter), 404 (unknown source), 405 (non-GET
  method), and 429 (over rate limit), each with a renderable body distinct from the
  upstream-failure shape and each without an upstream call.
verification-justification: |
  Settles that each rejection cause produces its own status with a renderable body, before any
  upstream call. Leaves unproven that a person reading the rendered rejection can act on it.
verification-method: test
