status: proposed
text: |
  Integration test asserting the frontend-serving response and every proxy response carry a
  Content-Type header with a concrete media type, and carry X-Content-Type-Options: nosniff. Fails if
  either is absent on any served route, if a Content-Type is empty or generic enough to leave the
  type unstated, or if the nosniff value is weakened.
verification-justification: |
  Settles that a concrete media type and the no-inference header are present on every served route.
  Leaves unproven that a declared type is correct for the bytes beneath it - an upstream
  mislabelling its own payload is outside what this reaches.
verification-method: test
