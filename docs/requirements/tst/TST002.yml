text: |
  Pending: render test that, for every registered module holding a boundary payload, asserts the module
  renders its error state from an error payload while sibling modules render normally, and that it renders a
  distinct state for each failure cause, so a component collapsing them to one message fails. Lands with the frontend skeleton; activated and given a references entry
  then.
verification-justification: |
  Settles that a module renders its error state while siblings render normally, and that it does not
  collapse the causes the backend distinguished. Leaves unproven the wording, which
  SYS001 <!-- Failure is legible and proportionate --> routes to review.
verification-method: test
