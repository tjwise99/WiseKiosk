reviewed: null
status: proposed
text: |
  Pending: render test driving two fixtures through the same validation path and asserting opposite
  outcomes. A configuration whose only error is inside one module's fragment: the page renders, that
  module's region carries the error state, it names what is wrong and what to change, and no sibling
  region is affected. A configuration whose top level is malformed: no module renders and the page
  carries the page-wide state instead. The two fixtures differ only in where the error sits, so the
  isolable/non-isolable branch is decided rather than assumed. Lands with the frontend skeleton (#10);
  activated and given a references entry then.
