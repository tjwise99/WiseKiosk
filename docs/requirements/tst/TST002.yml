rationale: |
  Both fixtures run the one validation entry point, because the branch this asserts is a property of
  that path rather than of two separately reachable behaviours. Splitting them across two checks would
  let each pass against a different code path and leave the branch itself untested - which is what the
  SRS002/SRS003 pair did before.
