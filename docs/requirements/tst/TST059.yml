status: proposed
text: |
  Pending: unit test running the module's shaping over a captured response from its source, with no
  network, and asserting the payload it produces carries, for the location the request named, the
  present weather in each of the four respects and both forward ranges. Lands with the first vertical
  slice (#12); activated and given a references entry then.
verification-justification: |
  Settles that a captured response is reshaped into everything a viewer is owed.
  Leaves unproven the truth of any value in it, the source being outside this system, and bounds
  coverage by the captures the suite holds: a response the source can return and no capture contains -
  a value missing, a range short - is unasserted here.
verification-method: test
