rationale: |
  Read against a captured response rather than a live source, so what is asserted is the shaping rather
  than the weather on the day the suite runs. A live source would make the same test pass or fail with
  the sky.
  All four present respects and both ranges are asserted rather than the payload being checked for
  shape, because a shaping that dropped one of them produces a payload that still parses and still
  renders.
