text: |
  Integration test asserting the (source, query) TTL cache serves an identical request from cache
  within the TTL without an upstream call and refetches after expiry, using a fake upstream that
  counts calls and a fake clock that advances past the TTL. This cache-behaviour test is the
  standing liveness canary for the REST transport.
verification-justification: |
  Settles that an identical request within the TTL issues no upstream call and refetches after
  expiry. Leaves unproven the TTL's value against a source's actual update cadence.
verification-method: test
