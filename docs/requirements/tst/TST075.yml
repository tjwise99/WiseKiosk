status: accepted
text: |
  Unit test of ranked, heldRides, remainingRides and noOpenRides, the pure functions the leaderboard is
  built from: ranked and heldRides keep only rides carrying a numeric wait, longest first, holding the
  configured count of them, and hold nothing for a park with no numeric wait. remainingRides carries
  everything heldRides did not, in the source's own order - a not-operating ride, never held, tours
  there instead. noOpenRides is true only where every one of a park's rides is a not-operating state, or
  the park has none.
verification-justification: |
  Settles the pure computation the leaderboard is built from: which rides rank and how many are held,
  that the remainder is exactly the complement of what is held rather than re-sorted or missing an
  entry, and that a park with nothing open is told apart from one that is not. Leaves unproven that the
  number held is the right one to hold, which is a composition judgement, and how the held/remaining
  split renders on screen, which the render suite covers separately.
verification-method: test
