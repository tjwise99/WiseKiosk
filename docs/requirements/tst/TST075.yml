text: |
  Render test that, handed a park's rides with differing waits, the leaderboard holds the three longest
  numeric waits, descending — a not-operating ride, carrying no figure to rank, takes no leaderboard
  place regardless of where it sits in the source, and still reads in the rotation of the rest rather
  than being dropped — and reads unmoved while that rotation advances underneath it.
verification-justification: |
  Settles that the persistent reading is the longest waits and that it persists. Leaves unproven that the
  number held is the right one to hold, which is a composition judgement.
