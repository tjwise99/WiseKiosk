status: proposed
text: |
  Two checks, one per half of what the bound is met between. A unit test over the module's registered
  policy, asserting the interval a served answer is held for is no longer than the freshness bound the
  requirement states. And a render test holding the page open against a source staged to change its
  answer and a driven clock, asserting the region carries the changed answer on the display's own
  cadence and without the page being reloaded.
verification-justification: |
  Settles both halves: that an answer is held no longer than the figure the requirement states, and
  that what is drawn follows a change at the source on a page nobody reloaded. Leaves unproven how far
  behind the weather the source itself runs, which is another party's and outside this system. The
  render half is asserted against a clock the harness drives rather than a wall clock, so what is
  settled there is the module's behaviour as time is presented to it, and a page left running far
  longer than the suite runs is outside it.
verification-method: test
