status: proposed
text: |
  Render test holding the page open against a source staged to change its answer and a driven clock,
  asserting the region carries the changed answer within the freshness bound the requirement states
  and without the page being reloaded.
verification-justification: |
  Settles that what is drawn follows a change at the source inside the bound, on a page nobody reloaded.
  Leaves unproven how far behind the weather the source itself runs, which is another party's and
  outside this system. It is asserted against a clock the harness drives rather than a wall clock, so
  what is settled is the module's behaviour as time is presented to it, and a page left running far
  longer than the suite runs is outside it.
verification-method: test
