header: |
  The weather shown follows its source inside the freshness bound
level: 83
links:
- SRS046: twOwP_ffa_ll4QDgilsFX0QBaqRfP1KwM6EUN9qcKwA=
normative: true
rationale: |
  Two things are staged because neither alone makes the bound decidable. A source that never changes its
  answer cannot show the page following one, and a wall clock cannot be run for the length of the bound
  inside a suite, so the source is moved and the clock is driven.
  The reload is what the assertion is against. A page that picked up the change only when it was loaded
  again would satisfy any reading taken after a reload while leaving a display that is never reloaded
  showing weather from whenever it started.
