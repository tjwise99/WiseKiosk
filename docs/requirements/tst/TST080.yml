text: |
  Unit test over the module's registered policy — the cache interval and the rate/burst figures it
  declares hold the five-minute-per-park bound. And an integration test over fetchPark against a staged
  answering source: a park's own two upstream calls are cached under that park's own keys, so asking
  again inside the freshness window costs no further call, and a second park's own fetch is unaffected
  by the first's cache.
verification-justification: |
  Settles the rate this system emits over the window the harness runs. Leaves unproven whether the
  source accepts that rate, which is its own policy and outside this system.
verification-method: test
