text: |
  Pending: read the geometry of every region the page lays out and assert none intersects the reserve
  area, over configurations chosen to load the display - the module roster at its fullest, and
  repeated instances of a module an operator may add. Lands with the frontend skeleton (#10);
  activated and given a references entry then.
verification-justification: |
  Settles that no configuration can place a module in the reserve, because no region covers it. That
  is the whole of what the page decides, and it is why erosion by adding modules cannot reach the
  mirror. Leaves unproven that the reserve stays empty of every pixel: content overflowing an
  adjacent region may cross into it, which the overflow ruling permits and this check does not
  contradict. Leaves unproven too that a viewer stands before the reserve, which follows from the
  height the panel is hung at and is the operator's.
verification-method: test
