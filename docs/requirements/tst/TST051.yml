status: proposed
text: |
  Pending: render test driving the page against a controlled host clock and asserting the time shown is
  that clock's, while observing the page's traffic and asserting no request attributable to the clock
  is issued for the time and no channel is opened that could deliver one. Lands with the first vertical
  slice (#12); activated and given a references entry then.
verification-justification: |
  Settles that the value shown follows the host clock and that no request or subscription for the time
  is made over the traffic the harness observes.
  Leaves unproven that the host clock is right, the host being outside this system, and bounds the
  no-request half by what the harness can see - a channel it does not watch is not asserted about.
verification-method: test
