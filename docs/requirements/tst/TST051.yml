header: |
  Pending: the clock's time comes off the host and off nothing else
level: 73
links:
- SRS036: aXZR2wK_pGQpzFH-1GHvvfzmEVyzqYM4A09moVd2OlE=
normative: true
rationale: |
  Two things are asserted together because either alone passes a module that fails the item.
  A clock reading the host is not distinguished from a clock reading anything else by the value it
  shows at one instant, so the check drives the host clock and reads the page against it. And a module
  showing the host's time can still have asked for a time it then ignored, or subscribed to a channel
  that would have overridden it, so the traffic is watched as well.
