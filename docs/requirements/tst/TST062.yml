header: |
  The weather module's upstream rate and concurrency bounds hold
level: 84
links:
- SRS047: 4QyJkk1fU7vKwq0YrR5f0J4HRnNPHhs8p3P9hSwCGKo=
normative: true
rationale: |
  The source is staged slow deliberately. The concurrency half can only fail while an answer is
  outstanding long enough for a second ask to fall due, and against a source that answers at once the
  two clauses of the item are indistinguishable - every reading shows one request at a time whether or
  not anything enforces it.
  The clock is driven for the same reason the freshness reading drives it: an hourly bound cannot be
  read from a suite that runs for seconds.
