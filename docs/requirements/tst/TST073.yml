text: |
  Verified by inspecting `justfile`'s `verify` recipe: every check that spans both packages or the
  repository as a whole (links, line endings, requirements-tree integrity, boundary/lint/build,
  docs-site, architecture) is a `verify` dependency invoked at repo level, and none is hosted inside a
  single package's own test target.
verification-justification: |
  Deciding whether a check is repo-spanning requires reading what it does; the classification is a
  judgement about scope, not a property visible in the justfile's structure.
