text: |
  Unit test that shapeRides and shapeHours, run against a captured live-data and schedule response with
  no network, keep only the attraction rows and produce, for the captured park, its rides in the
  source's own order — each with its name and its wait as a length of time or one of the three
  not-operating states — and its opening and closing time for the day; and that a ride's own missing
  wait value is refused rather than shaped.
verification-justification: |
  Settles the shaping of the responses that were captured. Leaves unproven that the payload is true of
  the queue, and any response shape no capture holds, including a ride's wait missing.
verification-method: test
