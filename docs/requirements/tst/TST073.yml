text: |
  Unit test that shapeRides and shapeHours, run against a captured live-data and schedule response with
  no network, keep only the attraction rows and produce, for the captured park, its rides in the
  source's own order — each with its name and its wait as a length of time or one of the three
  not-operating states — and its opening and closing time for the day, drawn from the first OPERATING
  entry whose calendar date, read in that entry's own UTC offset, matches the day of the moment read,
  passing over an entry of another type and an OPERATING entry whose date does not match; and that an
  attraction reporting no wait while operating is dropped from the park's rides rather than carried
  with a wait it was not given.
verification-justification: |
  Settles the shaping of the responses that were captured, including a capture mutated so one
  attraction reports OPERATING with no posted wait, dropped rather than shaped, and the park's own
  fetch left available and carrying its other rides over that one row. Leaves unproven that the
  payload is true of the queue, and any response shape no capture holds, including a schedule whose
  day-selection turns on an OPERATING entry that is not the first of its type, a day with only
  ticketed entries, an empty schedule, or an entry read against a UTC offset the captures do not
  exercise.
verification-method: test
