text: |
  Pending: test asserting, for every registered source, that a request whose
  parameters do not match the pattern that source declares is rejected with no
  upstream call — driven from the registered set so a source added later cannot
  escape the sweep. Lands with the first module end-to-end (#12); activated
  and given a references entry then.
verification-justification: |
  Settles that a non-conforming request is rejected with no upstream call, for every registered
  source. Leaves unproven that a source's declared pattern matches what that source accepts - a
  wrong pattern rejects valid requests just as decidably.
verification-method: test
