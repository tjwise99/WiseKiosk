text: |
  Route test asserting the backend boots with no secrets delivered, and that a request to a source
  whose secret is unresolvable (<NAME>_FILE unset; file missing; file unreadable; file empty after
  trailing-whitespace stripping) returns that source's legible upstream-failure response naming the
  secret and carrying neither the value nor the path it was looked for at, makes no upstream call,
  and leaves other sources serving.
verification-justification: |
  Settles boot independence and the per-source failure treatment across the four unresolvable cases
  the file interface makes reachable. Leaves unproven any fifth case, and whether an operator
  reading the named secret can find it.
verification-method: test
