text: |
  Pending: proxy test asserting the backend boots with no secrets
  delivered, and a request to a source whose secret is unresolvable
  (<NAME>_FILE unset; file missing; file unreadable; file empty after
  trailing-whitespace stripping) returns that source's legible
  upstream-failure response naming the secret, while
  other sources still serve. Lands with the backend skeleton (#9);
  activated and given a references entry then.
verification-justification: |
  Settles boot independence and the per-source failure treatment across the four unresolvable cases
  the file interface makes reachable. Leaves unproven any fifth case, and whether an operator
  reading the named secret can find it.
