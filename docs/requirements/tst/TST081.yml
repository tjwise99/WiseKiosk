text: |
  Unit test over the module's registered policy — the failure interval it declares holds the
  five-minute bound. And an integration test over fetchPark against a source staged to fail, called far
  oftener than the bound permits: a park held under the negative cache costs no further upstream call
  on a second ask inside the failure window.
verification-justification: |
  Settles the failure-path rate under a driven clock over the suite window. Leaves unproven what the
  source makes of being retried while down, and whether five minutes is the right recovery-and-politeness
  trade, which is argued in the parent.
verification-method: test
