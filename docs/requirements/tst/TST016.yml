header: |
  Pending: every schema key is varied by a fixture and renders
level: 1.15
links:
- SRS024: gvun7ucVZY3Al3dO2WmSVXb4b-PllWXh6yfPkOLkmJ4=
normative: true
rationale: |
  Enumerating from the schema rather than from the fixtures is what makes the check closed: driven
  from the fixtures it would only confirm that whatever is tested passes, which is what it already
  knows.
ref: ''
reviewed: 5lTJo8X6LfdjVR1YW-xQVSbi3stoy-WVywRViH3Lr20=
status: proposed
text: |
  Pending: test enumerating the composed configuration schema's keys and asserting, for each, that
  the page rendered from a fixture setting it to a non-default schema-valid value differs observably
  from the page rendered at its default, and that the page renders without error at each
  schema-valid value the key admits. Fails on a key no fixture varies, and on a key whose variation
  changes nothing. Lands with the config schema (#8) and the frontend skeleton (#10).
verification-justification: |
  Settles per key that a non-default value changes the page and that every admitted value renders.
  Leaves unproven that the change is the intended one - observability is decidable, correctness is
  the module's own.
verification-method: test
