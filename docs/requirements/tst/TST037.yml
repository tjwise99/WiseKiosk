text: |
  Pending: test rendering each module component with only its props supplied and the network globals
  stubbed - fetch, XMLHttpRequest, WebSocket, EventSource - asserting zero calls to any of them. The
  rendered region is asserted to reflect the supplied props so that a component which renders nothing
  cannot pass the zero-call assertion vacuously. Lands with the first module (#12).
verification-justification: |
  Settles that a component issues no network request of its own, with the props assertion preventing
  a component that renders nothing from passing vacuously. Leaves unproven a request issued by a
  shared data layer the component calls into.
verification-method: test
