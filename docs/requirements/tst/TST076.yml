text: |
  Render test that, handed a park with more rides than the leaderboard holds, under a driven clock and
  two distinct rotation-interval configurations, the tour advances two rides at a time when its own
  configured interval elapses and not before, reaches every remaining ride across a full cycle, and the
  footer marks the tour's own position.
verification-justification: |
  Settles that the remainder is reachable by a configuration-driven rotation that advances. Leaves
  unproven that the interval used is exactly the configured number to the second, a driven-clock render
  reading before and after a boundary rather than a stopwatch.
verification-method: test
