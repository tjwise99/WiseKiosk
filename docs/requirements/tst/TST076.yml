text: |
  Pending: test asserting a depth-1 listing of the repository root contains no package.json,
  package-lock.json, go.mod, go.sum, pyproject.toml, requirements*.txt, or .venv/; and that every
  Dependabot updates[] entry whose ecosystem is not github-actions resolves to a non-root directory
  holding the matching manifest. The script is the Doorstop references target; ADR 0002 bars a
  reference to .github/, not a check that reads it. Owned by #68.
