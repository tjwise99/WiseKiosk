text: |
  Unit test of fetchPark's own assembly of a park's payload against a schedule call staged to fail two
  ways - the call itself answering with a failing status, and the call answering 200 with a body
  shapeHours cannot read - that in both cases the park answers available, carries its rides, and
  carries no hours, rather than the schedule's own failure taking the park down.
verification-justification: |
  Settles that a schedule call's own failure, however it fails, costs a park only its hours: the park
  stays available and its rides are carried unchanged from what its live call answered.
  What it cannot settle is a schedule call that answers part of a schedule correctly and fails the
  rest, which no capture holds, nor how a park's absent hours are drawn on a rendered page, which is a
  different item's.
verification-method: test
