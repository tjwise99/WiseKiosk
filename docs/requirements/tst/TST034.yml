text: |
  Pending: test parsing the boundary schema and asserting exactly one schema artifact is tracked;
  that the set of schema path items equals the set of
  entries in the static route registration list, in both directions; that every path item declares
  its success status, the SRS001 upstream-failure status, and 400, 404, 405 and 429, each
  referencing a named component rather than an inline body; that the upstream-failure body and the
  SRS013 rejection body both exist as named components and are distinct schemas; and that every path
  and query parameter is declared with a type. Lands with the codegen mechanism (#7).
verification-justification: |
  Settles that one schema artifact exists and that its path items match the declared endpoint set.
  Leaves unproven that the schema describes the payloads the backend actually sends - that is the
  drift gate's, under SRS016 - and says nothing about where the artifact sits, which #5 allocates.
verification-method: test
