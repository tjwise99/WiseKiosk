text: |
  Pending: test asserting route-registration call sites appear in exactly one file and that file
  declares the registry as a package-level composite literal appearing in no append, index
  assignment, or map insertion - a registry is exactly a list something writes to at run time, so
  its absence is structural rather than a denylist of registry-shaped names; asserting the plugin
  package is absent from the backend's dependency set; and asserting one entry per upstream-backed
  module, each carrying a non-nil validator and non-zero values for every policy the entry owns.
  Constructing the router and comparing its registered route set to the entry set closes the
  discovery case in both directions. Lands with the backend skeleton (#9).
verification-method: test
