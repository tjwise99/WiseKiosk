text: |
  Pending: inspection of .github/dependabot.yml asserting a gomod ecosystem entry and an npm
  ecosystem entry, each grouped and each targeting the directory its manifest lives in (per
  FOUNDATIONS §2). Inspection only - it proves the configuration shape, not that update proposals
  are produced. Fails if either ecosystem is absent or ungrouped. Lands when go.mod and package.json
  exist; activated with a references entry then. Owned by #67.
