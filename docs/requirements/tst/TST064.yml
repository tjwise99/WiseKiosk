status: proposed
text: |
  Unit test running the module's shaping over a captured response carrying more hours and more days
  than the payload is to hold, with no network, asserting the payload it produces carries as many
  hours next to come and as many days next to come as the requirement states, against those figures
  written into the test rather than read from the module's own constants.
verification-justification: |
  Settles that the shaping produces ranges of the stated lengths from a response with more to give.
  Leaves unproven that the hours and days produced are the right ones or in the right order, which a
  length does not read, and bounds coverage by the captures the suite holds. It settles nothing about
  a response carrying fewer than the figure: what the payload should be then is not an obligation any
  item states.
verification-method: test
