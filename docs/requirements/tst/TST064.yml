header: |
  The weather payload's outlooks are as long as the requirement states
level: 86
links:
- SRS044: 6vTvZZWMJ0t-OlCL16ROHJyhva3fsUmBd4Fyr1BTgn0=
normative: true
rationale: |
  The captured response carries more of each range than the payload is to hold, because a shaping that
  truncates silently and one that passes the source's own length straight through are told apart only
  by a response longer than the figure.
  The expected lengths are written into the test rather than read from the module's own constants. A
  check reading the constant asserts that the module agrees with itself, which is equally true of a
  module that shows one hour, and is the assertion this item exists to replace.
  Nothing else enforces the figure. Stating a maximum in the boundary schema emits no check on either
  side of it - one JSDoc line and nothing generated that reads it - so a length declared there would
  read as a constraint while enforcing nothing, and this item is the only thing standing between the
  figure the requirement states and a payload silently shorter than it.
