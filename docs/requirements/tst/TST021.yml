text: |
  Pending: test asserting the composed configuration schema's key set equals a committed allowlist, in
  both directions, so a key added to the schema without an allowlist entry fails. Lands with the config
  schema (#8); activated then.
verification-justification: |
  Asserts key-set equality against the committed allowlist. Does not decide whether a listed key is
  secret-bearing.
