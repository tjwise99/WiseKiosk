rationale: |
  Stated as a test rather than an inspection because set equality against a committed artifact is
  mechanically decidable, which is the method the obligation can bear. An earlier form deferred the
  form to "repo check or review checklist" when the schema lands; a review checklist was never
  available to it, since ADR 0011 routes an author obligation leaving no artifact out of the tree, so
  no TST item can resolve to one.
