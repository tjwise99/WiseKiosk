header: |
  Pending: the date appears and disappears with its selection
level: 76
links:
- SRS039: Xl4_nRXXPooo828zXPF6hRfKuYoOinRuqFPvaxW6QP8=
normative: true
rationale: |
  Omission is the half a check is fooled on. A module always drawing the date passes any assertion that
  reads only the selection that asks for it, so both selections are driven and the absent case is
  asserted as an absence in the clock's own region rather than anywhere on the page.
  The date read is checked against the host's rather than merely being present, because a placeholder
  or a build-time constant is present too.
ref: ''
reviewed: 0Loih1mH16qPZESOgeo2x_JJYXMcGMhDmpSMze2yrKg=
status: proposed
text: |
  Pending: render test loading the page under each of the two date selections against a controlled host
  clock, asserting that the selection asking for the date yields the host's current date beside the
  time and that the selection not asking for it yields no date in the clock's region. Lands with the
  first vertical slice (#12); activated and given a references entry then.
verification-justification: |
  Settles that the date's presence follows the selection in both directions, and that what is shown
  when it is present is the host's date rather than a fixed string.
  Leaves unproven that the host's date is the true date, the host being outside this system, and says
  nothing about how the date is written or where in the region it sits.
verification-method: test
