status: proposed
text: |
  Render test loading the page under each of the two date selections against a held host clock,
  asserting that the selection asking for the date yields the host's current date beside the time, and
  that the selection not asking for it leaves the clock's region carrying a time and no date.
verification-justification: |
  Settles that the date's presence follows the selection in both directions, and that what is shown
  when it is present is the host's date rather than a fixed string.
  Leaves unproven that the host's date is the true date, the host being outside this system, and says
  nothing about how the date is written or where in the region it sits.
verification-method: test
