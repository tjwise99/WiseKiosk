normative: true
rationale: |
  Omission is the half a check is fooled on. A module always drawing the date passes any assertion that
  reads only the selection that asks for it, so both selections are driven and the absent case is
  asserted as an absence in the clock's own region rather than anywhere on the page.
  The date read is checked against the host's, and across a move of the host clock to a second date
  rather than at one instant, because a placeholder or a build-time constant transcribed from that one
  instant is present too and passes a single read; moving the clock catches it and exercises the
  date's rollover in the one place that reads it.
