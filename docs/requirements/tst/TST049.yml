text: |
  Read each laid-out region's geometry against the viewport, asserting no region enters the band
  the configuration declares, on any edge, over configurations chosen to load the display rather
  than a single fixture.
verification-justification: |
  Settles that the layout keeps clear of the band it was told about, which is a band the software
  cannot observe being masked. Leaves unproven that the declared depth clears the mask actually
  fitted: the frame, the television and the depth are all the operator's, and no assertion over a
  rendered page reaches a bezel. It reads regions rather than content deliberately - content
  overflows its region by design, so a content-level assertion would fail on a display behaving
  exactly as obliged.
verification-method: test
