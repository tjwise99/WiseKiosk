text: |
  Pending: render test loading the page under each of the two hour selections at a host time in the
  afternoon, asserting that the hour presented is the one that selection calls for and that the two
  renderings differ. Lands with the first vertical slice (#12); activated and given a references entry
  then.
verification-justification: |
  Settles that the presented hour follows the selection under both values, which fails a module that
  hardcodes either form or that ignores the key.
  Leaves unproven everything about how the form is written - separator, zero-padding, and how a
  meridiem indicator reads - which the item does not oblige and no check judges.
verification-method: test
