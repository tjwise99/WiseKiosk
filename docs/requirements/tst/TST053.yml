rationale: |
  Both selections are driven rather than one, because a module ignoring the configuration and hardcoding
  either form passes a check that reads only the other. The two renderings are also compared against
  each other at an hour that tells them apart - an afternoon hour, since morning hours read alike in
  both forms - so a module that varies the label without varying the hour is caught.
