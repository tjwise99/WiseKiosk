text: |
  Pending: check that builds an image from a materialised fixture manifest carrying a seeded known
  vulnerability (ADR 0010), runs the same image-scan invocation the production job runs, and asserts
  a non-zero exit; asserts the clean image exits zero, and that a finding carrying a current
  register entry (SRS098) does not fail (expected: trivy or grype). Lands when the image builds in
  CI; activated with a references entry to the fixture and the meta-gate then. Owned by #67.
