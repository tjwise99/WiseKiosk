text: |
  Render test handing the component two payloads differing only in whether the present weather is a
  day's or a night's, asserting the mark drawn for it follows the payload under each; and a payload
  whose hours next to come fall from day into night beneath a present reading that is a day's,
  asserting the mark drawn for each hour follows that hour's own side of the day rather than the
  present reading's or one answer taken for the page.
verification-justification: |
  Settles that what is drawn follows the distinction the payload carries rather than the page's clock.
  Leaves unproven that a viewer reads the marks as day and night, which is a judgement about a real
  display in a real room and not something a rendered page settles, and that the distinction the
  payload carries is true of the sky at that place, the source being outside this system. It is
  bounded by the payloads the suite supplies.
verification-method: test
