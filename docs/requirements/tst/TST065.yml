header: |
  The weather region draws day and night apart
level: 87
links:
- SRS050: xZ72QJb4nfMLTO2dub1U-6XUImUaODQLoyKfoMpQdT8=
normative: true
rationale: |
  The two payloads differ only in the distinction, so whatever moves in the rendered output is the
  distinction's. A test reading one payload passes a component that draws the same mark whatever it is
  handed, which is the failure the item names.
  The hours next to come are read under a present reading on the other side of the day from the last
  of them. A component working the distinction out for itself has one answer for the page it draws,
  and one answer cannot be both, so a payload that splits across its hours is what tells that
  component from one following what it was handed. The configured place need not be in the same part
  of the world as the display either, which is why the derivation would be wrong even where a page
  has one answer to give.
