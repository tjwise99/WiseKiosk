text: |
  Test asserting an upstream failure is cached for a negative TTL shorter than the source's success
  TTL: a second request within that window issues no upstream call, and after it expires the next
  request retries upstream.
verification-justification: |
  Settles that a failure is cached for a shorter window than a success and that the retry follows
  expiry. Leaves unproven the negative TTL's value against how long real upstreams stay down.
verification-method: test
