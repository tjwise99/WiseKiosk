rationale: |
  Both fixtures run the one validation entry point, because the branch this asserts is a property of
  that path rather than of two separately reachable behaviours. Splitting them across two checks
  would let each pass against a different code path and leave the branch itself untested - which is
  what the
  SRS002<!-- A module-scoped configuration error is reported at that module -->/SRS004<!-- Page renders a legible error state for every configuration failure class -->
  pair did before.
ref: ''
reviewed: 9cHUKsmEdoWvzqKxp2KVHr6A93hldrzB-xs1KosQa-I=
status: proposed
text: |
  Pending: render test driving two fixtures through the same validation path and asserting opposite
  outcomes. A configuration whose only error is inside one module's section of the schema: the page renders, that
  module carries the error state in its own place, it names what is wrong and what to change, and no
  sibling module is affected, including one sharing its region. A configuration whose top level is malformed: no module renders and the page
  carries the page-wide state instead. The two fixtures differ only in where the error sits, so the
  isolable/non-isolable branch is decided rather than assumed. Lands with the frontend skeleton (#10);
  activated and given a references entry then.
verification-justification: |
  Settles the isolable/non-isolable branch, because both fixtures run one validation path and differ
  only in where the error sits. Leaves unproven that the correction named is good advice; that one
  is named is decidable, that it helps is not.
verification-method: test
