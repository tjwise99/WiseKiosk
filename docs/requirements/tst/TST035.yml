text: |
  Pending: viewport-driven render test asserting a bijection between the modules the fixture
  configuration names and the regions present in the DOM, each module's rendered box lying within the
  bounds of the region the configuration assigns it, with the module set read from the parsed fixture
  rather than a hand-written list; and asserting the document does not scroll horizontally at the
  kiosk viewport (1920x1080) or at the desktop viewports (1280x800 and 1440x900). Lands with the
  frontend skeleton (#10); activated and given a references entry then.
verification-justification: |
  Settles that every configured module is present, rendered inside the region it was assigned, with
  no horizontal scroll at three viewports. Leaves unproven what the configuration composes: two
  assigned regions may overlap, and a page rendering the overlap faithfully passes every assertion
  here. Leaves legibility across a room unproven too, which no geometric assertion reaches - it is
  obliged and checked separately rather than here.
verification-method: test
