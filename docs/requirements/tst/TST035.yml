text: |
  Pending: viewport-driven render test asserting a bijection between the modules the fixture
  configuration names and the regions present in the DOM, each rendered into the region the
  configuration assigns it, with the module set read from the parsed fixture rather than a hand-written
  list; and asserting the assembled layout exhibits no overlap, no clipping, and no scrollbars at the
  kiosk viewport (1920x1080), and reflows with no overlap, no clipping, and no horizontal scroll at the
  desktop viewports (1280x800 and 1440x900). Lands with the frontend skeleton (#10); activated and
  given a references entry then.
verification-justification: |
  Settles that every configured module is present, in its assigned region, with no overlap or
  clipping at three viewports. Leaves legibility across a room unproven, which no geometric assertion
  reaches - it is obliged and checked separately rather than here.
verification-method: test
