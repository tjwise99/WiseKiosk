status: accepted
text: |
  Wherever the display carries no content it shall be held at minimum emission, and the page shall
  lay out no region within a contiguous part of the surface large enough and placed to return the
  reflection of a viewer at the distance the display is installed for.
verification-justification: |
  Settled by its children: the rendered ground of every element the page draws, and the laid-out
  regions read against the area the reserve occupies. Three things neither reaches. The value the
  page renders is not the light the panel emits - backlight, gamma, colour profile and the
  half-silvered surface all lie between them. What a viewer sees in the reserve is the reflected
  room, which the software neither supplies nor controls. And content overflowing a neighbouring
  region may cross into the reserve, which the overflow ruling permits and no check here contradicts:
  what is obliged is that the page places no region there, not that the reserve stays empty of every
  pixel under every configuration.
verification-method: test
