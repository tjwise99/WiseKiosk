header: |
  The surface carrying no content is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface a pixel at minimum emission is a mirror, so the part of the display
  carrying nothing is the product rather than spare capacity. A display filling its surface with
  content is a different product on the same hardware, and nothing else in the tree would notice.
  That is why this is a need rather than a decomposition of the layout need: the two are satisfiable
  independently in both directions. The layout need is a want about content; this is a want about
  content's absence.
  The clause is existential because the want is that the reserve is there. How the page delivers it -
  by laying out no region across it - is the tree's to record below, not this item's.
  Two rejected positions. The reserve was obliged as an emergent measurement, the largest contiguous
  minimum-emission region spanning a fraction of the display and centred on it, which does not
  measure the want: on a display covered but for its mandated edge inset the free surface is a thin
  band whose bounding box is the whole display, so it scores full marks while returning no reflection
  at all. And the reserve was briefly declined altogether, on the ground that guaranteeing it needed
  a configuration key and a failure behaviour for content assigned into it. It needs neither: a
  configuration names a region per module and cannot express a geometry (owner, 2026-08-08), so no
  position an operator can write addresses the reserve.
