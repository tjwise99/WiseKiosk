text: |
  Wherever the display carries no content it shall be held at minimum emission.
verification-justification: |
  Settled by its child: the value rendered over the surface content does not occupy. Three things it
  does not reach. The value the page renders is not the light the panel emits - backlight, gamma,
  colour profile and the half-silvered surface all lie between them. What a viewer sees there is the
  reflected room, which the software neither supplies nor controls. And whether enough surface is
  left to return a reflection at all follows from the configuration rather than from the software.
verification-method: test
