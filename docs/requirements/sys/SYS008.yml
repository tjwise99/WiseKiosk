status: accepted
text: |
  Wherever the display carries no content it shall emit negligibly; and the display shall present a
  contiguous part of its surface that carries no content, large enough and placed to return the
  reflection of a viewer at the distance the display is installed for.
verification-justification: |
  Its children read a rendered page: every emitting surface of every element the page draws, and the
  laid-out regions read against the area the reserve occupies. Five things neither reaches. Whether
  that area is large enough and placed to return a viewer's reflection at the installed distance is
  settled by nothing here - the figures are the check's, so it supplies the area it then proves
  nothing was laid into, and a reserve written as a corner of a few pixels would pass while
  discharging the want not at all. Nothing bounds how much of the surface sits at the ceiling below
  which a non-content surface may emit, so a tint covering the whole display satisfies the emission
  clause while returning no mirror. The value the page renders is not the light the panel emits -
  backlight, gamma, colour profile and the half-silvered surface all lie between them. What a viewer
  sees in the reserve is the reflected room, which the software neither supplies nor controls. And
  content overflowing a neighbouring region may cross into the reserve, which the overflow ruling
  permits and no check here contradicts: what is obliged is that the page places no region there, not
  that the reserve stays empty of every pixel under every configuration.
verification-method: test
