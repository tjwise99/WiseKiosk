header: |
  The surface carrying no content is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface a pixel at minimum emission is a mirror, so the part of the display
  carrying nothing is the product rather than spare capacity. A display filling its surface with
  content is a different product on the same hardware, and nothing else in the tree would notice.
  That is why this is a need rather than a decomposition of the layout need: the two are satisfiable
  independently in both directions.
  Nothing here obliges a reserve. The mirror is what content leaves, and how much surface that is
  follows from the configuration: a deployment that fills the display has chosen to, and the result
  is the operator's (owner, 2026-08-09).
  Two ways of obliging one were tried, and the difference between them matters to anyone who wants
  the guarantee back. Measuring the largest contiguous unlit region does not measure the want - on a
  display covered but for its edge band, the free surface is a thin band whose bounding box is the
  whole display, so it scores full marks while returning no reflection. Obliging the page to lay out
  no region across a reserved area does work: content reaches the display only inside a region and an
  operator can name a region but never a geometry, so an area carrying no region is unreachable. Its
  one leak is overflow from a neighbour. It was withdrawn because the guarantee is not wanted, not
  because it failed.
  The clause reads "negligibly" rather than "at minimum emission", which would forbid a hairline rule
  and a dark grouping tint along with the panels and scrims it was aimed at. Calibrated against its
  child's ceiling, "negligibly" forbids only a mark rendered above it -
  SRS030<!-- Only content is rendered above the emission ceiling --> already permits a grouping stroke
  or fill that stays below, and forbidding it here too would decide a design question the need has no
  business deciding. Nothing obliges one: the surface stays bare by default (owner, 2026-08-16).
