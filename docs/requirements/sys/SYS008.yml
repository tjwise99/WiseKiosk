header: |
  The surface carrying no content is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface a pixel at minimum emission is a mirror, so the part of the display
  carrying nothing is the product rather than spare capacity. A display filling its surface with
  content is a different product on the same hardware, and nothing else in the tree would notice.
  That is why this is a need rather than a decomposition of the layout need: the two are satisfiable
  independently in both directions. The layout need is a want about content; this is a want about
  content's absence.
  How much surface carries nothing, and where it sits, is the configuration's: the operator assigns
  every region (owner, 2026-08-08). So extent and placement are not obliged here. An earlier text
  obliged a contiguous part of the surface to be large and well-placed enough to return a viewer's
  reflection, which is a promise about an arrangement the product does not choose. What the software
  owes is the one thing it does choose - to add no light where it presents nothing - and that is the
  whole of the want, which is why one decomposition discharges it.
  Making the mirror a guarantee instead was considered and declined (owner, 2026-08-08). It would
  take a configuration key naming the reserve, and a rule for content assigned into it - and that
  rule contradicts the ruling that a configuration too dense to lay out renders no failure state. So
  a deployment may fill its display and lose the mirror, with nothing failing, and the degraded
  display is the signal as it is everywhere else the operator's arrangement decides the outcome.
