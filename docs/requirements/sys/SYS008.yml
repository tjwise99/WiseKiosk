status: accepted
text: |
  The display shall leave a contiguous part of its surface unlit, large enough that a viewer at the
  distance it is installed for sees their own reflection in it.
verification-justification: |
  Settled by its children: that surface carrying no content is held at minimum emission, and that no
  configuration reduces the largest contiguous region so held below the span a reflection needs. What no check reaches is whether the region is
  aimed at anybody - a reserve of the right size, mounted at the wrong height, returns a reflection of
  the ceiling. Mounting is the operator's, so the residue is outside the boundary rather than unproven
  inside it.
verification-method: test
