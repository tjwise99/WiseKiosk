header: |
  The unlit surface is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface an unlit pixel is a mirror, so the part of the display carrying
  nothing is not spare capacity - it is the product. A display that fills its surface with content is
  a different product wearing the same hardware, and nothing else in the tree would notice: every
  module could render wholly, legibly and within its region while the mirror was gone.
  This is why the want is a need of its own rather than a decomposition of the layout need. Those two
  are satisfiable together and independently, and the layout need's own rationale scopes it to
  no-overlap, no-clipping and no-scrollbars - a want about content, where this is a want about
  content's absence.
  The obligation is stated over the surface the software controls rather than over the glass, which
  WiseKiosk does not supply. What the mounting, the room and the viewer's height make of that surface
  is the operator's, in the same way the kiosk host is (#132 layout need decomposition).
ref: ''
