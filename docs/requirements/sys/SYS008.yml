header: |
  The surface carrying no content is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface a pixel at minimum emission is a mirror, so the part of the display
  carrying nothing is the product rather than spare capacity. A display filling its surface with
  content is a different product on the same hardware, and nothing else in the tree would notice.
  That is why this is a need rather than a decomposition of the layout need: the two are satisfiable
  independently in both directions. The layout need is a want about content; this is a want about
  content's absence.
  The reserve is the page's because the region set is. A configuration names a region per module and
  cannot express a geometry (owner, 2026-08-08), so the page reserves the mirror by laying out no
  region there: no position an operator can write addresses it. That is a property of what the page
  draws, decidable from a rendered page, and it needs no configuration key and no rule for content
  assigned into the reserve, because nothing can be assigned into it.
  An earlier revision of this item obliged the reserve as an emergent measurement - the largest
  contiguous minimum-emission region spanning some fraction of the display - and that is withdrawn
  rather than restated. The metric does not measure the want: on a display whose content covers all
  but the mandated edge inset, the free surface is a thin band whose bounding box is the whole
  display, so it scores full marks while returning no reflection at all. What replaces it obliges the
  layout rather than the leftovers.
  A second retraction, recorded because it was written here as settled. This item briefly declined
  the reserve altogether, on the ground that guaranteeing it would need a configuration key and a
  failure behaviour for content assigned into it. That rested on the operator placing content by
  geometry, which the configuration does not let them do. The cost was never there.
