text: |
  Wherever the display carries no content it shall emit negligibly.
verification-justification: |
  Settled by its child, which reads every emitting surface of every element the page draws against
  the ceiling anything that is not content must sit below. Three things it does not reach. The value
  the page renders is not the light the panel emits - backlight, gamma, colour profile and the
  half-silvered surface all lie between them. What a viewer sees in the unlit surface is the
  reflected room, which the software neither supplies nor controls. And nothing bounds how much
  surface is left unlit, so a configuration dense enough to fill the display satisfies this item and
  returns no reflection - the operator's choice rather than a gap in the check.
verification-method: test
