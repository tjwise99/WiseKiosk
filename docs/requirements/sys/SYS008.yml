header: |
  The surface carrying no content is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface a pixel at minimum emission is a mirror, so the part of the display
  carrying nothing is the product rather than spare capacity. A display filling its surface with
  content is a different product on the same hardware, and nothing else in the tree would notice.
  That is why this is a need rather than a decomposition of the layout need: the two are satisfiable
  independently in both directions. The layout need is a want about content; this is a want about
  content's absence.
  It carries no configuration bound, because how much a deployment carries is the operator's (owner,
  2026-08-08), and a deployment that takes the mirror takes it visibly.
ref: ''
reviewed: AIuMYg7wHcfKr7RHldDawSRFk9RFv2Bb_t_vqiXoTfE=
status: accepted
text: |
  Wherever the display carries no content it shall be held at minimum emission, and a contiguous part
  of what is so held shall be placed and large enough to return the reflection of a viewer at the
  distance the display is installed for.
verification-justification: |
  Settled by its children: that surface carrying no content is held at minimum emission, that the
  largest contiguous region so held spans what a reflection needs in both dimensions, and that the
  same region sits where a viewer facing the display is returned rather than banked against an edge. What no check reaches is the
  height the panel is hung at - a reserve of the right size, in the right place on the surface, still
  returns a reflection of the ceiling if the panel is mounted too high. Mounting is the operator's;
  where the region sits on the surface is not, and is obliged.
verification-method: test
