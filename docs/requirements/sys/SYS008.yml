header: |
  The surface carrying no content is a mirror
level: 13
links: []
normative: true
rationale: |
  Behind a half-silvered surface a pixel at minimum emission is a mirror - unlit, in the only sense
  that matters here - so the part of the display carrying nothing is not spare capacity, it is the
  product. A display that fills its surface with content is a different product wearing the same
  hardware, and nothing else in the tree would notice: every module could render wholly, legibly and
  within its region while the mirror was gone.
  This is why the want is a need of its own rather than a decomposition of the layout need. The two
  are satisfiable together and independently in both directions - a display can fill every pixel and
  still lay out perfectly, or reserve half its surface and clip a module - which is the test that
  decides a need from a decomposition. The layout need is a want about content; this is a want about
  content's absence.
  The obligation is stated over the surface the software controls rather than over the glass, which
  WiseKiosk does not supply. What the mounting, the room and the viewer's height make of that surface
  is the operator's, in the same way the kiosk host is (#132 layout need decomposition).
