header: |
  Single-definition boundary contract
level: 1.23
links: []
normative: true
rationale: |
  Go and the TypeScript frontend share no types (ADR 0001), so a value that must
  agree on both sides with no shared definition and nothing enforcing agreement
  fails silently and is untestable by construction — the single worst defect
  class this design guards against. Enforcement is folded into the need
  deliberately: a single definition that can silently stale is not single. This
  is the sibling axiom to SYS014, which the configuration schema follows.
ref: ''
reviewed: Atk7HXMyRvSN_SCxSwc2M0538nq16WUIr4lz3AUFY-U=
status: accepted
text: |
  Every value that crosses the frontend/backend boundary — request parameter
  names, success response payloads, the structured upstream-failure and
  client-error rejection bodies, and the response status codes the frontend
  discriminates on — shall be defined by exactly one machine-readable schema,
  from which the Go backend and the TypeScript frontend representations are both
  generated. No boundary value shall be declared a second time on either side,
  and agreement between the two sides shall be enforced mechanically rather than
  by review or convention.
verification-method: inspection
