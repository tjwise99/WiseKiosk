header: |
  Delivered configuration is secret-free because no secret-bearing key exists
level: 1.45
links: []
normative: true
rationale: |
  Split from SYS017, which welded this to the response-and-log obligation. The two are verified
  differently and cannot honestly share a method: whether a schema key's value is a secret is a
  semantic judgement about what the value means, which no parser decides, while a secret in a
  response body is a canary a test finds. Averaging them dragged a mechanically-decidable obligation
  down to a human read; keeping them welded at `test` claimed a machine settles the judgement.

  The obligation is deliberately about the schema, not about delivery. If no offered key can hold a
  secret, delivery has nothing to strip, and the redaction step this need exists to forbid never
  becomes tempting.
