status: accepted
text: |
  The configuration the system delivers to a client shall contain no secret. This shall hold because
  the configuration schema offers no key whose value is a secret, so delivery has nothing to remove —
  never by a stripping or redaction step applied before delivery.
verification-justification: |
  Deciding that a configuration key's value is a secret is a semantic judgement about what the key
  means, not a property of the schema's structure. The only mechanical form is a name-pattern match
  over key names, which fails open the first time a secret-bearing key is named something the pattern
  does not anticipate — the denylist this project rejects on principle. The schema's key set is small
  and enumerated, so a reader decides it exhaustively.
verification-method: inspection
