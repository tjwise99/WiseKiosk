header: |
  One image serves every deployment, independently configured
level: 1.7
links: []
normative: true
rationale: |
  One published image serving many independent deployments, each customised by its own
  configuration, is the entire reason this repository exists. Per-deployment forks or rebuilds would
  fragment it.

  The fork prohibition is recorded here rather than as an obligation. Whether someone clones this
  repository and patches it for their own house is a fact about what exists outside it, which no
  check run inside it can falsify; stated as a shall it read as enforced and was not. What is
  enforceable is the positive form above - one image, configuration-only customisation, instance
  independence - which SRS044, SRS045 and SRS046 verify.
ref: ''
