header: |
  Neither grant privilege nor require it
level: 8
links: []
normative: true
rationale: |
  Trust rests at the network boundary. Accounts, sessions and authentication are all machinery for
  distinguishing privilege between callers, and a display on a household LAN has no caller to
  distinguish — so the machinery would add attack surface and operator burden to solve a problem the
  deployment does not have. Requiring none is the same want facing the host: a process holding no more
  than it needs bounds what a compromise reaches. This is a recorded decision, not an oversight: the
  absence of authentication must not be "fixed" by a later reader who mistakes it for one.
ref: ''
reviewed: null
status: accepted
text: |
  The system shall neither grant privilege nor require it.
verification-justification: |
  Absence is asserted directly — no credential material on the wire, no identity-based rejection, no
  authentication middleware on the request path, a container whose user is not root, a page served
  with the device capabilities it does not use denied, and served responses that declare their type
  so that no content is inferred into script it was never granted. What no check settles is whether
  the network boundary is in fact trustworthy; that is a property of the household's network, outside
  the system.
verification-method: test
