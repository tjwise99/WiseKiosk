header: |
  Single-definition internal contract
level: 7
links: []
normative: true
rationale: |
  A shape declared twice drifts, and the drift is invisible until runtime: this is the single worst
  defect class this design guards against (ADR 0001). The rule binds definitions, not uses — a component
  whose prop is typed with a generated type is a consumer, not a second declaration. Scope is internal:
  upstream API shapes are defined by whoever runs the API, and the configuration format is shared with
  the operator and governed by SYS001. Secret confinement lands here because the contract is a closed
  set: a secret can only cross if the definition declares one, which is a structural claim rather than
  an unprovable negative about outputs.
