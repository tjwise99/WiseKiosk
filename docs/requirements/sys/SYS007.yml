header: |
  The declared minimum host, and staying within it
level: 12
links: []
normative: true
rationale: |
  Created when the one-published-image need dissolved: its publishing obligations left the tree for
  docs/CI.md, but two
  children were obligations on the running system and would have gone with it — the platform the
  backend runs on, and the browser host driving the display. The hosts themselves lie outside the
  system, which README.md states; what is inside is WiseKiosk's obligation to fit them. Framed as
  "declares as its minimum" rather than a resource bound because the two children constrain different
  things: one a platform, one a capability floor, and an amd64 host is not less capable than an arm64
  one. The floor itself is README.md's deployment model, cited rather than restated here.

  The second clause is the same want over time rather than a second one. On a host chosen as a
  minimum, unbounded growth is exactly what makes the minimum claim false: a leak invisible on the
  first day exhausts a Zero-class host on the fortieth, and it does so because the host is small. A
  deployment that runs on the declared hardware for an hour has not met this need. The clause was
  added when the bounded-growth child was found to decompose from no clause of the text, while this
  item's own verification-justification already discharged it — the text was the part that had not
  caught up.
ref: ''
status: proposed
text: |
  WiseKiosk shall run on the hosts it declares as its minimum, and shall go on running there without
  degrading.
verification-justification: |
  Each child is discharged mechanically — a multi-arch build and smoke test, a demonstration on the
  declared browser host, a bounded-growth observation. What none of them settles is whether the
  declared minimum is the right one: that is a product decision recorded in README.md, and no check
  decides whether a cheaper host should have been targeted. Nor does any of them run for the duration
  the second clause is really about; bounded growth is observed over a sampling window and read as
  evidence about the months that follow.
verification-method: test
