status: accepted
text: |
  The system shall not contain an abstraction or extension point that has a single implementation
  and no second consumer, so generality is not introduced ahead of a demonstrated second use.
verification-justification: |
  Whether a construct is an abstraction, and whether a second consumer is genuine rather than
  nominal, is a judgement about intent and about cases that do not yet exist; the space of shapes
  counting as generality is unbounded. The decidable slice is asserted by SRS086.
verification-method: inspection
