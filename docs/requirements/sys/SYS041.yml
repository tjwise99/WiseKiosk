header: |
  No abstraction is built without a second consumer
level: 1.41
links: []
normative: true
rationale: |
  Two forbidden patterns generalized: "abstraction without a second consumer," and "if something
  exists to support a case that does not exist yet, it should not exist yet." SYS024 already forbids
  this in the module-adding path (no plugin system); this generalizes it system-wide. The sibling
  anti-patterns are already captured concretely — transport-before-access by SRS043 (frontend polls;
  no server-push), and production-architecture-serving-a-test by SRS039 (the clock renders
  client-side) — so this is the one uncaptured case. Decided by judgment at review; inspection is the
  honest method (no test artifact).
ref: ''
