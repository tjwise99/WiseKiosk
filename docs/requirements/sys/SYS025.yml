header: |
  Frontend is a static single-page application
level: 1.25
links: []
normative: true
rationale: |
  FOUNDATIONS §2 records "no SSR, no routing, no meta-framework" and "Svelte 5 +
  Vite, a static SPA" as settled decisions. This item promotes that decision to a
  system-level axiom on the same precedent that lifted the other settled decisions
  into SYS items (secrets-by-construction → SYS017, single-origin data plane →
  SYS022, single-definition boundary → SYS023): a constraint the whole frontend
  must satisfy, and from which the frontend-structure requirements decompose,
  earns a parentless SYS rather than living only as prose. The product renders a
  fixed module set into one full-screen page and never navigates, so server-side
  rendering, a router, and a meta-framework are machinery with no case to serve.
  The premise that would reopen it is a genuine multi-page or SEO requirement,
  which FOUNDATIONS §2 states will not arise.
