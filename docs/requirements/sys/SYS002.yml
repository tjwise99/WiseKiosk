status: accepted
text: |
  Every configured module shall render on the display it was configured for, laid out within the
  surface that display actually presents and with none of its content hidden by the page's own
  layout; and text the display presents to be read shall be legible from where that display is
  watched.
verification-justification: |
  Its children read a rendered page: the laid-out regions against each other and against an inset the
  viewport cannot see being masked, each module's content against the region it was given, text size
  as a fraction of the display's height, and emission per element. Four things none of them settles,
  and the item claims none of them. What a viewer actually sees behind any glyph is the reflected
  room, which the software neither supplies nor controls. Content overflowing a region near the edge
  crosses the inset SRS034<!-- The laid-out regions keep clear of the display edge --> states, and
  may extend the document past the viewport, putting content behind a scroll a kiosk has no way to
  perform - hiding, in this item's own sense, and permitted in both directions because the
  alternative is discarding the content instead. The size floor is read at sampled resolutions rather
  than at every one the display supports. And whether the configuration leaves a display worth
  looking at, and whether the result is a good layout rather than a legible one, are the operator's
  and a judgement no gate claims.
verification-method: test
