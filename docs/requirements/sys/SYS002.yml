header: |
  Each module renders in full, and reads
level: 2
links: []
normative: true
rationale: |
  The product is a display; a module the page has hidden part of has failed silently, and so has one
  too small or too dim to read from where the display hangs. The scope is what the software renders
  rather than what the configuration composes: the operator assigns every region (owner,
  2026-08-08), so whether two regions overlap, and how densely the surface is filled, follow from the
  configuration. What the page decides is whether any of what it was given reaches the glass -
  content too large for its region overflows rather than being clipped, scrolled or scaled away
  (owner, 2026-08-08) - and that is what "none of its content hidden by the page's own layout"
  obliges. "The surface the display actually presents" is not the viewport, which reports
  every pixel as visible whether or not a frame or an overscanning television hides its outer band;
  holding content clear of that band is the page's, because the mask is nobody's to observe. "The
  display it was configured for" carries the kiosk-primary, desktop-secondary distinction without
  fixing viewports;
  SRS017<!-- Full-screen assembly at kiosk; reflow, no horizontal scroll, at narrower widths --> owns
  those, and "from where that display is watched" carries viewing distance the same way. Phone widths
  are deliberately not a requirement.
  The legibility clause is stated over text rather than over modules, because that is the population
  its children oblige and a narrower clause would leave part of them tracing to nothing. It reaches
  text a module did not put there - a failure message, say - which is intended: a type scale and an
  emission floor are what make any glyph readable at distance, whatever put it on the screen.
  SYS001<!-- Failure is legible and proportionate --> obliges a failure to say why and to stay in
  proportion, which is a different sense of the word and is not doubled here.
  Three earlier claims are retracted here. The text obliged every module to be "wholly visible",
  which reads as a promise about the assembled layout - no overlap among regions the product does not
  choose. It was then briefly replaced by containment, which the overflow ruling makes false: content
  too large for its region leaves that region by design. And an earlier scope disclaimed readability
  as visual judgement, which described what the tree then held rather than what a check can decide:
  text size as a fraction of display height, and the emission a glyph is rendered at, are both
  settled by a machine reading a rendered page.
