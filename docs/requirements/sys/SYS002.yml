header: |
  The display's rendering keeps nothing from a viewer
level: 2
links: []
normative: true
rationale: |
  The product is a display. Content the page has hidden part of has failed silently, and so has
  content too small or too dim to read from where the display hangs - the same failure both times,
  the rendering standing between what was configured and what a viewer receives. One obligation,
  not a visibility want and a legibility want side by side.
  It attributes cause rather than stating an outcome, which is what makes it hold against the
  overflow ruling: content exceeding its region may leave the display entirely, so an item obliging
  that nothing goes unseen would be contradicted by its own child. Overlap, clipping, scaling away,
  a region behind the bezel and type too small or too dim are all the rendering's doing; a
  configuration asking for more than the display holds is not.
  What the configuration asks for includes where it asks for it, so a module rendered whole and
  legibly in a region other than the one named for it is not what was asked. The page defines the
  display's regions and the operator names which region each module goes in and nothing more (owner,
  2026-08-08), so the region set is the page's while how much any one region is asked to hold is not.
  Phone widths are deliberately not a requirement.
  Two earlier claims someone would otherwise make again. Every module "wholly visible" is not the
  page's to promise. And readability is not beyond verification - text size as a fraction of display
  height and the emission a glyph is rendered at are both read from a rendered page, so the judgement
  obligation that appeared to have no home was not one.
