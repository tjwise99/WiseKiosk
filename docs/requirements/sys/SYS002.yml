status: accepted
text: |
  Nothing the configuration asks the display to show shall be kept from a viewer watching it by the
  display's own rendering.
verification-justification: |
  Its children read a rendered page: the laid-out regions against each other and against a band the
  viewport cannot see being masked, each module's content against the region it was given, text size
  as a fraction of the display's height, and emission per element. Four things none of them settles.
  What a viewer actually sees behind any glyph is the reflected room, which the software neither
  supplies nor controls. Whether a configuration asks for more than the display can hold is decided
  nowhere, so the checks show that the page keeps content rather than that no configuration overruns.
  The size floor is read at sampled resolutions and the layout at sampled viewports rather than at
  every one the display supports. And whether the result is a good display rather than a legible one
  is the operator's, a judgement no gate claims.
verification-method: test
