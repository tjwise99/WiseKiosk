text: |
  Every configured module shall be wholly visible and legible on the display it was
  configured for, from where that display is watched.
verification-justification: |
  Settled by its children, and all of it decidable: a rendered layout measured against the viewport it
  declares, text size read as a fraction of the display's height, emission read per element, and content
  measured against an inset the viewport cannot see being masked. Two things no child reaches. What a
  viewer actually sees behind any glyph is the reflected room, which the software neither supplies nor
  controls. And whether the result is a good layout rather than a legible one is a judgement no gate
  claims. Legibility is not on that list: its children carry it.
verification-method: test
