header: |
  Operable by a non-author operator
level: 1.2
links: []
normative: true
rationale: |
  Deployments run at the author's house and at friends' and family's houses:
  separate networks, separate configs, separate owners. The operator is
  frequently not the author, and may be non-technical. This is the most
  load-bearing premise in the product.
