header: |
  Each module renders within its region, and reads
level: 2
links: []
normative: true
rationale: |
  The product is a display; a module whose content escapes the region it was given has failed
  silently, and so has one too small or too dim to read from where the display hangs. The scope is
  what the software renders rather than what the configuration composes: the operator assigns every
  region (owner, 2026-08-08), so whether two regions overlap, and how densely the surface is filled,
  follow from the configuration. Containment is what the product does decide, and is what "wholly
  within" obliges. "The surface the display actually presents" is not the viewport, which reports
  every pixel as visible whether or not a frame or an overscanning television hides its outer band;
  holding content clear of that band is the page's, because the mask is nobody's to observe. "The
  display it was configured for" carries the kiosk-primary, desktop-secondary distinction without
  fixing viewports;
  SRS017<!-- Full-screen assembly at kiosk; reflow, no horizontal scroll, at narrower widths --> owns
  those, and "from where that display is watched" carries viewing distance the same way. Phone widths
  are deliberately not a requirement.
  Two earlier claims are retracted here. The text obliged every module to be "wholly visible", which
  reads as a promise about the assembled layout - no overlap, nothing clipped - and the product does
  not choose the arrangement that decides it. And an earlier scope disclaimed readability as visual
  judgement, which described what the tree then held rather than what a check can decide: text size
  as a fraction of display height, and the emission a glyph is rendered at, are both settled by a
  machine reading a rendered page.
