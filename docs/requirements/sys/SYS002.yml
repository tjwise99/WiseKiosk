header: |
  Each module renders in full, and reads
level: 2
links: []
normative: true
rationale: |
  The product is a display; a module the page has hidden part of has failed silently, and so has one
  too small or too dim to read from where the display hangs. Both are wants about what the software
  renders rather than what the configuration composes: the page defines the display's regions and the
  operator names which region each module goes in and nothing more (owner, 2026-08-08), so the region
  set is the page's while how much any one region is asked to hold is not. Phone widths are
  deliberately not a requirement.
  The legibility clause is stated over text rather than over modules, because that is the population
  its children oblige. It reaches text a module did not put there - a failure message, say - which is
  intended: a type scale and an emission floor make any glyph readable at distance, whatever put it
  on the screen. SYS001<!-- Failure is legible and proportionate --> obliges a failure to say why and
  to stay in proportion, a different sense of the word and not doubled here.
  Two retractions. "Wholly visible" is not something the page can promise: how much content a region
  is asked to hold follows from the configuration and from what upstream returned, and past some
  volume it does not fit. And readability was treated as beyond verification, which described what
  the tree then held rather than what a check can decide - text size as a fraction of display height
  and the emission a glyph is rendered at are both read from a rendered page. The judgement
  obligation that appeared to have no home was not one.
