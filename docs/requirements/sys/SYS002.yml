status: accepted
text: |
  Every configured module shall render wholly within the region the configuration assigns it and
  within the surface the display actually presents, on the display it was configured for, and shall
  be legible from where that display is watched.
verification-justification: |
  Settled by its children, and all of it decidable: each module's rendered box read against the
  region it was assigned, text size read as a fraction of the display's height, emission read per
  element, and content measured against an inset the viewport cannot see being masked. Three things
  no child reaches. What a viewer actually sees behind any glyph is the reflected room, which the
  software neither supplies nor controls. Whether the configuration assigns regions that overlap, or
  leaves a display worth looking at, is the operator's. And whether the result is a good layout
  rather than a legible one is a judgement no gate claims.
verification-method: test
