status: accepted
text: |
  Every check the repository carries shall run in CI, block on an outstanding finding, and be recorded
  as the kind of check it actually is. What the repository ships shall be checked for known defects, and
  its own conventions shall be among the checks.
verification-justification: |
  Execution, blocking and method honesty are all asserted against the workflow and the verification
  target. What no check settles is whether the gate set is complete — a defect class nobody has thought
  of has no check to be missing.
verification-method: test
