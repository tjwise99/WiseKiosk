status: accepted
text: |
  The display shall be capable of showing what the weather is doing at a place and what it is expected
  to do next.
verification-justification: |
  Its children are read from a rendered page whose configuration asks for weather, and from the shaping
  that feeds it: which place the weather describes, where it was taken from, how far behind the source
  it may be, how often that source is asked, what crosses the boundary and what a viewer can tell apart
  in the region. A capability is settled by exercising it, so the evidence is a display configured to
  show weather; one configured without it is outside what this claims rather than a failure of it.
  What none of them can reach is whether the weather shown is the weather outside. The source is another
  party's system and lies outside this one, so a check can establish that what is shown is what the
  source reported and how far behind it the display may fall, never that the source is right about the
  sky. A display faithfully showing a wrong forecast is this need met, and the same limit is already
  carried the other way where a host's own clock is outside what the tree can be failed against
  (SYS009<!-- A viewer can know the current time and date without looking elsewhere -->).
verification-method: test
