header: |
  The gate regime
level: 10
links: []
normative: true
rationale: |
  A check that no target runs, that cannot fail the merge it is meant to gate, or that claims a method
  its implementation does not support is a false signal — worse than no check, because it is counted.
  "Outstanding" leaves disposition to the individual requirement rather than stating an exception policy
  here: a finding dispositioned in a recorded, expiring register is not outstanding, while first-party
  findings offer no disposition path at all. The second sentence exists because the first is a
  conditional: without it, deleting every defect gate would violate nothing.
ref: ''
