rationale: |
  Prevents duplicated prose from drifting apart silently. Live example: CLAUDE.md's non-negotiables
  currently restate facts also stated formally in SYS012/SRS003/SRS004 and in ARCHITECTURE/FOUNDATIONS
  §4 — defensible only because CLAUDE.md declares itself process-layer, but a live instance of the
  taxonomy being bent. "No fact duplicated across two canonical docs" is not mechanically decidable in
  general — this is a stated review discipline, not a gate.
