text: |
  Every fact about WiseKiosk's product definition, settled decisions, architecture, test strategy, or
  normative obligations shall be authored in exactly one canonical document per the documentation
  taxonomy — product/operator truth and settled decisions in FOUNDATIONS; as-built structure in
  ARCHITECTURE; test strategy in TESTING; a decision with a rejected alternative in an ADR; a testable
  obligation in the requirements tree; presentation in the docs site — and every other document shall
  cite or summarize that home, never restate the fact as independent content.
verification-method: inspection
