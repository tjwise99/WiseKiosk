header: |
  Each fact has a single canonical documentation home
level: 1.37
links: []
normative: true
rationale: |
  Prevents duplicated prose from drifting apart silently. Live example: CLAUDE.md's non-negotiables
  currently restate facts also stated formally in SYS012/SRS003/SRS004 and in ARCHITECTURE —
  defensible only because CLAUDE.md declares itself process-layer, but a live instance of the
  taxonomy being bent. "No fact duplicated across two canonical docs" is not mechanically decidable in
  general — this is a stated review discipline, not a gate.
ref: ''
reviewed: jTz6kWwMmquGP9rLeR33XnaW94z7fXcWndcRGd1ktkA=
status: accepted
text: |
  Every fact about WiseKiosk's product definition, settled decisions, architecture, test strategy, or
  normative obligations shall be authored in exactly one canonical document per the documentation
  taxonomy — product/operator truth in the repository README; settled decisions in FOUNDATIONS;
  as-built structure in ARCHITECTURE; test strategy in TESTING; a decision with a rejected
  alternative in an ADR; a testable obligation in the requirements tree; presentation in the docs
  site — and every other document shall cite or summarize that home, never restate the fact as
  independent content.
verification-justification: |
  Deciding whether two passages state the same fact requires semantic judgement over arbitrary
  prose: no check distinguishes a legitimate summary-with-citation from an independent restatement.
  The decidable half - that the taxonomy table names every canonical document and resolves - is
  SRS075's.
verification-method: inspection
