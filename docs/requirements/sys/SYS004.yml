header: |
  Operator labour is bounded
level: 4
links: []
normative: true
rationale: |
  The operator is frequently not the author: deployments run at friends' and family's houses, on
  separate networks, with separate owners. Their labour is therefore front-loaded by design — real at
  setup, zero afterwards. The three verbs draw the line the earlier wordings kept fudging: something
  outside the system changing (an upstream API, a wanted module, a security patch) needs a *maintain*
  act, which is one of the three and not a violation; the system decaying into needing attention is
  none of them, and is. "Its source" rather than "source material" deliberately: the operator is
  expected to read the in-repo documentation, and SRS004 requires it.
ref: ''
reviewed: FKi-jJSUDykMZmuZ6ynaFM__dVCb2Vz9rb-qgjEu9io=
status: accepted
text: |
  An operator shall be able to set up, validate, and maintain a deployment without reading its source,
  and shall not be needed between those acts.
verification-justification: |
  Each act is discharged by an artifact that either exists and works or does not — a generator, a
  validator, an upgrade path, a restart policy, a healthcheck, a resource-growth bound. What none of
  them settles is whether a non-technical person actually succeeds; that premise is stated in the
  repository README, where it can be read, rather than asserted here as an obligation no check decides.
verification-method: test
