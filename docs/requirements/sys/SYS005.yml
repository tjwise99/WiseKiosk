header: |
  Single-definition internal contract
level: 7
links: []
normative: true
rationale: |
  A shape declared twice drifts, and the drift is invisible until runtime: this is the single worst
  defect class this design guards against (ADR 0001 rev 1). The rule binds definitions, not uses — a
  component whose prop is typed with a generated type is a consumer, not a second declaration. Scope
  is internal: upstream API shapes are defined by whoever runs the API, and the configuration format
  is shared with the operator and governed by
  SYS003<!-- A deployment is parameterised from outside the image -->.
ref: ''
