header: |
  Upstream data reaches the display only through the backend
level: 6
links: []
normative: true
rationale: |
  Two failures share one path. If the browser reaches upstream sources directly, credentials must live
  where a client can see them and every deployment's traffic is attributable to the household running
  it. If a caller can choose what the backend requests, the display becomes an open proxy — someone
  else's traffic against WiseKiosk's key and rate limit. Stating the obligation positively (the set of
  calls is fixed by configuration) rather than as a prohibition on relaying is what makes SRS021 and
  SRS022 trace to it; three earlier wordings named the failure and none of them did.
ref: ''
reviewed: KZtswOlxN1xD3PUvRX2djU9sCMFBskYb-6W5Iq6nOdo=
status: accepted
text: |
  All upstream data shall reach the display only through the backend, which shall issue only the
  upstream requests its configuration calls for, and shall bound how many it makes.
verification-justification: |
  Origin, request shape and volume are all asserted against the running backend. The Content-Security-
  Policy enforces the same clause at the browser against a page compromised through rendered
  third-party data — a case no server-side check reaches.
verification-method: test
