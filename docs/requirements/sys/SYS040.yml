status: proposed
text: |
  The repository shall enforce, in CI, its line-ending hygiene (no CRLF in tracked text) and its
  process gates (branch naming, branch-to-issue linkage, and a Conventional-Commit pull-request
  title, per ADR 0006), so these conventions are checked rather than trusted.
verification-method: inspection
