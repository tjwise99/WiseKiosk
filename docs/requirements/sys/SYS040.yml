header: |
  Repository process and hygiene gates are enforced in CI
level: '1.40'
links: []
normative: true
rationale: |
  check-eol and check-branch already run green in CI but have no presence in the requirements tree —
  the same "the gate exists and passes, but nothing says it must" gap this domain closes for the
  generated-doc gates. Squarely process & repo meta.
ref: ''
