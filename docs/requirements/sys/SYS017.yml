header: |
  Secrets never reach a client in output, by construction
level: 1.17
links: []
normative: true
rationale: |
  Settled decision (never reopened): a key never reaches the browser, and
  the guarantee is structural, not policy. A stripping or redaction step
  fails open the moment a secret is added and the step is not updated; a
  design with no secret-carrying path toward a client has nothing to
  forget.
ref: ''
reviewed: 3n5ok3Mr0OkpTS8DCbZH6N2Ka6dqboelL7rBgXWsxEg=
status: accepted
text: |
  No secret shall reach a client in any API response body or header, or in any error or log output a
  client can observe. This confinement shall hold by construction - the system shall have no code
  path that carries a secret toward a client - never by a stripping or redaction step applied before
  delivery. Configuration delivery is SYS045's obligation.
verification-method: test
