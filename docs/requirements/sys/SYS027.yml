header: |
  First-party code gated before merge
level: 1.27
links: []
normative: true
rationale: |
  This is a solo project with no second human reviewer, so the automated gates
  are the review function - security resting on vigilance is not a control. The
  regression this need guards against is a defect in code the project itself
  authored reaching a deployed image: static security analysis catches
  injection and taint-class flaws, and blocking lint and type checks catch
  style and correctness regressions, both at the point of introduction. They
  are two verification means under one need. Risk inherited from third-party
  dependencies is a distinct need (SYS028) - different origin, remediation, and
  cadence; scanning the whole built image is SYS029.
ref: ''
reviewed: OR5YK6_ubV9wthjsiYiiD4waH0gfEh6fpmomx20Vk4Y=
status: accepted
text: |
  Source code the project authors shall not merge while it carries a detectable security defect or a
  lint or type-correctness violation. Continuous integration shall statically analyse first-party Go
  and Svelte/TypeScript source on every pull request and shall block merge on any finding, at any
  severity. A finding in first-party source has no exception path.
verification-method: test
