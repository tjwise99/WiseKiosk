header: |
  Single-origin data plane
level: 1.22
links: []
normative: true
rationale: |
  Routing every external source through the backend — including sources whose
  APIs permit cross-origin requests — keeps the page's connect-src at 'self',
  keeps response shaping server-side where it is testable, and keeps one
  transport pattern for all sources. This is the anchor the proxy needs that no
  existing need supplies: obtaining data does not by itself require a
  proxy, and secret confinement (SYS017) justifies proxying only secret-bearing
  sources. Enforcing the connect-src content-security policy on the page is the
  security domain's concern (#40), not this need.
ref: ''
reviewed: 98EhHMXZO0ojY4_HwICEbkUyF1KxBu2kbnOgriALLJ8=
status: accepted
text: |
  The display page shall obtain all external data from the backend's own
  origin. Every fetch of upstream data shall occur server-side; the browser
  shall make no direct request to an upstream data source.
verification-method: test
