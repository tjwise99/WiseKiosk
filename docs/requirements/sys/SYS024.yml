header: |
  Modules grow by contract, not by a plugin system
level: 1.24
links: []
normative: true
rationale: |
  Growth to a sixth module must be a documented contract an author follows, not runtime machinery to
  maintain. A plugin system with no plugins is abstraction ahead of a second consumer (SYS041), so
  the contract is prose and the invariant is what this need holds.

  The count and composition of the contract's parts are deliberately not stated here. They are a
  consequence of the design rather than a need it must meet, and stating them at this tier froze a
  number that was already wrong: the contract listed five parts while a module's payload had no way
  to reach the boundary schema, so no module was buildable as specified. The parts live in
  docs/contracts/module-contract.md and their confinement in SRS036, where changing them costs an
  ordinary edit. What must not change is the invariant above.

  Distinct from SYS007 (operator customisation through configuration), which governs an operator
  configuring a deployment, not an author adding a module.
