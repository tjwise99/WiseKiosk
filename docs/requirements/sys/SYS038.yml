header: |
  Generated documentation artifacts are regenerated in CI and fail on drift
level: 1.38
links: []
normative: true
rationale: |
  The same idiom the boundary contract already uses (SYS023: CI regenerates and fails on diff from the
  schema), applied one layer up into docs. ADR 0003/0004 already built the mechanism (`check-arch`,
  `check-site`); this gives it a tree citation.
ref: ''
reviewed: jzRACTZ93mPwIqQNfJ_4Be7yhIgkdEg3_Cb30ec3YtU=
status: accepted
text: |
  Every documentation artifact produced by a generator — architecture diagrams from the LikeC4 model,
  needs pages from the Doorstop tree, and any future generated doc — shall be regenerated in CI and
  shall fail the gate if the committed output differs from a fresh regeneration.
verification-method: test
