header: |
  Rationale is authored in a documentation home, never in source
level: 1.42
links: []
normative: true
rationale: |
  SYS037 places every fact about WiseKiosk in one canonical document, but its text reaches documents
  only — a source file is not one, so rationale copied into a comment sits outside the rule that would
  otherwise catch it. That copy is the failure: it reviews as ordinary code, drifts from the home it was
  taken from, and nothing resolves the disagreement. The boundary-specific instance — an invariant held
  by a comment pointing at its twin — is already forbidden and owned by SYS023; this is the general
  need. Five homes, not four: the taxonomy in docs/README.md gives FOUNDATIONS prose, TESTING prose,
  an ADR, and a requirement's rationale field, ARCHITECTURE being explicitly excluded from carrying
  decision rationale. The repository README is the fifth, and is deliberately the narrowest: it
  carries only product-level reasoning the tree cannot express — that one need outranks another —
  because README prose has no review fingerprint and no gate reads it, so a wider grant would make it
  the cheap place to put a justification rather than the right one. Mechanism comments are untouched
  — how a loop works is a fact about that code, not about WiseKiosk, and has no canonical document to
  be duplicated from. Whether a given sentence is rationale
  or mechanism is a judgment no gate can make, so inspection is the honest method.
