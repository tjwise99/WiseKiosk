text: |
  Every statement of why WiseKiosk is built as it is — a reason, a history, a rejected alternative, or an
  evaluative judgment — shall be authored in exactly one of the documentation homes the taxonomy provides:
  FOUNDATIONS prose, TESTING prose, an ADR, or a requirement's rationale field. A first-party authored
  artifact shall carry mechanism only, and shall reach rationale by citation rather than by restating it.
verification-method: inspection
