text: |
  Every statement of why WiseKiosk is built as it is — a reason, a history, a rejected alternative, or an
  evaluative judgment — shall be authored in exactly one of the documentation homes the taxonomy
  provides: FOUNDATIONS prose, TESTING prose, an ADR, or a requirement's rationale field, and, for
  product-level reasoning the requirements tree cannot express, the repository README. A first-party
  authored artifact shall carry mechanism only, and shall reach rationale by citation rather than by
  restating it.
verification-justification: |
  Whether a sentence in source states why WiseKiosk is built this way, or how this code works, is a
  semantic judgement no parser makes. The mechanically decidable neighbours - comment staleness,
  citation resolution, comment volume - are owned by SYS043 and SYS044.
verification-method: inspection
