header: |
  The test architecture is reviewed on defined triggers
level: 1.34
links: []
normative: true
rationale: |
  TESTING.md "Review cadence" — tests resist deletion more strongly than code, so the review will not
  arise on its own; without a wired trigger the suite silently becomes permanent architecture nobody
  revisits. Inspection is the honest floor: it verifies the triggers are documented and wired, not
  that a given review happened — no recorded-review mechanism exists and this domain does not invent
  one (that would be a control that does not function where deployed, FOUNDATIONS §5).
