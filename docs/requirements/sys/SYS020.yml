rationale: |
  Retired in #18's closing pass as tautological: there is nowhere else a module's upstream data
  could come from, so nothing could violate it. It existed as an anchor giving the proxy
  requirements a parent, which is a structural role rather than a need, and that is why its only
  available verification was watching the system do the obvious thing against live upstreams.

  Its children moved to SYS022, the single-origin data plane, which they genuinely decompose: SRS020
  is the server-side fetch that need requires, and SRS043 is how the page refreshes it. Nothing was
  lost - the liveness concern is carried by SRS022's cache TTLs and SYS005's failure states.
