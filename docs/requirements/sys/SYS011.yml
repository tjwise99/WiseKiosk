header: |
  The documentation can be trusted
level: 11
links: []
normative: true
rationale: |
  A fact in two places is a fact that will disagree with itself, and the reader has no way to tell which
  copy is current. The rule reaches source files as well as documents: a comment restating a decision is
  a second home for it. Divergence is the other half — a generated artifact that is stale, or a citation
  that resolves to something which has moved, misleads more than silence would. Rationale has a narrower
  home set than facts do: ARCHITECTURE states what the system is and never why, and an ADR remains the
  only home for a rejected alternative.
