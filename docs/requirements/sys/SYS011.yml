text: |
  Every fact about WiseKiosk shall be stated in exactly one place, cited rather than restated everywhere
  else, and shall not silently diverge from what it describes.
verification-justification: |
  Citation resolution and generated-artifact drift are decided mechanically. Whether a passage restates
  a fact or cites it is a semantic judgement no parser makes, and it is why this need sits at
  inspection: the decidable neighbours are asserted by its children, and the residue is read at review.
verification-method: inspection
