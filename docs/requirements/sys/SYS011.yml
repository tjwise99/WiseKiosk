text: |
  The display shall be capable of showing how long the wait is for the rides at the theme parks it is
  asked about.
verification-justification: |
  Its children are read from a rendered page whose configuration asks for park wait times, and from the
  shaping that feeds it: which parks the waits are shown for, where they were taken from, how far behind
  the source they may be, how often that source is asked, what crosses the boundary and what a viewer can
  tell apart in the region. A capability is settled by exercising it, so the evidence is a display
  configured to show wait times; one configured without it is outside what this claims rather than a
  failure of it.
  What none of them can reach is whether the wait shown is the wait a viewer would stand in. The source
  is another party's system and lies outside this one, so a check can establish that what is shown is
  what the source reported and how far behind it the display may fall, never that the source is right
  about the queue. A display faithfully showing a wrong wait is this need met, and the same limit is
  already carried the other way where a host's own clock is outside what the tree can be failed against
  (SYS009<!-- A viewer can know the current time and date without looking elsewhere -->).
verification-method: test
