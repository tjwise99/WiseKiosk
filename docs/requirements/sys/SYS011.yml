header: |
  Scope exclusions
level: 1.11
links: []
normative: true
rationale: |
  Each exclusion is machinery bought against a case that does not exist: no
  third-party modules will exist, one instance serves one configuration, and
  the single-trusted-LAN deployment model is what makes running without
  authentication sound.
ref: ''
reviewed: rV12ddLsNLDdE5SJ9nnNhkIsH1VsuyWyET8jfoqHxiE=
status: proposed
text: |
  The system shall include no plugin host or third-party module loading, no
  multi-tenant serving, no user accounts, sessions, or authentication, and no
  compatibility layer with any prior mirror framework. Deployments are
  LAN-only on a single trusted network.
verification-method: inspection
