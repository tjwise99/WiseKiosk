header: |
  A viewer can know how long the ride waits are across the parks without looking elsewhere
level: 16
links: []
normative: true
rationale: |
  The display's roster is a product decision, and park wait times is on it; a module is a need, so the
  park-wait-times module gets one need of its own decomposed by items carrying what is true of this
  module and of nothing else (ADR 0012 rev 2).
  The obligation is a capability rather than an unconditional guarantee, and the configuration is the
  difference. A framework need holds whatever the display is asked to show, nothing being able to switch
  it off. A module is configured in or left out, so a need obliging the display to show the wait times
  outright would go unmet by every deployment that configures none - a permitted deployment rather than
  a defect, and a need no conforming display can be built to meet is not a want but a mistake. What is
  owed is that the display can do this when it is asked to.
  What a viewer gets is stated rather than how it is produced. Which parks the waits are shown for, where
  they are taken from, how recent they are, how often the source is asked for them and what shape they
  cross the boundary in are the decomposition beneath, not clauses of the want: a need listing its own
  children is a hat over them rather than a want.
  The want is the wait as it stands now, and there is no forward half to it. A weather want covers what
  the sky is expected to do next because a viewer reads the sky now and the day ahead as one act
  (SYS010<!-- A viewer can know the weather now and next without looking elsewhere -->); a wait time is a
  now-fact a viewer acts on the instant they read it - whether to join the queue - and a park does not
  publish a wait it expects an hour hence for a viewer to plan around. So no outlook is named here and
  none is owed beneath, and this need is met by the present wait alone.
  No supplier is named, here or anywhere beneath. Which service the wait times are bought from is an
  implementation the repository is edited to change, and a want naming one would make that edit a
  specification change and would tie a viewer's want to a party the viewer has never heard of.
  Nothing here says how the waits are drawn, how large they are or which region carries them: the size
  figure is the styling contract's and the region is the configuration's, both already obliged of every
  module by SYS002<!-- The display's rendering keeps nothing from a viewer --> and its children.
