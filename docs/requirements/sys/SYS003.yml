header: |
  Invalid configuration fails loudly and legibly
level: 1.3
links: []
normative: true
rationale: |
  On a headless kiosk with no keyboard, a silent failure is indistinguishable
  from a hardware fault. The failure must be a product feature: visible,
  plain-language, and actionable by a non-technical operator.
ref: ''
reviewed: aSQQyqh7BYee_G_L0dq4pvHc6YNknfsElUx7DwetxA0=
status: accepted
text: |
  An invalid configuration shall produce a loud, legible failure that states
  what is wrong and what to change. It shall never produce a blank screen or
  silent partial degradation.
verification-method: test
