header: |
  Secrets are delivered by the deployment environment
level: 1.18
links: []
normative: true
rationale: |
  Secrets are delivered, not configured. Keeping every secret out of the
  image, the repository, and the configuration keeps the one published
  image generic (SYS007), the repository publishable, and configuration
  delivery secret-free by construction (SYS017). File-based delivery is
  the convention container platforms and secrets managers already speak,
  so provisioning can be upgraded without touching application code.
ref: ''
reviewed: UYgb2CzlxUsfeCdSoRZMga2gkxSKrcx6c4NyhXvFUSM=
status: accepted
text: |
  Every secret shall be supplied to the backend by the deployment
  environment at runtime. No secret shall be stored in the container
  image, the repository, or the configuration. The delivery mechanism
  shall permit replacing how a secret is provisioned — a bind-mounted
  file today, a secrets manager later — with no application code change.
verification-method: test
