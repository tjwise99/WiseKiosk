header: |
  Third-party dependency risk gated and tracked
level: 1.28
links: []
normative: true
rationale: |
  The project is largely glue over third-party libraries it did not write and
  cannot patch in place, so inherited and transitive dependency vulnerabilities
  are its highest-yield supply-chain exposure. Blocking a known-vulnerable
  version at merge and surfacing updates automatically manages that risk by
  tracking it rather than discovering it after disclosure. Distinct from
  first-party defect gating (SYS027): different origin, a different remediation
  (a version bump, not a code fix), and a different cadence. Scanning the whole
  built image, including base-layer packages the application never imports, is
  SYS029.
ref: ''
reviewed: EmesL75K_tqB4o4cku8TyLVL39wXPUKL4WqTwjIWRts=
status: accepted
text: |
  The project shall not merge a change that introduces a dependency with a known vulnerability at
  any severity, unless that finding carries a current, justified, expiring exception, and shall keep
  its dependency set current through automated update proposals. Continuous integration shall fail a
  pull request on any unexcepted such finding.
verification-method: test
