header: |
  Bounded, polite use of upstream public APIs
level: 1.21
links: []
normative: true
rationale: |
  The upstreams are free public third-party APIs that rate-limit or ban abusive callers, and staying
  inside their fair-use expectations is why this bound exists. That purpose is recorded here rather
  than in the obligation: whether a given bound satisfies a particular upstream's published policy
  is a conclusion drawn by reading that policy, it changes when the upstream changes its terms
  rather than when this system changes, and it is not something this system can verify about itself.
  What the system can be held to is the bound.

  The bound rests on the closed, known source set together with parameter validation against
  known-good patterns (SRS023), request deduplication and short-lived negative caching (SRS022,
  SRS028), per-route rate limiting (SRS024), and outbound timeout and response-size limits (SRS027)
  - not on rate limiting alone. The proxy is bounded this way by design, and a static-analysis
  rate-limiting finding is expected.
ref: ''
reviewed: AKm_dHwE6HKZi7Hifk9N5RxoXvr0MXX7kBUcgRlsOsw=
status: accepted
text: |
  The system shall bound the requests it issues to upstream public APIs - in rate, in volume, and to
  well-formed, recognized requests - and shall never act as an unbounded relay toward them.
verification-method: test
