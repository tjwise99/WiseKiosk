text: |
  The display shall be capable of showing the current time of day and date.
verification-justification: |
  Its children are read from a rendered page whose configuration asks for a clock: where the value came
  from, that it keeps moving while the page stays loaded, and that the hour form and the date follow
  the configuration. A capability is settled by exercising it, so the evidence is a display configured
  to show the time; one configured without a clock is outside what this claims rather than a failure
  of it. That an unreachable backend takes none of it away is settled beneath a different need, this
  one being met or failed the same whether the backend is there or not.
  What none of them can reach is whether the time shown is the true time. The clock of the host running
  the browser is outside this system - the operating system, the runtime and the browser are the
  operator's - so a check can establish that the value is that host's and that it advances, never that
  the host is right. The tree already carries the same limit read the other way, an emulated host's
  clock not being the device's
  (SRS021<!-- Frontend runs on a Pi Zero-class browser host -->,
  TST018<!-- Pending: emulated Pi Zero-class host, and performance bounds -->). Setting the host's
  clock is the operator's, and a display showing a wrong time correctly is this need met.
verification-method: test
