header: |
  A viewer can know the current time and date without looking elsewhere
level: 14
links: []
normative: true
rationale: |
  The display's roster is a product decision, and the clock is on it; a module is a need, so the clock
  gets one need of its own decomposed by items carrying what is true of the clock and of nothing else
  (ADR 0012 rev 2).
  The obligation is a capability rather than an unconditional guarantee, and the configuration is the
  difference. A framework need holds whatever the display is asked to show, nothing being able to
  switch it off. A module is configured in or left out, so a need obliging the display to show the
  time outright would go unmet by every deployment that configures no clock - a permitted deployment
  rather than a defect, and a need no conforming display can be built to meet is not a want but a
  mistake. What is owed is that the display can do this when it is asked to.
  What a viewer gets is stated rather than how it is produced. That the time is taken from the machine
  the page runs on, that it keeps moving, and that its hour form and the showing of its date follow the
  configuration are the decomposition beneath, not clauses of the want: a need listing its own children
  is a hat over them rather than a want.
  The date is named here rather than left to the decomposition, and the two halves of it divide
  cleanly: that the display can show a date is what this want covers, and whether any given display
  does is the configuration's, which is a child's. A viewer glancing at a wall display reads the time
  and the date as one act, and they are the same reading of the same host clock rendered in the same
  region, so a want covering one and not the other would split a single thing across two needs.
  That the clock survives an unreachable backend is not among them, and deliberately. It is true of
  every module that fetches nothing rather than of this one, so it is obliged once at the framework
  (SRS040<!-- A module that fetches nothing renders on through an outage -->) beneath the need about
  failure costing no more than it must; the clock verifies it rather than states it.
  "Current" is load-bearing. A time rendered once and left standing satisfies a want phrased as
  showing the time and fails this one, which is what gives the advancing obligation a parent clause to
  trace to. Nothing here says how the time is formatted, how large it is drawn or which region carries
  it: the size figure is the styling contract's and the region is the configuration's, both already
  obliged of every module by
  SYS002<!-- The display's rendering keeps nothing from a viewer --> and its children.
