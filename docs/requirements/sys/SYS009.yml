status: accepted
text: |
  The display shall show the current time of day.
verification-justification: |
  Its children are read from a rendered page: where the value came from, that it keeps moving while the
  page stays loaded, that the hour form and the date follow the configuration, and that a backend that
  is gone takes none of it away.
  What none of them can reach is whether the time shown is the true time. The clock of the host running
  the browser is outside this system - the operating system, the runtime and the browser are the
  operator's - so a check can establish that the value is that host's and that it advances, never that
  the host is right. The tree already carries the same limit read the other way, an emulated host's
  clock not being the device's
  (SRS021<!-- Frontend runs on a Pi Zero-class browser host -->,
  TST018<!-- Pending: emulated Pi Zero-class host, and performance bounds -->). Setting the host's
  clock is the operator's, and a display showing a wrong time correctly is this need met.
verification-method: test
