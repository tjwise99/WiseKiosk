header: |
  Modules grow by contract
level: 9
links: []
normative: true
rationale: |
  A sixth module must not mean editing the framework, or the cost of each addition grows with the
  number already present and the blast radius of a mistake grows with it. The prohibitions this need
  once carried — no dynamic loading, no discovery, no runtime registry, no third-party extension API —
  were struck as generality against a case nobody proposed. Reopen if a push or real-time transport is
  added: a module fed by a socket may require shared framework change, at which point this need either
  blocks a legitimate feature or must be scoped to pull-based modules.
ref: ''
reviewed: tf7grKzQp6z4Xnv2kCe1PEvssAsF7YR-HmGXlUTFyyM=
status: accepted
text: |
  A display module shall be addable and removable as a self-contained unit, without change to shared
  framework code.
verification-justification: |
  Self-containment is decidable: adding or removing a module touches a bounded, named set of
  module-scoped locations, and nothing else. What the checks do not settle is whether the contract is
  pleasant to work with — only that it holds.
verification-method: test
