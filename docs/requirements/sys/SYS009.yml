header: |
  A viewer knows the time of day without looking elsewhere
level: 14
links: []
normative: true
rationale: |
  The display's roster is a product decision, and the clock is on it; a module is a need, so the clock
  gets one need of its own decomposed by items carrying what is true of the clock and of nothing else
  (ADR 0012 rev 2). This is the first of those needs, and until one landed nothing in the tree said the
  display showed anything at all.
  What a viewer gets is stated rather than how it is produced. That the time is taken from the machine
  the page runs on, that it keeps moving, that its hour form and whether a date joins it follow the
  configuration, and that it survives a backend that is gone are the decomposition beneath, not clauses
  of the want: a need listing its own children is a hat over them rather than a want.
  "Current" is the whole of the demand and is deliberately load-bearing. A time rendered once and left
  standing satisfies a want phrased as showing the time and fails this one, which is what gives the
  advancing obligation a parent clause to trace to. Nothing here says how the time is formatted, how
  large it is drawn or which region carries it: the size figure is the styling contract's and the
  region is the configuration's, both already obliged of every module by
  SYS002<!-- The display's rendering keeps nothing from a viewer --> and its children.
