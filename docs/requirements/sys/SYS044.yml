header: |
  Prose in authored source is bounded, and the checks deciding it cover every language present
level: 1.44
links: []
normative: true
rationale: |
  The third of this domain's needs, and the one aimed at bulk rather than at placement or staleness. SYS042
  asks where a fact is authored and SYS043 asks whether a comment has gone stale; neither is violated by a
  correct, current, well-placed wall of prose, which is nonetheless the failure this domain was raised to
  stop — an author, and increasingly an automated one, explaining at length in the file instead of in the
  document that owns the explanation. Bounding the quantity is what makes the documentation facility the
  path of least resistance rather than a convention people mean to follow. Two quantities, because they
  fail differently: an individual comment can be long, and a change can add many short ones. The coverage
  clause rides here because a bound is only as true as the set of files it reaches — a check silently
  skipping a language reports success it has not earned (SYS031), and scoping coverage to the languages
  actually present keeps the obligation verifiable today and stops an arm being built for a stack that has
  not arrived (SYS041). Wholly mechanical, so unlike SYS043 this need claims test without qualification.
