status: accepted
text: |
  The volume of prose a first-party authored artifact carries shall be bounded — both the length of an
  individual comment outside the language's documentation facility, and the quantity a single change adds.
  What counts as such a comment shall be decided from the language's own structure rather than by matching
  text, and every language present in the repository shall either be covered by that decision or have its
  exclusion recorded.
verification-method: test
