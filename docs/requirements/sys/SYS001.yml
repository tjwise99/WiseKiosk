header: |
  Failure is legible and proportionate
level: 1
links: []
normative: true
rationale: |
  A failure nobody can see is indistinguishable from a system that is working, and an operator who is
  not the author cannot diagnose what the display does not show. Proportionality is the second half:
  an upstream source failing must not take the page down, while a configuration that cannot be read at
  all legitimately may — the bound is what the failure requires, not a fixed blast radius. Stated as
  containment it would have been satisfiable by defining "the part that failed" as everything.
