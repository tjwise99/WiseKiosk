status: accepted
text: |
  Every failure shall be legible on the display, and shall degrade no more of it than the failure
  requires.
verification-justification: |
  Each child asserts a rendered state against an induced failure, so the parent is settled by its
  children. What no check settles is whether the resulting text is intelligible to a person who did not
  write it; the plain-language obligations in SRS001, SRS002, SRS004 and SRS026 are read at review.
  This sentence is the corpus's only record that legibility is a human review obligation, so the
  items it names must be the ones that carry a plain-language clause.
verification-method: test
