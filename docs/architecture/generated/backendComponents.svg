<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="3137.5,-180 2778.5,-180 2778.5,0 3137.5,0 3137.5,-180"/>
<text text-anchor="start" x="2902.5" y="-129" font-family="Arial" font-size="20.00" fill="#eff6ff">Open&#45;Meteo</text>
<text text-anchor="start" x="2799" y="-107" font-family="Arial" font-size="15.00" fill="#bfdbfe">The weather service the weather module reads.</text>
<text text-anchor="start" x="2867.5" y="-90" font-family="Arial" font-size="15.00" fill="#bfdbfe">Run by somebody else and</text>
<text text-anchor="start" x="2814" y="-73" font-family="Arial" font-size="15.00" fill="#bfdbfe">outside the boundary. Which service this is,</text>
<text text-anchor="start" x="2905.5" y="-56" font-family="Arial" font-size="15.00" fill="#bfdbfe">is an edit to this</text>
<text text-anchor="start" x="2809.5" y="-39" font-family="Arial" font-size="15.00" fill="#bfdbfe">repository: no requirement names it, and the</text>
</g>
