<text text-anchor="start" x="2742" y="-842" font-family="Arial" font-size="20.00" fill="#eff6ff">Operator</text>
<text text-anchor="start" x="2634" y="-820" font-family="Arial" font-size="15.00" fill="#bfdbfe">Deploys WiseKiosk, authors its configuration</text>
<text text-anchor="start" x="2701.5" y="-803" font-family="Arial" font-size="15.00" fill="#bfdbfe">and supplies its secrets.</text>
</g>
<!-- frontend -->
<g id="node8" class="node">
<title>frontend</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1874.5,-918 1519.5,-918 1519.5,-738 1874.5,-738 1874.5,-918"/>
<text text-anchor="start" x="1568" y="-823.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="1612" y="-876" font-family="Arial" font-size="20.00" fill="#eff6ff">Frontend</text>
<text text-anchor="start" x="1853" y="-823.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="1612" y="-855.6" font-family="Arial" font-size="13.00" fill="#bfdbfe">Svelte 5, static single&#45;page bundle</text>
<text text-anchor="start" x="1612" y="-836" font-family="Arial" font-size="15.00" fill="#bfdbfe">Runs in the browser on the display</text>
<text text-anchor="start" x="1612" y="-819" font-family="Arial" font-size="15.00" fill="#bfdbfe">host. Validates the configuration</text>
<text text-anchor="start" x="1612" y="-802" font-family="Arial" font-size="15.00" fill="#bfdbfe">before applying it, assembles the</text>
<text text-anchor="start" x="1612" y="-785" font-family="Arial" font-size="15.00" fill="#bfdbfe">configured modules into one</text>
<text text-anchor="start" x="1612" y="-768" font-family="Arial" font-size="15.00" fill="#bfdbfe">full&#45;screen layout, and renders</text>
</g>
<!-- openmeteo -->
<g id="node9" class="node">
