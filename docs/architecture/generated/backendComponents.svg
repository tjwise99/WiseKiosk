<title>%3</title>
<g id="clust1" class="cluster">
<title>cluster_backend</title>
<polygon fill="#194b9e" stroke="#1b3d88" points="8,-315 8,-615 3170,-615 3170,-315 8,-315"/>
<text text-anchor="start" x="16" y="-603.2" font-family="Arial" font-weight="bold" font-size="11.00" fill="#bfdbfe" fill-opacity="0.701961">BACKEND</text>
</g>
<!-- staticserving -->
<g id="node1" class="node">
<title>staticserving</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="2675.5,-535 2328.5,-535 2328.5,-355 2675.5,-355 2675.5,-535"/>
<text text-anchor="start" x="2442.5" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Static serving</text>
<text text-anchor="start" x="2384.5" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">Serves the frontend bundle and the</text>
<text text-anchor="start" x="2415" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">configuration file as bytes,</text>
<text text-anchor="start" x="2370.5" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">interpreting neither. The configuration is</text>
<text text-anchor="start" x="2426.5" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">not in the image and is</text>
<text text-anchor="start" x="2349" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">read from the served tree on each request for</text>
</g>
<!-- routehandler -->
<g id="node2" class="node">
<title>routehandler</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1537,-535 1169,-535 1169,-355 1537,-355 1537,-535"/>
<text text-anchor="start" x="1289.5" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Route handler</text>
<text text-anchor="start" x="1200" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">Serves one route per upstream source. Owns</text>
<text text-anchor="start" x="1290" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">the order the other</text>
<text text-anchor="start" x="1208.5" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">parts run in, and calls the module&#39;s shaping</text>
<text text-anchor="start" x="1283.5" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">functions to build the</text>
<text text-anchor="start" x="1189" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">upstream request and to parse what comes back</text>
</g>
<!-- weathershaping -->
<g id="node3" class="node">
<title>weathershaping</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="390,-535 48,-535 48,-355 390,-355 390,-535"/>
<text text-anchor="start" x="143" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Weather shaping</text>
<text text-anchor="start" x="73.5" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">The weather module&#39;s half of this container.</text>
<text text-anchor="start" x="150.5" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">Serves the route the</text>
<text text-anchor="start" x="75.5" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">boundary schema declares for it: reads the</text>
<text text-anchor="start" x="159" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">location out of the</text>
<text text-anchor="start" x="68" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">request through the type generated from that</text>
</g>
<!-- responsecache -->
<g id="node4" class="node">
<title>responsecache</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="2218,-535 1892,-535 1892,-355 2218,-355 2218,-535"/>
<text text-anchor="start" x="1980.5" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Response cache</text>
<text text-anchor="start" x="1933" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">Holds a route&#39;s last success and last</text>
<text text-anchor="start" x="1963.5" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">failure, each for the interval</text>
<text text-anchor="start" x="1912" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">that route&#39;s entry sets, so a display refresh</text>
<text text-anchor="start" x="1995.5" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">no faster than the</text>
<text text-anchor="start" x="1955.5" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">interval reaches no upstream.</text>
</g>
<!-- upstreamclient -->
<g id="node5" class="node">
<title>upstreamclient</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="3130,-535 2786,-535 2786,-355 3130,-355 3130,-535"/>
<text text-anchor="start" x="2888.5" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Upstream client</text>
<text text-anchor="start" x="2806" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">Makes the outbound request a route calls for,</text>
<text text-anchor="start" x="2899" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">under that route&#39;s</text>
<text text-anchor="start" x="2844.5" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">timeout, response&#45;size ceiling and</text>
<text text-anchor="start" x="2877" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">request&#45;rate bound, and</text>
<text text-anchor="start" x="2827.5" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">resolves the source&#39;s secret as it goes.</text>
</g>
<!-- requestrejection -->
<g id="node6" class="node">
<title>requestrejection</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1059,-535 735,-535 735,-355 1059,-355 1059,-535"/>
<text text-anchor="start" x="819" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Request rejection</text>
<text text-anchor="start" x="755" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">Holds the rejection a request that does not</text>
<text text-anchor="start" x="827.5" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">conform is answered</text>
<text text-anchor="start" x="763" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">with: a status distinct to its cause, and a</text>
<text text-anchor="start" x="823.5" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">body the frontend can</text>
<text text-anchor="start" x="764" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">render, one shape for every route so no</text>
</g>
<!-- operator -->
<g id="node7" class="node">
<title>operator</title>
