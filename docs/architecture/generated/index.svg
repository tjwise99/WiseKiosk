<!-- operator -->
<g id="node1" class="node">
<title>operator</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="336,-535 0,-535 0,-355 336,-355 336,-535"/>
<text text-anchor="start" x="128" y="-459" font-family="Arial" font-size="20.00" fill="#eff6ff">Operator</text>
<text text-anchor="start" x="20" y="-437" font-family="Arial" font-size="15.00" fill="#bfdbfe">Deploys WiseKiosk, authors its configuration</text>
<text text-anchor="start" x="87.5" y="-420" font-family="Arial" font-size="15.00" fill="#bfdbfe">and supplies its secrets.</text>
</g>
<!-- wisekiosk -->
<g id="node2" class="node">
<title>wisekiosk</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="719.5,-180 390.5,-180 390.5,0 719.5,0 719.5,-180"/>
<text text-anchor="start" x="508.5" y="-121" font-family="Arial" font-size="20.00" fill="#eff6ff">WiseKiosk</text>
<text text-anchor="start" x="427.5" y="-99" font-family="Arial" font-size="15.00" fill="#bfdbfe">Full&#45;screen, config&#45;driven smart&#45;mirror</text>
<text text-anchor="start" x="457" y="-82" font-family="Arial" font-size="15.00" fill="#bfdbfe">display. The boundary is what</text>
<text text-anchor="start" x="411" y="-65" font-family="Arial" font-size="15.00" fill="#bfdbfe">deploys: the published container image and</text>
<text text-anchor="start" x="507" y="-48" font-family="Arial" font-size="15.00" fill="#bfdbfe">what it serves.</text>
</g>
<!-- viewer -->
<g id="node3" class="node">
<title>viewer</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="897,-535 571,-535 571,-355 897,-355 897,-535"/>
<text text-anchor="start" x="703.5" y="-459" font-family="Arial" font-size="20.00" fill="#eff6ff">Viewer</text>
<text text-anchor="start" x="591" y="-437" font-family="Arial" font-size="15.00" fill="#bfdbfe">Reads the display. Provides no input to the</text>
<text text-anchor="start" x="707.5" y="-420" font-family="Arial" font-size="15.00" fill="#bfdbfe">system.</text>
</g>
<!-- openmeteo -->
<g id="node4" class="node">
<title>openmeteo</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1366.5,-535 1007.5,-535 1007.5,-355 1366.5,-355 1366.5,-535"/>
<text text-anchor="start" x="1131.5" y="-484" font-family="Arial" font-size="20.00" fill="#eff6ff">Open&#45;Meteo</text>
<text text-anchor="start" x="1028" y="-462" font-family="Arial" font-size="15.00" fill="#bfdbfe">The weather service the weather module reads.</text>
<text text-anchor="start" x="1096.5" y="-445" font-family="Arial" font-size="15.00" fill="#bfdbfe">Run by somebody else and</text>
<text text-anchor="start" x="1043" y="-428" font-family="Arial" font-size="15.00" fill="#bfdbfe">outside the boundary. Which service this is,</text>
<text text-anchor="start" x="1134.5" y="-411" font-family="Arial" font-size="15.00" fill="#bfdbfe">is an edit to this</text>
<text text-anchor="start" x="1038.5" y="-394" font-family="Arial" font-size="15.00" fill="#bfdbfe">repository: no requirement names it, and the</text>
</g>
