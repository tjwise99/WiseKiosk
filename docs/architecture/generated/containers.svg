<text text-anchor="start" x="799" y="-440.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="843" y="-493" font-family="Arial" font-size="20.00" fill="#eff6ff">Backend</text>
<text text-anchor="start" x="1077" y="-440.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="843" y="-472.6" font-family="Arial" font-size="13.00" fill="#bfdbfe">Go</text>
<text text-anchor="start" x="843" y="-453" font-family="Arial" font-size="15.00" fill="#bfdbfe">Stateless HTTP proxy and static</text>
<text text-anchor="start" x="843" y="-436" font-family="Arial" font-size="15.00" fill="#bfdbfe">file server. Answers one route per</text>
<text text-anchor="start" x="843" y="-419" font-family="Arial" font-size="15.00" fill="#bfdbfe">upstream source, shaping each</text>
<text text-anchor="start" x="843" y="-402" font-family="Arial" font-size="15.00" fill="#bfdbfe">response into the payload the</text>
<text text-anchor="start" x="843" y="-385" font-family="Arial" font-size="15.00" fill="#bfdbfe">boundary</text>
</g>
<!-- frontend -->
<g id="node2" class="node">
