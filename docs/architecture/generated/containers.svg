<text text-anchor="start" x="141" y="-493" font-family="Arial" font-size="20.00" fill="#eff6ff">Frontend</text>
<text text-anchor="start" x="382" y="-440.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="141" y="-472.6" font-family="Arial" font-size="13.00" fill="#bfdbfe">Svelte 5, static single&#45;page bundle</text>
<text text-anchor="start" x="141" y="-453" font-family="Arial" font-size="15.00" fill="#bfdbfe">Runs in the browser on the display</text>
<text text-anchor="start" x="141" y="-436" font-family="Arial" font-size="15.00" fill="#bfdbfe">host. Validates the configuration</text>
<text text-anchor="start" x="141" y="-419" font-family="Arial" font-size="15.00" fill="#bfdbfe">before applying it, assembles the</text>
<text text-anchor="start" x="141" y="-402" font-family="Arial" font-size="15.00" fill="#bfdbfe">configured modules into one</text>
<text text-anchor="start" x="141" y="-385" font-family="Arial" font-size="15.00" fill="#bfdbfe">full&#45;screen layout, and renders</text>
</g>
