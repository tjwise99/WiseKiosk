<g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(15.05 862.05)">
<title>%3</title>
<g id="clust1" class="cluster">
<title>cluster_frontend</title>
<polygon fill="#194b9e" stroke="#1b3d88" points="8,-8 8,-663 2344,-663 2344,-8 8,-8"/>
<text text-anchor="start" x="16" y="-651.2" font-family="Arial" font-weight="bold" font-size="11.00" fill="#bfdbfe" fill-opacity="0.701961">FRONTEND</text>
</g>
<!-- pageshell -->
<g id="node1" class="node">
<title>pageshell</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="394.5,-583 47.5,-583 47.5,-403 394.5,-403 394.5,-583"/>
<text text-anchor="start" x="174.5" y="-532" font-family="Arial" font-size="20.00" fill="#eff6ff">Page shell</text>
<text text-anchor="start" x="68" y="-510" font-family="Arial" font-size="15.00" fill="#bfdbfe">Loads and renders before any configuration is</text>
<text text-anchor="start" x="179" y="-493" font-family="Arial" font-size="15.00" fill="#bfdbfe">applied, so a</text>
<text text-anchor="start" x="84.5" y="-476" font-family="Arial" font-size="15.00" fill="#bfdbfe">configuration that cannot be applied at all</text>
<text text-anchor="start" x="150" y="-459" font-family="Arial" font-size="15.00" fill="#bfdbfe">is reported on a page</text>
<text text-anchor="start" x="77" y="-442" font-family="Arial" font-size="15.00" fill="#bfdbfe">that exists rather than on a blank one. Asks</text>
</g>
<!-- clock -->
<g id="node2" class="node">
<title>clock</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="837,-583 505,-583 505,-403 837,-403 837,-583"/>
<text text-anchor="start" x="646" y="-532" font-family="Arial" font-size="20.00" fill="#eff6ff">Clock</text>
<text text-anchor="start" x="528" y="-510" font-family="Arial" font-size="15.00" fill="#bfdbfe">Renders the time of day into the region the</text>
<text text-anchor="start" x="600" y="-493" font-family="Arial" font-size="15.00" fill="#bfdbfe">configuration gives it,</text>
<text text-anchor="start" x="525" y="-476" font-family="Arial" font-size="15.00" fill="#bfdbfe">taken from the clock of the host running the</text>
<text text-anchor="start" x="613" y="-459" font-family="Arial" font-size="15.00" fill="#bfdbfe">browser and kept</text>
<text text-anchor="start" x="534" y="-442" font-family="Arial" font-size="15.00" fill="#bfdbfe">tracking real time for as long as the page</text>
</g>
<!-- weather -->
<g id="node3" class="node">
<title>weather</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1401.5,-583 1056.5,-583 1056.5,-403 1401.5,-403 1401.5,-583"/>
<text text-anchor="start" x="1191.5" y="-532" font-family="Arial" font-size="20.00" fill="#eff6ff">Weather</text>
<text text-anchor="start" x="1097" y="-510" font-family="Arial" font-size="15.00" fill="#bfdbfe">Renders the weather into the region the</text>
<text text-anchor="start" x="1140.5" y="-493" font-family="Arial" font-size="15.00" fill="#bfdbfe">configuration gives it: what</text>
<text text-anchor="start" x="1090.5" y="-476" font-family="Arial" font-size="15.00" fill="#bfdbfe">it is doing now, and what is expected over</text>
<text text-anchor="start" x="1144" y="-459" font-family="Arial" font-size="15.00" fill="#bfdbfe">the coming hours and the</text>
<text text-anchor="start" x="1077" y="-442" font-family="Arial" font-size="15.00" fill="#bfdbfe">coming days, each told apart from the others,</text>
</g>
<!-- configuration -->
<g id="node4" class="node">
<title>configuration</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="2303.5,-583 1966.5,-583 1966.5,-403 2303.5,-403 2303.5,-583"/>
<text text-anchor="start" x="1989.5" y="-532" font-family="Arial" font-size="20.00" fill="#eff6ff">Configuration load and validation</text>
<text text-anchor="start" x="1987" y="-510" font-family="Arial" font-size="15.00" fill="#bfdbfe">Fetches the configuration on each page load</text>
<text text-anchor="start" x="2059" y="-493" font-family="Arial" font-size="15.00" fill="#bfdbfe">and validates it against</text>
<text text-anchor="start" x="1989.5" y="-476" font-family="Arial" font-size="15.00" fill="#bfdbfe">the schema, reporting an error it can isolate</text>
<text text-anchor="start" x="2070" y="-459" font-family="Arial" font-size="15.00" fill="#bfdbfe">as belonging to one</text>
<text text-anchor="start" x="1989" y="-442" font-family="Arial" font-size="15.00" fill="#bfdbfe">module rather than to the configuration as a</text>
</g>
<!-- layout -->
<g id="node5" class="node">
<title>layout</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1856,-228 1512,-228 1512,-48 1856,-48 1856,-228"/>
<text text-anchor="start" x="1609" y="-177" font-family="Arial" font-size="20.00" fill="#eff6ff">Layout assembly</text>
<text text-anchor="start" x="1532.5" y="-155" font-family="Arial" font-size="15.00" fill="#bfdbfe">Places each configured module into its region</text>
<text text-anchor="start" x="1626" y="-138" font-family="Arial" font-size="15.00" fill="#bfdbfe">of one full&#45;screen</text>
<text text-anchor="start" x="1541.5" y="-121" font-family="Arial" font-size="15.00" fill="#bfdbfe">layout, and reflows rather than overlapping</text>
<text text-anchor="start" x="1606.5" y="-104" font-family="Arial" font-size="15.00" fill="#bfdbfe">or scrolling sideways at</text>
<text text-anchor="start" x="1532" y="-87" font-family="Arial" font-size="15.00" fill="#bfdbfe">narrower viewports. Holds every region out of</text>
</g>
<!-- modulehost -->
<g id="node6" class="node">
<title>modulehost</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="1856,-583 1512,-583 1512,-403 1856,-403 1856,-583"/>
<text text-anchor="start" x="1629.5" y="-532" font-family="Arial" font-size="20.00" fill="#eff6ff">Module host</text>
<text text-anchor="start" x="1534" y="-510" font-family="Arial" font-size="15.00" fill="#bfdbfe">Stands between the layout and one module&#39;s</text>
<text text-anchor="start" x="1600" y="-493" font-family="Arial" font-size="15.00" fill="#bfdbfe">component, one host per</text>
<text text-anchor="start" x="1532.5" y="-476" font-family="Arial" font-size="15.00" fill="#bfdbfe">placement. Fetches that module&#39;s payload on</text>
<text text-anchor="start" x="1625.5" y="-459" font-family="Arial" font-size="15.00" fill="#bfdbfe">the module&#39;s own</text>
<text text-anchor="start" x="1532" y="-442" font-family="Arial" font-size="15.00" fill="#bfdbfe">cadence, abandons a read that has not come</text>
</g>
<!-- viewer -->
<g id="node7" class="node">
<title>viewer</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="2710,-228 2384,-228 2384,-48 2710,-48 2710,-228"/>
<text text-anchor="start" x="2516.5" y="-152" font-family="Arial" font-size="20.00" fill="#eff6ff">Viewer</text>
<text text-anchor="start" x="2404" y="-130" font-family="Arial" font-size="15.00" fill="#bfdbfe">Reads the display. Provides no input to the</text>
<text text-anchor="start" x="2520.5" y="-113" font-family="Arial" font-size="15.00" fill="#bfdbfe">system.</text>
</g>
<!-- backend -->
<g id="node8" class="node">
<title>backend</title>
<polygon fill="#3b82f6" stroke="#2563eb" stroke-width="0" points="3202,-228 2854,-228 2854,-48 3202,-48 3202,-228"/>
<text text-anchor="start" x="2902" y="-133.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="2946" y="-186" font-family="Arial" font-size="20.00" fill="#eff6ff">Backend</text>
<text text-anchor="start" x="3180" y="-133.8" font-family="Arial" font-size="14.00" fill="#eff6ff"> </text>
<text text-anchor="start" x="2946" y="-165.6" font-family="Arial" font-size="13.00" fill="#bfdbfe">Go</text>
<text text-anchor="start" x="2946" y="-146" font-family="Arial" font-size="15.00" fill="#bfdbfe">Stateless HTTP proxy and static</text>
<text text-anchor="start" x="2946" y="-129" font-family="Arial" font-size="15.00" fill="#bfdbfe">file server. Answers one route per</text>
<text text-anchor="start" x="2946" y="-112" font-family="Arial" font-size="15.00" fill="#bfdbfe">upstream source, shaping each</text>
<text text-anchor="start" x="2946" y="-95" font-family="Arial" font-size="15.00" fill="#bfdbfe">response into the payload the</text>
<text text-anchor="start" x="2946" y="-78" font-family="Arial" font-size="15.00" fill="#bfdbfe">boundary</text>
</g>
