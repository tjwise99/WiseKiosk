# The Go generator's view of the one boundary schema, as an OpenAPI Overlay applied before
# generation (ADR 0008 rev 4). It only subtracts: nothing here adds, renames or reshapes, and the
# schema stays the single authored source.
#
# It removes a module data route's request parameters, which that route's registration entry judges
# off the raw query. Selection is by the `module-route` tag rather than by path, so no module's name
# reaches the Go generator's configuration.
overlay: 1.0.0
info:
  title: WiseKiosk boundary contract, as the Go generator reads it
  # Required by the Overlay specification and read by nothing, as with the schema's own.
  version: 0.1.0
actions:
  - target: $.paths[*][*][?(@.tags[?(@ == "module-route")])].parameters
    description: >-
      A module data route's parameters are the registration entry's to judge, so the Go side binds
      none and needs no binding helper.
    remove: true
