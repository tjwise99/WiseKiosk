# oapi-codegen's own configuration. The Go side generates the boundary types, the route table for
# the schema's infrastructure routes, and the client the backend probes itself with — so no such
# route is hand-authored here and the drift gate sees routes rather than types alone
# (ADR 0008 rev 4). `std-http-server` binds against the standard library's own ServeMux and pulls no
# router (ADR 0001 rev 1).
# Paths are resolved against the working directory, which is `backend/` (the `codegen` recipe).
package: boundary
output: internal/boundary/boundary.gen.go
generate:
  models: true
  std-http-server: true
  client: true
output-options:
  # A component no path references is pruned by default, and the error bodies are contributed by
  # the schema ahead of the module routes that carry them. It is also what keeps a module's payload
  # types, whose only path is excluded below.
  skip-prune: true
  # A module data route is served from the route registration list rather than from a generated
  # handler, so the Go side takes its payload types and no route (ADR 0008 rev 4). Excluding on the
  # tag rather than on an operation id is what keeps this configuration free of any module's name:
  # a module marks its own route in the schema and nothing here is edited for it. The exclusion is
  # what leaves the emitted code needing no module at all — a generated handler would bind the
  # route's parameters through `github.com/oapi-codegen/runtime`, and a proxy this size is not worth
  # a dependency tree.
  exclude-tags:
    - module-route
