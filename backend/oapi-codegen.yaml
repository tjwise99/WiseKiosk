# oapi-codegen's own configuration. Types only — no client, no server, no embedded spec: the
# backend generates the boundary types and nothing else from the schema (ADR 0008 rev 2).
# Paths are resolved against the working directory, which is `backend/` (the `codegen` recipe).
package: boundary
output: internal/boundary/boundary.gen.go
generate:
  models: true
output-options:
  # A component no path references is pruned by default, and `paths` is empty until a module
  # contributes a route — which would emit an empty package.
  skip-prune: true
